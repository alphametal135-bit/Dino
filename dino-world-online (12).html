  const cam = CAMERA[ch.id];

  const canvas = document.createElement('canvas');
  container.appendChild(canvas);

  let renderer = null;
  let world = null;
  let input = null;
  let fx = null;
  let skillFx = null;
  let raf = 0;
  let running = true;
  const onResize = () => resize();
  let toggleGod = () => {};
  let toggleRide = () => {};
  let useSkill = () => {};
  const onKey = (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyE') toggleRide();
    else if (e.code === 'KeyG') toggleGod();
    else if (e.code === 'KeyQ') useSkill();
  };

  function cleanup() {
    running = false;
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('orientationchange', onResize);
    if (input) input.dispose();
    if (fx) fx.dispose();
    if (skillFx) skillFx.dispose();
    setGroundFn(null);
    if (world) world.dispose();
    if (renderer) {
      renderer.dispose();
      try { renderer.forceContextLoss(); } catch { /* ignore */ } // free the GL context so replays don't pile up
    }
    canvas.remove();
  }

  let resize = () => {};

  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: quality === 'high' || quality === 'ultra', powerPreference: 'high-performance' });
    let pr = Math.min(window.devicePixelRatio || 1, q.pixelRatio);
    renderer.setPixelRatio(pr);
    renderer.shadowMap.enabled = q.shadows;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if (q.filmic) { try { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; } catch { /* keep the default look */ } }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, 1, 0.3, 1200);
    world = createWorld(scene, q, renderer);
    setGroundFn(world.ground); // characters now stand on rocks as well as on the terrain
    world.onThunder = (dist) => setTimeout(() => { noise(2.2, 0.32 * clamp(1 - dist / 260, 0.15, 1), 260); tone(55, 1.2, 'sine', 0.2, -20); }, (dist / 343) * 1000); // sound travels at 343 m/s
    fx = createFireFx(scene);
    skillFx = createSkillFx(scene);

    // ---- the player ----
    const sp = findSpawnPoint();
    const player = createFighter('player', ch.id, sp.x, sp.z, Math.atan2(sp.x, sp.z)); // faces the island interior
    player.maxHp = Math.round(player.maxHp * (perks.hpMul || 1)); // level perks
    player.hp = player.maxHp;
    player.dmgMul = perks.dmgMul || 1;
    player.god = false;
    player.ride = null; // the dinosaur being ridden
    const playerModel = createCharacter(ch.id, color);
    scene.add(playerModel.root);
    const fighters = [[player, playerModel]];

    // ---- war mode: the opposite kind appears in front of the player ----
    let enemy = null;
    let ai = null;
    let food = [];
    let foodVis = null;
    if (war) {
      const ek = ch.id === 'human' ? 'trex' : 'human';
      const pos = randomEnemySpot(world, player); // anywhere on the island, not in front of the player
      enemy = createFighter('enemy', ek, pos.x, pos.z, Math.atan2(-(player.x - pos.x), -(player.z - pos.z)));
      const enemyModel = createCharacter(ek, ENEMY_COLORS[ek]);
      scene.add(enemyModel.root);
      fighters.push([enemy, enemyModel]);
      enemy.maxHp = Math.round(enemy.maxHp * Math.min(2, 1 + 0.12 * (round - 1))); // tougher every round
      enemy.hp = enemy.maxHp;
      enemy.dmgMul = Math.min(1.6, 1 + 0.08 * (round - 1));
      enemy.ai = !!DINO[ek];
      if (ek === 'trex') { // only the dinosaur grazes (and drinks at the sea); a human enemy just walks around
        food = createFoodField(enemy.x, enemy.z, (x, z) => foodSpotFree(world, x, z), Math.max(20, Math.round(FOOD.count * q.detail)));
        foodVis = createFoodVisuals(scene, food);
      }
      ai = createAiMemory(round, food);
    }
    const playerTargets = enemy ? [enemy] : [];
    if (!food.length) { // free roam / human enemy: the animals still need grass to eat
      food = createFoodField(player.x, player.z, (x, z) => foodSpotFree(world, x, z), Math.max(20, Math.round(FOOD.count * q.detail)));
      foodVis = createFoodVisuals(scene, food);
    }
    const wild = spawnWildlife(scene, player, world, q.detail, food, round); // triceratops herd + raptor pack, same brain as the T-Rex
    wild.forEach((w) => { fighters.push([w.f, w.model]); playerTargets.push(w.f); });

    input = createInput(canvas, touchRoot);
    window.addEventListener('keydown', onKey);

    // ---- human only: invincibility toggle + riding any dinosaur ----
    let ride = null;
    let skillReq = 0;
    const mountables = fighters.filter(([f]) => f.ai).map(([f, m]) => ({ f, m, mem: f === enemy ? ai : (wild.find((w) => w.f === f) || {}).mem }));
    // Ride works on ANY living dinosaur: within CLIMB_R metres of its body the hero climbs on at once; further away (up to RIDE_R) he runs / swims to it first.
    // A flyer high in the air cannot be reached (it has to be down within 4 m of the ground); a grabbed one is busy.
    const CLIMB_R = 7;
    const RIDE_R = 70;
    const pickMount = (maxD) => {
      let best = null;
      let bd = maxD;
      for (const c of mountables) {
        if (!c.f.alive || c.f.grabbedBy || c.f.ridden || (c.f.growth || 1) < 0.6) continue; // a hatchling is too small to ride
        if (c.f.flying && c.f.y - heightAt(c.f.x, c.f.z) > 4) continue;
        const d = Math.hypot(c.f.x - player.x, c.f.z - player.z) - CHARACTERS[c.f.kind].radius;
        if (d < bd) { bd = d; best = c; }
      }
      return best;
    };
    const nearMount = () => pickMount(RIDE_R);
    let autoRide = null; // { c, t }: the hero is on his way to a dinosaur
    let climb = null; // { t, x, y, z }: the hero's start point (in the mount's frame) while he climbs onto the saddle
    const dismount = () => {
      if (!ride) return;
      const d = ride.f;
      const a = d.heading + Math.PI / 2; // steps off to its side
      const off = CHARACTERS[d.kind].radius + 1.2;
      player.x = d.x - Math.sin(a) * off;
      player.z = d.z - Math.cos(a) * off;
      const gh = heightAt(player.x, player.z);
      const deepSea = gh < SEA_LEVEL - SWIM_DEPTH;
      // off a flyer: falls from where it was; in deep water: stays at the mount's depth (a diver) or at the surface; otherwise on the ground
      player.y = d.flying ? Math.max(gh, d.y) : deepSea ? Math.max(gh + 0.1, Math.min(d.y, SEA_LEVEL - 0.6)) : gh;
      player.vx = player.vz = player.vy = 0;
      player.onGround = !deepSea && player.y <= gh + 0.05;
      player.diving = deepSea && player.y < -1;
      scene.add(playerModel.root);
      Object.assign(d, { ridden: false, skillT: -1, swingT: -1, firing: false, zap: false, ice: false, wave: false, spinA: 0, spawned: false, comboN: 0 }); // back to its own AI
      player.ride = null;
      ride = null;
      climb = null;
      skillReq = 0;
      snap(player);
    };
    const mountNow = (c) => {
      ride = c;
      autoRide = null;
      // where the hero is, in the mount's own frame: from there he leaps up to the saddle (see the frame loop)
      const dx = player.x - c.f.x;
      const dz = player.z - c.f.z;
      const ch2 = Math.cos(c.f.heading);
      const sh = Math.sin(c.f.heading);
      climb = { t: 0, x: dx * ch2 - dz * sh, y: player.y - c.f.y, z: dx * sh + dz * ch2 };
      player.ride = c.f;
      Object.assign(c.f, { skillT: -1, swingT: -1, firing: false, zap: false, ice: false, wave: false, comboN: 0, eating: false, drinking: false, ridden: true });
      if (c.f.grab) { c.f.grab.grabbedBy = null; c.f.grab = null; }
      c.f.carry = 0;
      if (c.mem) { c.mem.provoked = false; cancelNeeds(c.mem); } // a ridden animal is calm: it only does what the rider asks
      c.m.root.add(playerModel.root); // the rider is a child of the mount's model, so it moves with it
      player.vx = player.vz = 0;
    };
    toggleRide = () => {
      if (ch.id !== 'human' || !player.alive) return;
      if (ride) { dismount(); return; }
      if (autoRide) { autoRide = null; return; } // pressed again while running over: cancels
      const near = pickMount(CLIMB_R);
      if (near) { mountNow(near); return; }
      const c = pickMount(RIDE_R);
      if (c) autoRide = { c, t: 0 };
    };
    // while the hero runs to the dinosaur he chose: steers him there (any stick input takes control back)
    const autoRideInput = (inp, dt) => {
      if (!autoRide) return null;
      const c = autoRide.c;
      autoRide.t += dt;
      const stick = Math.hypot(inp.fwd || 0, inp.strafe || 0);
      if (!player.alive || !c.f.alive || c.f.ridden || c.f.grabbedBy || stick > 0.4 || autoRide.t > 25) { autoRide = null; return null; }
      const dx = c.f.x - player.x;
      const dz = c.f.z - player.z;
      const d = Math.hypot(dx, dz) || 1e-6;
      if (d - CHARACTERS[c.f.kind].radius < CLIMB_R - 1 && !(c.f.flying && c.f.y - heightAt(c.f.x, c.f.z) > 4)) {
        mountNow(c);
        return null;
      }
      return { fwd: -dz / d, strafe: dx / d, yaw: 0, run: true, jump: false, dive: false, attack: false, aim: false, aimYaw: 0 };
    };
    toggleGod = () => { if (ch.id === 'human') player.god = !player.god; };
    let enemyN = 0;
    const respawnEnemy = () => { // the war enemy died while it was the player's mount: a new hostile one comes at him, the round goes on
      const pos = findEnemySpawn(player.x, player.z, player.heading, 40);
      const e = createFighter(`enemy${++enemyN}`, enemy.kind, pos.x, pos.z, Math.atan2(-(player.x - pos.x), -(player.z - pos.z)));
      e.maxHp = enemy.maxHp;
      e.hp = e.maxHp;
      e.dmgMul = enemy.dmgMul;
      e.ai = true;
      const model = createCharacter(e.kind, ENEMY_COLORS[e.kind]);
      scene.add(model.root);
      fighters.push([e, model]);
      const mem = createAiMemory(round, food);
      mem.provoked = true;
      mem.delay = 1.2;
      const i = playerTargets.indexOf(enemy);
      if (i >= 0) playerTargets[i] = e;
      mountables.push({ f: e, m: model, mem });
      enemy = e;
      ai = mem;
      snap(e);
    };
    useSkill = () => { if (ride && ride.f.comboN >= RIDE_COMBO && ride.f.skillT < 0) skillReq = 1.2; }; // asks for the skill; held a moment so it fires as soon as the current blow ends

    resize = () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    resize();

    let camYaw = player.heading;
    let camPitch = 0.35;
    let camD = cam.dist;
    let camL = cam.lift;
    const cmd = { fwd: 0, strafe: 0, yaw: 0, run: false, jump: false, dive: false, attack: false, aim: false, aimYaw: 0 };

    let acc = 0;
    let last = performance.now();
    let frames = 0;
    let fpsTime = 0;
    let endTimer = 0;
    const ROUND_END_PANEL = false; // the win / lose panel is switched off for now: a death changes nothing, the game goes on (the rule will be redesigned)
    let roundEnded = false;
    let roundTime = 0;
    const evs = [];
    const foc = { x: player.x, y: player.y, z: player.z }; // smoothed camera focus
    const snap = (f) => {
      f.px = f.x;
      f.py = f.y;
      f.pz = f.z;
      f.ph = f.heading;
    };
    // ---- renewal of the species: 20 minutes after a wild dinosaur dies, an egg of the same species appears and a new one hatches ----
    const ecoSfx = (type, x, z) => {
      const d = Math.hypot(x - player.x, z - player.z);
      if (d > 45) return;
      const v = clamp(1 - d / 45, 0.15, 1);
      if (type === 'crack') noise(0.08, 0.2 * v, 3500);
      else if (type === 'tap') tone(260, 0.07, 'sine', 0.12 * v, -80);
      else if (type === 'hatch') { noise(0.35, 0.3 * v, 1800); tone(520, 0.25, 'triangle', 0.25 * v, 380); }
    };
    const eco = createEcosystem(scene, world, ecoSfx);
    const removeWild = (w) => {
      if (ride && ride.f === w.f) dismount();
      const rm = (arr, fn) => { const i = arr.findIndex(fn); if (i >= 0) arr.splice(i, 1); };
      rm(wild, (x) => x === w);
      rm(fighters, ([f]) => f === w.f);
      rm(playerTargets, (f) => f === w.f);
      rm(mountables, (c) => c.f === w.f);
      scene.remove(w.model.root);
    };
    const applyGrowth = (w, g) => {
      const f = w.f;
      if (w.baseMax === undefined) { w.baseMax = f.maxHp; w.baseDmg = f.dmgMul; }
      const ratio = f.maxHp > 0 ? f.hp / f.maxHp : 1;
      f.maxHp = Math.max(1, Math.round(w.baseMax * (0.35 + 0.65 * g)));
      f.hp = f.alive ? Math.max(1, ratio * f.maxHp) : f.hp;
      f.dmgMul = w.baseDmg * (0.4 + 0.6 * g);
      f.growth = g;
      w.model.setGrowth(g);
    };
    const makeBaby = (w, sl) => { // a baby: tiny, eats often (every meal makes it grow), cannot fly yet
      const g = eco.growthOf(sl);
      w.mem.eventIdx = sl.eats || 0;
      if (g < 0.999) {
        w.mem.needs = { ...w.mem.needs, firstAfter: 20, every: 70 };
        w.mem.mealAt = w.mem.clock + 20;
        w.babyNeeds = true;
      }
      applyGrowth(w, g);
    };
    const addHatchling = (ev) => {
      const sea = !!CHARACTERS[ev.kind].aquatic;
      const f = createFighter(ev.id, ev.kind, ev.x, ev.z, Math.random() * Math.PI * 2);
      if (sea) { f.y = ev.y + 1; f.swimming = true; f.diving = true; }
      f.maxHp = Math.round(f.maxHp * Math.min(2, 1 + 0.12 * (round - 1)));
      f.hp = f.maxHp;
      f.dmgMul = Math.min(1.6, 1 + 0.08 * (round - 1));
      f.ai = true;
      const model = createCharacter(ev.kind, WILD[ev.kind].color);
      scene.add(model.root);
      const mem = createAiMemory(round, food, ev.kind);
      const w = { f, model, kind: ev.kind, mem };
      wild.push(w);
      fighters.push([f, model]);
      playerTargets.push(f);
      mountables.push({ f, m: model, mem });
      makeBaby(w, eco.slot(ev.id));
      snap(f);
    };
    // mothers: a due egg is laid by the nearest living adult of the same species (she stops, crouches, and the egg appears behind her)
    const layers = new Map(); // slot id -> mother
    const motherOk = (w, kind) => w.kind === kind && w.f.alive && !w.f.grabbedBy && !w.f.ridden && !w.mem.provoked && !w.mem.layReq && !w.mem.lay && (w.f.growth || 1) >= 0.85;
    const ecoEvents = (evs) => {
      for (const ev of evs) {
        if (ev.type === 'due') {
          let best = null;
          let bd = Infinity;
          for (const w of wild) {
            if (!motherOk(w, ev.kind)) continue;
            const d = Math.hypot(w.f.x - player.x, w.f.z - player.z);
            if (d < bd) { bd = d; best = w; }
          }
          if (best) {
            best.mem.layReq = true;
            best.layWait = 0;
            layers.set(ev.id, best);
            eco.takeMother(ev.id);
          }
        } else if (ev.type === 'hatch') {
          const old = wild.find((w) => w.f.id === ev.id);
          if (old) removeWild(old);
          addHatchling(ev);
        }
      }
    };
    const ecoTick = () => {
      const wall = Date.now();
      for (const w of wild.slice()) {
        if (!w.f.alive && !w.f.deathLogged && w.f.deadT > 0.5) { // a dinosaur seen dead starts its 20 minutes now
          w.f.deathLogged = true;
          eco.recordDeath(w.f, wall);
        }
        if (!w.f.alive && w.f.deadT > 300) removeWild(w); // the body is gone after 5 minutes (the egg is still owed)
      }
      for (const [id, w] of layers) { // mothers that are laying
        if (w.mem.layDone) {
          w.mem.layDone = false;
          layers.delete(id);
          const h = w.f.heading;
          eco.layEgg(id, w.f.x + Math.sin(h) * 2.8, w.f.z + Math.cos(h) * 2.8, wall); // behind her
        } else if (!w.f.alive || !wild.includes(w) || w.mem.provoked || (w.mem.layReq && (w.layWait += 0.5) > 120)) {
          w.mem.layReq = false; // she was attacked, died, or could not land: the egg is due again
          w.mem.lay = null;
          layers.delete(id);
          eco.cancelMother(id);
        }
      }
      ecoEvents(eco.update(wall));
      for (const w of wild.slice()) { // babies grow from what they eat
        const sl = eco.slot(w.f.id);
        if (sl && sl.state === 'alive' && w.f.alive) {
          if ((sl.eats || 0) !== w.mem.eventIdx) eco.setEats(w.f.id, w.mem.eventIdx);
          const target = eco.growthOf(sl);
          const cur = w.f.growth || 1;
          if (Math.abs(target - cur) > 0.003) applyGrowth(w, cur + (target - cur) * 0.35);
          if (target >= 0.999 && w.babyNeeds) { w.babyNeeds = false; w.mem.needs = NEEDS_BY[w.kind] || NEEDS; } // grown up: the adult schedule again
        }
      }
      eco.cull(player.x, player.z);
    };
    {
      const wall = Date.now();
      for (const w of wild.slice()) { // at start: the ones that died earlier are gone (their egg or baby takes over)
        const sl = eco.slot(w.f.id);
        if (sl && (sl.state === 'dead' || sl.state === 'egg')) removeWild(w);
      }
      eco.owe('nest0', 'ptero', wall, 45000); // once per save: a pterosaur mother near the start lays an egg after ~45 s, so the egg stage can be seen early
      ecoEvents(eco.update(wall));
      for (const [id, sl] of eco.all()) { // a nest that hatched in an earlier session: its animal is still alive
        if (id.startsWith('nest') && sl.state === 'alive' && !wild.some((w) => w.f.id === id)) {
          addHatchling({ id, kind: sl.kind, x: sl.ex, y: sl.ey, z: sl.ez, growth: eco.growthOf(sl) });
        }
      }
      for (const w of wild) { // hatched in an earlier session: back at the nest, at the size its meals have given it
        const sl = eco.slot(w.f.id);
        if (sl && sl.state === 'alive' && sl.ex !== undefined) {
          w.f.x = sl.ex; w.f.z = sl.ez; w.f.y = sl.ey + (CHARACTERS[w.kind].aquatic ? 1 : 0);
          makeBaby(w, sl);
        }
      }
    }
    let ecoAcc = 0;
    fighters.forEach(([f]) => snap(f));
    let lowFps = 0;
    let shake = 0; // camera shake from heavy footsteps

    const frame = (now) => {
      if (!running) return;
      raf = requestAnimationFrame(frame);
      const rawDt = (now - last) / 1000;
      last = now;
      const dt = Math.min(rawDt, 0.1);

      const inp = input.poll();
      camYaw -= inp.lookDX * LOOK_SENS;
      camPitch = clamp(camPitch + inp.lookDY * LOOK_SENS, -0.15, 1.35);

      cmd.fwd = inp.fwd;
      cmd.strafe = inp.strafe;
      cmd.run = inp.run;
      cmd.jump = inp.jump;
      cmd.dive = inp.dive;
      cmd.yaw = camYaw;
      cmd.attack = inp.attack;
      cmd.aim = inp.attack || (!!player.ride && player.ride.skillT >= 0); // while attacking (or casting) the body faces where the camera looks
      cmd.skill = skillReq > 0;
      if (player.ride && player.ride.skillT >= 0) skillReq = 0;
      skillReq = Math.max(0, skillReq - dt);
      cmd.aimYaw = camYaw;

      if (player.alive && (!enemy || enemy.alive)) roundTime += dt;
      evs.length = 0;
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps < 5) {
        snap(player);
        if (enemy) snap(enemy);
        for (const w of wild) snap(w.f);
        const ar = player.ride ? null : autoRideInput(inp, STEP); // Ride pressed far from the dinosaur: the hero runs / swims over by himself
        const pc = player.alive ? (player.ride ? cmd : ar || cmd) : IDLE;
        if (player.ride) { // riding: the player's input drives the dinosaur (same combo: normal attacks, then its element skill)
          const d = player.ride;
          stepPlayer(d, pc, STEP, CHARACTERS[d.kind]);
          world.collide(d);
          updateCombat(d, playerTargets, pc, STEP, evs);
          Object.assign(player, { x: d.x, y: d.y, z: d.z, heading: d.heading, vx: 0, vz: 0, vy: 0, speed: 0, onGround: true, swimming: false });
          if (!d.alive) { // the mount died: the rider is unhurt and carries on; the round does not end because of it
            const wasEnemy = d === enemy;
            dismount();
            if (wasEnemy) respawnEnemy();
            else if (enemy && enemy.alive && ai) { // the enemy keeps attacking the human
              ai.provoked = true;
              ai.farT = 0;
              ai.delay = Math.max(ai.delay, 0.3);
              cancelNeeds(ai);
            }
          }
        } else {
          stepPlayer(player, pc, STEP, ch);
          world.collide(player);
          updateCombat(player, playerTargets, pc, STEP, evs);
        }
        if (enemy && enemy !== player.ride) {
          checkProvoked(player, enemy, ai);
          const ec = aiInput(enemy, player, STEP, ai);
          stepPlayer(enemy, ec, STEP, CHARACTERS[enemy.kind]);
          world.collide(enemy);
          updateCombat(enemy, [player], ec, STEP, evs);
          separate(player, enemy);
        }
        updateWildlife(wild, player, world, STEP, evs);
        updateHunts(fighters.map(([f]) => f), wild, STEP, evs); // water dinosaurs drag swimmers of another element under
        updateFood(food, STEP);
        if (!player.alive && player.deadT > 3) { // after being killed the hero comes back after a moment and the game goes on
          const r = createFighter('player', ch.id, sp.x, sp.z, Math.atan2(sp.x, sp.z));
          r.maxHp = player.maxHp; r.hp = r.maxHp; r.dmgMul = player.dmgMul;
          Object.assign(player, r);
          player.thud = false;
          snap(player);
        }
        acc -= STEP;
        steps++;
      }
      if (steps === 5) acc = 0;

      const alpha = clamp(acc / STEP, 0, 1); // render between the last two fixed steps => smooth at any refresh rate
      for (const e of evs) {
        if (e.type === 'hit' && e.amount < 5) continue; // fire ticks are too frequent to each make a sound
        if (SFX[e.type]) SFX[e.type]();
      }
      for (const [f, m] of fighters) {
        if (f === player && player.ride) { // seated on the mount's back (local position inside its model)
          const [sx, sy, sz] = SADDLE[player.ride.kind];
          const am = ride.m.anim;
          let px = sx;
          let py = sy - 0.82 + Math.sin(am.phase * 2) * 0.06 * am.mv;
          let pz = sz;
          if (climb) { // the leap onto the saddle: from where he stood, in an arc
            climb.t += dt;
            const k = clamp(climb.t / 0.7, 0, 1);
            const e = k * k * (3 - 2 * k);
            px = lerp(climb.x, px, e);
            pz = lerp(climb.z, pz, e);
            py = lerp(climb.y, py, e) + Math.sin(Math.PI * k) * 1.6;
            if (k >= 1) climb = null;
          }
          m.root.position.set(px, py, pz);
          m.root.rotation.y = 0;
        } else {
          m.root.position.set(lerp(f.px, f.x, alpha), lerp(f.py, f.y, alpha), lerp(f.pz, f.z, alpha));
          m.root.rotation.y = f.ph + wrapAngle(f.heading - f.ph) * alpha + (f.spinA || 0); // spinA: the raptor's one full spin
        }
        m.update(dt, f);
        if (f === player && player.ride) m.sit(ride.m.anim);
        const aev = m.anim.events;
        const avol = f === player ? 1 : clamp(1 - Math.hypot(f.x - player.x, f.z - player.z) / 60, 0, 1);
        if (!f.alive && !f.thud && f.deadT >= m.fallTime * 0.85) {
          f.thud = true;
          aev.push({ type: 'thud' });
        }
        for (const e of aev) {
          animSound(e, f.kind, avol);
          if (f.kind === 'trex') {
            if (e.type === 'step') shake = Math.min(0.3, shake + 0.06 * avol * (e.soft ? 0.5 : 1));
            else if (e.type === 'land') shake = Math.min(0.3, shake + 0.2 * e.amt * avol);
            else if (e.type === 'thud') shake = Math.min(0.3, shake + 0.25 * avol);
          }
        }
        aev.length = 0;
        m.flash(f.hurtT > 0 ? clamp(f.hurtT / 0.15, 0, 1) : 0);
        m.fall(f.alive ? 0 : clamp(f.deadT / m.fallTime, 0, 1));
        if (f.firing) fx.emit(f, dt);
        else if (f.ice) fx.emit(f, dt, 'ice');
        else if (f.wave) fx.emit(f, dt, 'water');
      }
      fx.update(dt);
      skillFx.update(fighters, dt);

      // round end: someone died; show the result after a short beat
      if (ROUND_END_PANEL && enemy && !roundEnded && (!player.alive || !enemy.alive)) {
        endTimer += dt;
        if (endTimer >= ROUND_END_DELAY) {
          roundEnded = true;
          try { if (document.pointerLockElement) document.exitPointerLock(); } catch { /* ignore */ }
          if (onRoundEnd) onRoundEnd({ result: player.alive ? 'won' : 'lost', time: roundTime, hpFrac: player.hp / player.maxHp });
        }
      }

      // third-person orbit camera behind the player
      const sk = 1 - Math.exp(-14 * dt);
      const ct = player.ride ? CAMERA[player.ride.kind] || cam : cam;
      camD += (ct.dist - camD) * sk * 0.4;
      camL += (ct.lift - camL) * sk * 0.4;
      foc.x += (lerp(player.px, player.x, alpha) - foc.x) * sk;
      foc.y += (lerp(player.py, player.y, alpha) - foc.y) * sk;
      foc.z += (lerp(player.pz, player.z, alpha) - foc.z) * sk;
      const ty = foc.y + camL;
      const cp = Math.cos(camPitch);
      const cx = foc.x + Math.sin(camYaw) * cp * camD;
      const cz = foc.z + Math.cos(camYaw) * cp * camD;
      const cy = Math.max(ty + Math.sin(camPitch) * camD, heightAt(cx, cz) + 0.6);
      camera.position.set(cx, cy, cz);
      if (shake > 0.002) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        shake *= Math.exp(-9 * dt);
      }
      camera.lookAt(foc.x, ty, foc.z);

      world.update(player, now * 0.001, camera.position, dt);
      if (foodVis) foodVis.update(now * 0.001);
      eco.frame(dt, now * 0.001, Date.now());
      ecoAcc += dt;
      if (ecoAcc >= 0.5) { ecoAcc = 0; ecoTick(); }
      renderer.render(scene, camera);

      if (onCombat) {
        let he = enemy && enemy.alive ? { f: enemy, mem: ai, wild: false } : null; // the HUD shows the nearest animal that is close, else the enemy
        let hd = enemy && enemy.alive ? Math.hypot(enemy.x - player.x, enemy.z - player.z) : Infinity;
        for (const w of wild) {
          const d = Math.hypot(w.f.x - player.x, w.f.z - player.z);
          if (w.f.alive && d < 45 && d < hd) { he = { f: w.f, mem: w.mem, wild: true }; hd = d; }
        }
        onCombat({
          hp: (player.ride || player).hp,
          maxHp: (player.ride || player).maxHp,
          god: !!player.god,
          riding: !!player.ride,
          combo: ride ? ride.f.comboN : 0,
          comboMax: RIDE_COMBO,
          skillReady: !!ride && ride.f.comboN >= RIDE_COMBO && ride.f.skillT < 0,
          skillEl: ride ? DINO[ride.f.kind].skill : '',
          canRide: !player.ride && !!nearMount(),
          energy: player.energy,
          drowning: !!(player.drowning || (player.ride && player.ride.drowning)),
          depth: Math.max(0, -(player.y)),
          underwater: world.underwater,
          weather: world.weather,
          hour: world.hour,
          egg: eco.nearInfo(player.x, player.z, Date.now()),
          energyMax: COMBAT.trex.energyMax,
          enemy: he ? { kind: he.f.kind, wild: he.wild, hp: he.f.hp, maxHp: he.f.maxHp, dist: hd, rel: wrapAngle(Math.atan2(-(he.f.x - player.x), -(he.f.z - player.z)) - camYaw), state: aiState(he.f, he.mem) } : null,
        });
      }

      frames++;
      fpsTime += rawDt;
      if (fpsTime >= 0.5) {
        lowFps = frames / fpsTime < 28 ? lowFps + 1 : 0;
        if (lowFps >= 6 && pr > 0.75) { // slow for ~3 s: lower the render resolution a step
          pr = Math.max(0.75, pr - 0.25);
          renderer.setPixelRatio(pr);
          resize();
          lowFps = 0;
        }
        if (onStats) {
          onStats({
            fps: Math.round(frames / fpsTime),
            x: player.x,
            y: player.y,
            z: player.z,
            speed: player.speed,
            swimming: player.swimming,
            diving: player.diving,
            weather: world.weather,
            hour: world.hour,
            onGround: player.onGround,
          });
        }
        frames = 0;
        fpsTime = 0;
      }
    };
    raf = requestAnimationFrame(frame);
  } catch (err) {
    cleanup();
    throw err;
  }

  return { stop: cleanup, toggleGod: () => toggleGod(), toggleRide: () => toggleRide(), useSkill: () => useSkill() };
}

// ===== client/js/main.js =====
// client/js/main.js — menu, settings, language and game start/stop.
// Does NOT import Three.js: the menu keeps working even if the 3D library cannot be loaded.


const $ = (sel) => document.querySelector(sel);

const KEY = 'dwo.settings.v1';
const COLORS = ['#c0392b', '#2980b9', '#27ae60', '#f39c12', '#8e44ad', '#16a085'];
const KINDS = ['human']; // the player is always the human
const QUALITIES = ['low', 'medium', 'high', 'ultra'];
const isTouch = window.matchMedia('(pointer: coarse)').matches;

function loadSaved() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || {};
  } catch {
    return {};
  }
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(settings));
  } catch {
    /* storage unavailable (private mode) — settings just won't persist */
  }
}

const saved = loadSaved();
const settings = {
  lang: saved.lang === 'ar' || saved.lang === 'en'
    ? saved.lang
    : (navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : 'en',
  name: typeof saved.name === 'string' ? saved.name.slice(0, 16) : '',
  kind: KINDS.includes(saved.kind) ? saved.kind : 'human',
  color: COLORS.includes(saved.color) ? saved.color : COLORS[0],
  quality: QUALITIES.includes(saved.quality) ? saved.quality : (isTouch ? 'low' : 'medium'),
  war: typeof saved.war === 'boolean' ? saved.war : true,
};

let game = null;

// ---- progression: XP, levels, quests, round streak (saved in localStorage) ----
const PKEY = 'dwo.progress.v1';
const QUESTS = [
  { id: 'wins', target: 3, reward: 80, key: 'qWins' },
  { id: 'flawless', target: 1, reward: 60, key: 'qFlawless' },
  { id: 'quick', target: 1, reward: 60, key: 'qQuick' },
];

function loadProgress() {
  let p = {};
  try {
    p = JSON.parse(localStorage.getItem(PKEY)) || {};
  } catch {
    p = {};
  }
  const n = (v) => (Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0);
  const quests = {};
  QUESTS.forEach((q) => { quests[q.id] = n(p.quests && p.quests[q.id]); });
  return { xp: n(p.xp), wins: n(p.wins), losses: n(p.losses), quests, claimed: p.claimed && typeof p.claimed === 'object' ? p.claimed : {} };
}

const progress = loadProgress();
let round = 1; // consecutive wins in this session: every round the enemy gets tougher
let lastWon = false;

function saveProgress() {
  try {
    localStorage.setItem(PKEY, JSON.stringify(progress));
  } catch {
    /* storage unavailable */
  }
}

const xpForLevel = (lv) => 100 + 60 * (lv - 1);

function levelInfo() {
  let lv = 1;
  let xp = progress.xp;
  while (lv < 50 && xp >= xpForLevel(lv)) {
    xp -= xpForLevel(lv);
    lv++;
  }
  return { lv, xp, need: xpForLevel(lv) };
}

// every level: +6% health and +5% damage
function perks() {
  const lv = levelInfo().lv - 1;
  return { hpMul: 1 + 0.06 * lv, dmgMul: 1 + 0.05 * lv };
}

function renderProgress() {
  const L = levelInfo();
  $('#progress-line').textContent = `${t('level')} ${L.lv} · XP ${L.xp}/${L.need} · ${t('wins')}: ${progress.wins}`;
}

function setScreen(name) {
  $('#screen-menu').classList.toggle('hidden', name !== 'menu');
  $('#screen-loading').classList.toggle('hidden', name !== 'loading');
  $('#hud').classList.toggle('hidden', name !== 'hud');
  if (name !== 'hud') $('#screen-result').classList.add('hidden');
}

function sanitizeName(raw) {
  // strip control characters, collapse spaces, limit length
  return String(raw).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
}

function renderMenu() {
  setLang(settings.lang);
  applyI18n();
  renderProgress();
  $('#in-name').value = settings.name;
  $('#in-quality').value = settings.quality;
  $('#in-war').checked = settings.war;
  document.querySelectorAll('.choice').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.kind === settings.kind));
  });
  document.querySelectorAll('.swatch').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.color === settings.color));
  });
}

function buildSwatches() {
  const box = $('#swatches');
  COLORS.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.dataset.color = c;
    b.style.background = c;
    b.setAttribute('aria-label', c);
    b.addEventListener('click', () => {
      settings.color = c;
      persist();
      renderMenu();
    });
    box.appendChild(b);
  });
}

function showStats(s) {
  const status = s.swimming ? (s.diving ? t('dive') : t('swim')) : s.onGround ? t('ground') : t('air');
  const hr = Math.floor(s.hour || 0);
  const mn = Math.floor(((s.hour || 0) - hr) * 60);
  $('#hud-info').textContent =
    `${settings.name} · ${t(settings.kind)}${settings.war ? ` · ${t('round')} ${round}` : ''}\n` +
    `${s.fps} FPS · ${status}\n` +
    `${t('pos')}: ${Math.round(s.x)}, ${Math.round(s.y)}, ${Math.round(s.z)}\n` +
    `${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')} · ${t('w_' + (s.weather || 'clear'))}`;
}

const pct = (v, max) => `${Math.max(0, Math.min(100, (v / max) * 100))}%`;

// arrow pointing at the enemy relative to where the camera looks (rel > 0 = to the left)
const ARROWS = ['⬆', '↖', '⬅', '↙', '⬇', '↘', '➡', '↗'];
const enemyArrow = (rel) => ARROWS[((Math.round(rel / (Math.PI / 4)) % 8) + 8) % 8];

// called every frame by the game: health bars + fire energy
function showCombat(d) {
  $('#bar-hp').style.width = pct(d.hp, d.maxHp);
  $('#txt-hp').textContent = `${settings.name}  ${Math.ceil(d.hp)}`;
  $('#bar-energy').style.width = pct(d.energy, d.energyMax);
  $('#btn-god').setAttribute('aria-pressed', String(!!d.god));
  const rb = $('#btn-ride');
  const rt = d.riding ? `${t('dismount')} ${d.combo}/${d.comboMax}` : t('ride'); // while riding: the combo count
  if (rb.textContent !== rt) rb.textContent = rt;
  const at = t(d.riding ? 'atkRide' : settings.kind === 'human' ? 'atkSword' : 'atkFire');
  if ($('#btn-attack').textContent !== at) $('#btn-attack').textContent = at;
  const sb = $('#btn-skill');
  sb.classList.toggle('hidden', !d.skillReady); // appears after 6 hits, disappears once used
  if (d.skillReady && sb.dataset.el !== d.skillEl) {
    sb.dataset.el = d.skillEl;
    sb.textContent = t('skill_' + d.skillEl);
  }
  rb.disabled = !d.riding && !d.canRide;
  $('#underwater-tint').classList.toggle('hidden', !d.underwater);
  const al = $('#hud-alert');
  let msg = d.drowning ? t('drowningMsg') : d.underwater && d.depth > 1 ? `${t('depth')}: ${d.depth.toFixed(1)}${t('meters')}` : '';
  if (!msg && d.egg) { const l = d.egg.left; msg = `${t('egg')} ${t(d.egg.kind)} · ${t('eggHatchIn')} ${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}${d.egg.cracked ? ' · ' + t('eggCracked') : ''}`; }
  al.classList.toggle('hidden', !msg);
  if (msg && al.textContent !== msg) al.textContent = msg;
  if (d.enemy) {
    $('#bar-enemy').style.width = pct(d.enemy.hp, d.enemy.maxHp);
    $('#txt-enemy').textContent = `${d.enemy.wild ? t(d.enemy.kind) : t('enemy')}${ELEMENT[d.enemy.kind] ? ' (' + t('el_' + ELEMENT[d.enemy.kind]) + ')' : ''} ${enemyArrow(d.enemy.rel)} ${Math.round(d.enemy.dist)}${t('meters')} · ${Math.ceil(d.enemy.hp)}${d.enemy.state !== 'hostile' ? ' · ' + t(d.enemy.state) : ''}`;
  }
}

function showResult({ result, time, hpFrac }) {
  const won = result === 'won';
  lastWon = won;
  const before = levelInfo().lv;
  let gain = won ? 50 + 15 * (round - 1) : 15;
  const done = [];
  if (won) {
    progress.wins++;
    progress.quests.wins++;
    if (hpFrac > 0.5) progress.quests.flawless++;
    if (time <= 40) progress.quests.quick++;
  } else {
    progress.losses++;
  }
  QUESTS.forEach((q) => {
    if (!progress.claimed[q.id] && progress.quests[q.id] >= q.target) {
      progress.claimed[q.id] = true;
      gain += q.reward;
      done.push(`✔ ${t(q.key)}  +${q.reward} XP`);
    }
  });
  progress.xp += gain;
  const L = levelInfo();
  const open = QUESTS.filter((q) => !progress.claimed[q.id])
    .map((q) => `${t(q.key)}: ${Math.min(progress.quests[q.id], q.target)}/${q.target}`);
  const lines = [`${t('round')} ${round} · ${t('xpGain')}: +${gain} XP`, ...done];
  if (L.lv > before) lines.push(`⬆ ${t('levelUp')} ${t('level')} ${L.lv}`);
  lines.push(`${t('level')} ${L.lv} · XP ${L.xp}/${L.need}`);
  if (open.length) lines.push('', `${t('questsTitle')}:`, ...open);
  if (QUESTS.every((q) => progress.claimed[q.id])) { // all done: a fresh set starts
    progress.claimed = {};
    QUESTS.forEach((q) => { progress.quests[q.id] = 0; });
  }
  saveProgress();
  $('#result-title').textContent = t(won ? 'youWon' : 'youLost');
  $('#result-info').textContent = lines.join('\n');
  $('#screen-result').classList.remove('hidden');
}

let starting = false;

async function play() {
  if (starting) return; // ignore double taps while the world is loading
  starting = true;
  if (game) {
    game.stop();
    game = null;
  }
  $('#menu-msg').textContent = '';
  settings.name = sanitizeName($('#in-name').value) || t('defaultName');
  settings.quality = $('#in-quality').value;
  settings.war = $('#in-war').checked;
  persist();
  setScreen('loading');
  try {
    await ensureThree();
    game = startGame({
      container: $('#stage'),
      kind: settings.kind,
      color: settings.color,
      quality: settings.quality,
      war: settings.war,
      touchRoot: $('#touch'),
      onStats: showStats,
      onCombat: showCombat,
      onRoundEnd: showResult,
      perks: perks(),
      round,
    });
    $('#touch').classList.toggle('hidden', !isTouch);
    $('#btn-attack').textContent = t(settings.kind === 'human' ? 'atkSword' : 'atkFire');
    $('#war-hud').classList.toggle('hidden', !settings.war);
    $('#btn-god').classList.toggle('hidden', settings.kind !== 'human'); // human only
    $('#btn-ride').classList.toggle('hidden', settings.kind !== 'human');
    $('#btn-god').textContent = t('god');
    $('#crosshair').classList.toggle('hidden', !settings.war);
    $('#energy-hud').classList.toggle('hidden', settings.kind !== 'trex');
    $('#hud-hint').textContent = t(isTouch ? 'hintTouch' : 'hintPc');
    showStats({ fps: 0, x: 0, y: 0, z: 0, swimming: false, onGround: true });
    setScreen('hud');
  } catch (err) {
    console.error(err);
    game = null;
    const failedToLoadThree = String(err && err.message).includes('THREE_LOAD_FAILED');
    $('#menu-msg').textContent = t(failedToLoadThree ? 'errThree' : 'errWebgl');
    setScreen('menu');
  } finally {
    starting = false;
  }
}

function backToMenu() {
  round = 1;
  if (game) game.stop();
  game = null;
  renderMenu();
  setScreen('menu');
}

buildSwatches();
renderMenu();
setScreen('menu');

document.querySelectorAll('.choice').forEach((b) => {
  b.addEventListener('click', () => {
    settings.kind = b.dataset.kind;
    persist();
    renderMenu();
  });
});
$('#btn-lang').addEventListener('click', () => {
  settings.lang = getLang() === 'ar' ? 'en' : 'ar';
  persist();
  renderMenu();
});
$('#in-quality').addEventListener('change', () => {
  settings.quality = $('#in-quality').value;
  persist();
});
$('#in-war').addEventListener('change', () => {
  settings.war = $('#in-war').checked;
  persist();
});
$('#btn-play').addEventListener('click', play);
$('#btn-menu').addEventListener('click', backToMenu);
$('#btn-god').addEventListener('click', () => game && game.toggleGod());
$('#btn-ride').addEventListener('click', () => game && game.toggleRide());
$('#btn-skill').addEventListener('pointerdown', (e) => { e.preventDefault(); if (game) game.useSkill(); });
$('#btn-again').addEventListener('click', () => {
  if (game) game.stop();
  game = null;
  round = lastWon ? Math.min(round + 1, 10) : 1;
  play(); // same settings, next round
});
$('#btn-result-menu').addEventListener('click', backToMenu);

</script>
