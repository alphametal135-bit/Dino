<!doctype html>
<!-- Single-file build: edited directly in place; all code lives in this one file. -->
<!-- v12 (from v11): 'Ultra' graphics level (sharper shadows, anti-aliasing, filmic tone mapping; phones keep a 2048 shadow map). -->
<!-- v11 (from v10): 10-element wheel (5 new elements: earth, nature, dark, light, lava) as a data-driven combat layer. The original 5 elements and every v10 rule are unchanged. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1d12">
  <title>DINO WORLD ONLINE</title>
  <style>
:root {
  --bg: #0b1d12;
  --panel: #12301d;
  --line: #2c5c3a;
  --text: #eaf5e6;
  --muted: #9fc3a2;
  --accent: #f0a93b;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
}

.hidden { display: none !important; }

#stage { position: fixed; inset: 0; }
#stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
  background: radial-gradient(circle at 50% 20%, #1c4a2c 0%, var(--bg) 70%);
}

.panel {
  width: min(460px, 100%);
  max-height: 100%;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
}

h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: 0.06em; color: var(--accent); text-align: center; }
.tagline { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.note { margin: 10px 0; font-size: 0.8rem; color: var(--muted); }
.msg { min-height: 1.2em; margin: 10px 0 0; color: #ff8f7a; font-size: 0.9rem; }

.field { display: block; margin-bottom: 12px; }
.field > span { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); }

input, select {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #0e2616;
  color: var(--text);
  font: inherit;
}

.choices { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
.choice {
  min-height: 72px;
  padding: 10px;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: #0e2616;
  color: var(--text);
  font: inherit;
  text-align: start;
  cursor: pointer;
}
.choice small { display: block; margin-top: 4px; color: var(--muted); font-size: 0.75rem; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: #1a3d26; }

.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
}
.swatch[aria-pressed="true"] { border-color: #fff; }

.row { display: flex; gap: 10px; }
button { font: inherit; cursor: pointer; }
button.primary {
  flex: 1;
  min-height: 48px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: #1b1405;
  font-weight: 700;
}
button.ghost {
  min-height: 48px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--text);
}
button.small { min-height: 40px; padding: 0 12px; font-size: 0.85rem; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; direction: ltr; }
#hud > * { pointer-events: none; }
#hud #btn-menu { pointer-events: auto; position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); background: rgba(0, 0, 0, 0.35); }
#hud #btn-god, #hud #btn-ride { pointer-events: auto; position: absolute; right: max(10px, env(safe-area-inset-right)); background: rgba(0, 0, 0, 0.35); }
#hud #btn-god { top: calc(max(10px, env(safe-area-inset-top)) + 48px); }
#hud #btn-ride { top: calc(max(10px, env(safe-area-inset-top)) + 96px); }
#hud #btn-god[aria-pressed="true"] { background: rgba(240, 169, 59, 0.55); border-color: var(--accent); }
#hud #btn-ride:disabled { opacity: 0.45; }
#hud #btn-skill { pointer-events: auto; touch-action: none; position: absolute; right: calc(max(36px, env(safe-area-inset-right)) + 96px); bottom: calc(max(56px, env(safe-area-inset-bottom)) + 124px); width: 84px; height: 84px; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 0.95rem; background: rgba(255, 110, 30, 0.6); }
#hud #btn-skill[data-el="zap"] { background: rgba(240, 200, 20, 0.7); color: #2a2200; }
#hud #btn-skill[data-el="wind"] { background: rgba(40, 90, 200, 0.7); }
#hud #btn-skill[data-el="ice"] { background: rgba(120, 220, 255, 0.75); color: #04202b; }
#hud #btn-skill[data-el="water"] { background: rgba(20, 90, 220, 0.75); }
#hud-info {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: max(10px, env(safe-area-inset-left));
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.4);
  font-size: 0.8rem;
  line-height: 1.5;
  white-space: pre;
  unicode-bidi: plaintext;
}
#hud-alert {
  position: absolute;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: 10px;
  background: rgba(10, 60, 120, 0.75);
  border: 2px solid #8fd3ff;
  font-weight: 700;
  pointer-events: none;
}
#underwater-tint { position: absolute; inset: 0; pointer-events: none; background: rgba(10, 90, 140, 0.18); }
#hud-hint {
  position: absolute;
  bottom: max(10px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.4);
  font-size: 0.8rem;
  text-align: center;
  opacity: 0.9;
}

/* ---------- touch controls ---------- */
#touch { position: absolute; inset: 0; direction: ltr; }
#touch > * { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#stick {
  position: absolute;
  left: max(24px, env(safe-area-inset-left));
  bottom: max(48px, env(safe-area-inset-bottom));
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.12);
}
#stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
}
#btn-jump, #btn-run {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  font-weight: 700;
}
#btn-jump { right: max(24px, env(safe-area-inset-right)); bottom: max(56px, env(safe-area-inset-bottom)); width: 88px; height: 88px; }
#btn-run { right: calc(max(24px, env(safe-area-inset-right)) + 104px); bottom: max(40px, env(safe-area-inset-bottom)); width: 70px; height: 70px; }
#btn-run[aria-pressed="true"] { background: rgba(240, 169, 59, 0.55); border-color: var(--accent); }
#btn-dive {
  position: absolute;
  right: calc(max(24px, env(safe-area-inset-right)) + 200px);
  bottom: calc(max(48px, env(safe-area-inset-bottom)) + 84px);
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 2px solid rgba(120, 200, 255, 0.7);
  background: rgba(30, 110, 200, 0.28);
  color: #fff;
  font-weight: 700;
  font-size: 0.8rem;
}

/* ---------- war mode ---------- */
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 2px; cursor: pointer; }
.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }

#war-hud {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  width: min(440px, 44vw);
}
.bar-block { flex: 1; min-width: 0; }
.bar-label { font-size: 0.75rem; margin-bottom: 3px; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
.bar { height: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.35); overflow: hidden; }
.fill { height: 100%; width: 100%; }
.fill.hp { background: #4cd964; }
.fill.foe { background: #ff4d4d; }
.fill.energy { background: #ffa726; }
#energy-hud {
  position: absolute;
  left: 50%;
  bottom: calc(max(10px, env(safe-area-inset-bottom)) + 44px);
  transform: translateX(-50%);
  width: min(260px, 40vw);
}
#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
}
#btn-attack {
  position: absolute;
  right: max(36px, env(safe-area-inset-right));
  bottom: calc(max(56px, env(safe-area-inset-bottom)) + 104px);
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 2px solid rgba(255, 120, 90, 0.8);
  background: rgba(255, 80, 60, 0.28);
  color: #fff;
  font-weight: 700;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(0, 0, 0, 0.6);
}
.overlay h2 { margin: 0 0 16px; text-align: center; font-size: 1.8rem; color: var(--accent); }

#result-info { margin: 0 0 14px; white-space: pre-line; text-align: center; font-size: 0.9rem; color: var(--text); }

@media (max-width: 700px) {
  #war-hud { top: calc(max(10px, env(safe-area-inset-top)) + 76px); width: 92vw; }
}

@media (max-height: 420px) {
  .panel { padding: 12px; }
  h1 { font-size: 1.15rem; }
  .tagline { display: none; }
}
</style>
</head>
<body>
  <div id="stage"></div>

  <section id="screen-menu" class="screen">
    <div class="panel">
      <h1>DINO WORLD ONLINE</h1>
      <p class="tagline" data-i18n="tagline"></p>

      <label class="field">
        <span data-i18n="name"></span>
        <input id="in-name" maxlength="16" autocomplete="off" data-i18n-ph="namePh">
      </label>

      <div class="choices" role="group">
        <button type="button" class="choice" data-kind="human" aria-pressed="true">
          <strong data-i18n="human"></strong>
          <small data-i18n="humanDesc"></small>
        </button>
      </div>

      <div class="field">
        <span data-i18n="color"></span>
        <div id="swatches" class="swatches" role="group"></div>
      </div>

      <label class="field">
        <span data-i18n="quality"></span>
        <select id="in-quality">
          <option value="low" data-i18n="qLow"></option>
          <option value="medium" data-i18n="qMed"></option>
          <option value="high" data-i18n="qHigh"></option>
          <option value="ultra" data-i18n="qUltra"></option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" id="in-war">
        <strong data-i18n="war"></strong>
      </label>
      <p class="note" data-i18n="warNote"></p>
      <p class="note" data-i18n="proto"></p>
      <p class="note" id="progress-line"></p>

      <div class="row">
        <button type="button" id="btn-play" class="primary" data-i18n="play"></button>
        <button type="button" id="btn-lang" class="ghost"></button>
      </div>
      <p id="menu-msg" class="msg" role="alert"></p>
    </div>
  </section>

  <section id="screen-loading" class="screen hidden">
    <div class="panel"><p data-i18n="loading"></p></div>
  </section>

  <div id="hud" class="hidden">
    <div id="hud-info"></div>
    <div id="underwater-tint" class="hidden"></div>
    <div id="hud-alert" class="hidden"></div>
    <button type="button" id="btn-menu" class="ghost small" data-i18n="menu"></button>
    <button type="button" id="btn-god" class="ghost small hidden" aria-pressed="false"></button>
    <button type="button" id="btn-ride" class="ghost small hidden"></button>
    <button type="button" id="btn-skill" class="hidden"></button>

    <div id="war-hud" class="hidden">
      <div class="bar-block">
        <div class="bar-label" id="txt-hp"></div>
        <div class="bar"><div id="bar-hp" class="fill hp"></div></div>
      </div>
      <div class="bar-block">
        <div class="bar-label" id="txt-enemy"></div>
        <div class="bar"><div id="bar-enemy" class="fill foe"></div></div>
      </div>
    </div>
    <div id="energy-hud" class="hidden">
      <div class="bar"><div id="bar-energy" class="fill energy"></div></div>
    </div>
    <div id="crosshair" class="hidden"></div>

    <div id="hud-hint"></div>
    <div id="touch" class="hidden">
      <div id="stick"><div id="stick-knob"></div></div>
      <button type="button" id="btn-run" aria-pressed="false" data-i18n="run"></button>
      <button type="button" id="btn-jump" data-i18n="jump"></button>
      <button type="button" id="btn-dive" data-i18n="dive"></button>
      <button type="button" id="btn-attack"></button>
    </div>
  </div>

  <section id="screen-result" class="overlay hidden">
    <div class="panel">
      <h2 id="result-title"></h2>
      <p id="result-info"></p>
      <div class="row">
        <button type="button" id="btn-again" class="primary" data-i18n="again"></button>
        <button type="button" id="btn-result-menu" class="ghost" data-i18n="menu"></button>
      </div>
    </div>
  </section>

  <script type="module">
// ===== Three.js loader (inlined by tools/build-single.mjs) =====
// Order: embedded copy (only in --inline-three builds) -> our own Node server -> CDNs.
const THREE_VERSION = '0.170.0';
const INLINE_THREE_B64 = null;
let THREE = null;

async function ensureThree() {
  if (THREE) return THREE;
  const sources = [
    'https://cdn.jsdelivr.net/npm/three@' + THREE_VERSION + '/build/three.module.js',
    'https://unpkg.com/three@' + THREE_VERSION + '/build/three.module.js',
  ];
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    sources.unshift('/vendor/three/three.module.js'); // the Node server's local copy
  }
  if (INLINE_THREE_B64) {
    const bytes = Uint8Array.from(atob(INLINE_THREE_B64), (c) => c.charCodeAt(0));
    sources.unshift(URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' })));
  }
  let lastError = null;
  for (const src of sources) {
    try {
      THREE = await import(src);
      return THREE;
    } catch (err) {
      lastError = err;
    }
  }
  throw new Error('THREE_LOAD_FAILED: ' + (lastError && lastError.message ? lastError.message : 'unknown'));
}

// ===== shared/terrain.js =====
// shared/terrain.js — deterministic world terrain.
// Pure functions (no DOM, no Three.js) so the SAME code runs in the browser
// (rendering + prediction) and on the Node server (authoritative checks, Phase 5).
// Only + - * / sqrt floor are used so results match across JS engines.

const WORLD_SEED = 1337;
const WORLD_RADIUS = 380; // metres; island radius, ocean continues beyond
const SEA_LEVEL = 0;

const BIOME = Object.freeze({
  OCEAN: 0,
  BEACH: 1,
  PLAINS: 2,
  FOREST: 3,
  ROCK: 4,
  SNOW: 5,
  DESERT: 6, // dry sandy patches on low ground
  VOLCANIC: 7, // dark volcanic rock with lava pools, high up
});

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Small deterministic PRNG (mulberry32).
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(ix, iz) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iz | 0, 668265263) ^ Math.imul(WORLD_SEED, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function valueNoise(x, z) {
  const x0 = Math.floor(x);
  const z0 = Math.floor(z);
  const fx = smoothstep(0, 1, x - x0);
  const fz = smoothstep(0, 1, z - z0);
  const a = hash2(x0, z0);
  const b = hash2(x0 + 1, z0);
  const c = hash2(x0, z0 + 1);
  const d = hash2(x0 + 1, z0 + 1);
  const top = a + (b - a) * fx;
  const bottom = c + (d - c) * fx;
  return top + (bottom - top) * fz;
}

// Fractal noise, result in 0..1.
function fbm(x, z, octaves) {
  let amp = 0.5;
  let freq = 1;
  let sum = 0;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, z * freq) * amp;
    norm += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

// Terrain height in metres at world position (x, z). Sea level is 0.
function heightAt(x, z) {
  const d = Math.sqrt(x * x + z * z) / WORLD_RADIUS; // 0 centre .. 1 coast
  const island = 1 - smoothstep(0.55, 1.0, d); // 1 inland .. 0 at the coast
  const hills = fbm(x / 90, z / 90, 4);
  const m = fbm(x / 140 + 31.7, z / 140 - 12.3, 3);
  const mountains = m * m;
  const land = 3 + hills * 14 + mountains * 55;
  return land * island - 13 * (1 - island); // the sea floor is deep enough to dive (down to about -13 m)
}

function biomeAt(x, z, h = heightAt(x, z)) {
  if (h < SEA_LEVEL) return BIOME.OCEAN;
  if (h < 2.2) return BIOME.BEACH;
  if (h > 34) return BIOME.SNOW;
  if (h > 22) return fbm(x / 120 + 55, z / 120 - 90, 2) > 0.58 ? BIOME.VOLCANIC : BIOME.ROCK;
  if (h < 14 && fbm(x / 150 + 300, z / 150 - 200, 2) > 0.6) return BIOME.DESERT;
  return fbm(x / 70 + 100, z / 70 + 100, 2) > 0.48 ? BIOME.FOREST : BIOME.PLAINS;
}

// Deterministic spawn on a beach (searches from the coast inwards).
function findSpawnPoint() {
  for (let r = WORLD_RADIUS * 0.95; r >= 0; r -= 4) {
    for (let k = 0; k < 24; k++) {
      const a = (k / 24) * Math.PI * 2;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      const h = heightAt(x, z);
      if (h >= 2.2 && h <= 5) return { x, y: h, z };
    }
  }
  return { x: 0, y: heightAt(0, 0), z: 0 };
}

// ===== shared/movement.js =====
// shared/movement.js — character movement rules.
// One pure step function used by the client now (prediction) and by the
// Node server in Phase 5 (authoritative validation). No DOM / Three.js here.
//
// Conventions (same as Three.js with a camera/model that looks down -Z):
//   yaw / heading = rotation about +Y; forward vector = (-sin yaw, -cos yaw)
//   right vector  = ( cos yaw, -sin yaw)


const GRAVITY = 22;
const SWIM_DEPTH = 1.4; // ground deeper than SEA_LEVEL - SWIM_DEPTH => swimming
const WORLD_LIMIT = WORLD_RADIUS * 0.98;
const GROUND_SNAP = 0.5; // keeps feet glued to the ground when walking downhill
const HELD = Object.freeze({ fwd: 0, strafe: 0, yaw: 0, run: false, jump: false, dive: false }); // input of a creature that is being dragged under

// speeds in m/s, jump = initial vertical speed, turnRate in rad/s.
const CHARACTERS = Object.freeze({
  // step = the highest ledge it can walk straight up onto (rocks); anything higher is a wall that has to be jumped
  // dive: can swim under the surface (Space = up, C = down); the hero can dive, and so can every water-element dinosaur
  human: Object.freeze({ id: 'human', walk: 4.5, run: 8.5, jump: 7.5, turnRate: 12, height: 1.8, radius: 0.4, accel: 34, decel: 46, step: 0.55, dive: true, swimV: 3.2 }),
  trex: Object.freeze({ id: 'trex', walk: 6, run: 14, jump: 4.5, turnRate: 3.5, height: 4.2, radius: 1.5, accel: 12, decel: 16, step: 1.1 }),
  tricera: Object.freeze({ id: 'tricera', walk: 4, run: 10, jump: 2, turnRate: 3, height: 2.4, radius: 1.7, accel: 8, decel: 12, step: 0.7 }),
  raptor: Object.freeze({ id: 'raptor', walk: 5, run: 16, jump: 5, turnRate: 7, height: 1.6, radius: 0.6, accel: 26, decel: 30, step: 0.5 }),
  // flyer: Space = climb, C = descend (it takes off from the ground or the water, and lands when it comes down)
  ptero: Object.freeze({ id: 'ptero', walk: 4, run: 8, jump: 6, turnRate: 3.4, height: 2.2, radius: 1.4, accel: 14, decel: 14, step: 0.5, flyer: true, fly: 17, climb: 7 }),
  // aquatic: lives in the sea only (never enters the shallows); dive: it goes up and down freely
  mosa: Object.freeze({ id: 'mosa', walk: 7, run: 16, jump: 0, turnRate: 3, height: 3.1, radius: 3.2, accel: 10, decel: 14, step: 0.6, aquatic: true, dive: true, swimV: 4.5 }),
  plesio: Object.freeze({ id: 'plesio', walk: 5, run: 11, jump: 0, turnRate: 2.6, height: 2.8, radius: 2.5, accel: 8, decel: 12, step: 0.6, aquatic: true, dive: true, swimV: 3.5 }),

// What a character stands on: the terrain, or something on top of it (rocks). The world installs its own function
// (x, z, feet height, character) => height of the surface under the feet; without one it is just the terrain.
let groundFn = null;
function setGroundFn(fn) {
  groundFn = fn || null;
}

function createPlayerState(x, z, heading = 0) {
  return { x, z, y: heightAt(x, z), vy: 0, vx: 0, vz: 0, heading, speed: 0, onGround: true, swimming: false, flying: false, diving: false };
}

function createSpawnState() {
  const p = findSpawnPoint();
  // face the island interior
  return createPlayerState(p.x, p.z, Math.atan2(p.x, p.z));
}

function wrapAngle(a) {
  return Math.atan2(Math.sin(a), Math.cos(a)); // into -PI..PI
}

function turnToward(angle, target, maxStep) {
  const d = wrapAngle(target - angle); // shortest signed difference
  if (Math.abs(d) <= maxStep) return target;
  return angle + Math.sign(d) * maxStep;
}

// input: { fwd: -1..1, strafe: -1..1, yaw: camera yaw, run: bool, jump: bool,
//          aim?: bool, aimYaw?: number }   (aim => heading turns toward aimYaw instead of the move direction)
// Mutates and returns `s`.
function stepPlayer(s, input, dt, ch) {
  if (s.grabbedBy) input = HELD; // being dragged under by a water dinosaur: no control
  let fwd = clamp(input.fwd || 0, -1, 1);
  let strafe = clamp(input.strafe || 0, -1, 1);
  const len = Math.sqrt(fwd * fwd + strafe * strafe);
  if (len > 1) {
    fwd /= len;
    strafe /= len;
  }
  const sy = Math.sin(input.yaw || 0);
  const cy = Math.cos(input.yaw || 0);
  const dx = -sy * fwd + cy * strafe;
  const dz = -cy * fwd - sy * strafe;
  const mag = Math.sqrt(dx * dx + dz * dz);

  let speed = input.run && (!s.swimming || ch.aquatic) ? ch.run : ch.walk;
  if (s.flying) speed = ch.fly * (input.run ? 1.3 : 1);
  else if (s.swimming && !ch.aquatic) speed *= 0.5;
  if (s.slowT > 0) speed *= 0.55; // frozen
  if (s.rootT > 0) speed *= 0.15; // held by roots (nature element)

  // inertia: velocity eases toward the wanted velocity, so a heavy T-Rex speeds up and stops more slowly than a human
  const wx = mag > 0.001 ? dx * speed : 0;
  const wz = mag > 0.001 ? dz * speed : 0;
  const rate = (mag > 0.001 ? ch.accel : ch.decel) * (s.onGround || s.swimming || s.flying ? 1 : 0.4); // less control in the air
  const ex = wx - s.vx;
  const ez = wz - s.vz;
  const el = Math.sqrt(ex * ex + ez * ez);
  const md = rate * dt;
  if (el <= md) {
    s.vx = wx;
    s.vz = wz;
  } else {
    s.vx += (ex / el) * md;
    s.vz += (ez / el) * md;
  }
  const ox = s.x;
  const oz = s.z;
  s.x += s.vx * dt;
  s.z += s.vz * dt;
  s.speed = Math.sqrt(s.vx * s.vx + s.vz * s.vz);
  if (input.aim && typeof input.aimYaw === 'number') {
    // fighting: the body faces where we aim (camera for players, the target for the AI)
    s.heading = turnToward(s.heading, input.aimYaw, ch.turnRate * dt);
  } else if (mag > 0.001) {
    s.heading = turnToward(s.heading, Math.atan2(-dx, -dz), ch.turnRate * dt);
  }

  // keep inside the playable world
  const r = Math.sqrt(s.x * s.x + s.z * s.z);
  if (r > WORLD_LIMIT) {
    s.x *= WORLD_LIMIT / r;
    s.z *= WORLD_LIMIT / r;
  }

  const terrain = heightAt(s.x, s.z);
  if (ch.aquatic) { // sea creatures never swim into the shallows (unless they are already heading back out)
    if (terrain > -1.5 && terrain > heightAt(ox, oz)) {
      s.x = ox;
      s.z = oz;
      s.vx = 0;
      s.vz = 0;
    }
  }
  const ground = groundFn ? groundFn(s.x, s.z, s.y, ch) : terrain;

  if (ch.flyer) {
    if (!s.flying && input.jump && (s.onGround || s.swimming)) { // take off
      s.flying = true;
      s.onGround = false;
      s.swimming = false;
      s.vy = ch.jump;
    }
    if (s.flying) {
      s.swimming = false;
      const vt = input.jump ? ch.climb : input.dive ? -ch.climb : 0;
      s.vy += (vt - s.vy) * Math.min(1, 3 * dt);
      s.y += s.vy * dt;
      const shoal = ground > SEA_LEVEL - 0.8; // land, or water shallow enough to stand in
      const floor = shoal ? ground : SEA_LEVEL + 0.4; // over deep water it hovers just above the waves, it does not dive
      if (s.y <= floor) {
        s.y = floor;
        if (s.vy < 0) s.vy = 0;
        if (!input.jump && shoal) { // touched down
          s.flying = false;
          s.onGround = true;
        }
      }
      if (s.y > ground + 55) {
        s.y = ground + 55;
        if (s.vy > 0) s.vy = 0;
      }
      return s;
    }
  }

  s.swimming = !s.flying && terrain < SEA_LEVEL - SWIM_DEPTH;

  if (s.swimming) {
    const surface = SEA_LEVEL - ch.height * 0.35;
    if (ch.dive) {
      // divers: C goes down, Space goes up, no key keeps the depth (neutral buoyancy); a diver that is not diving drifts back to the surface
      if (input.dive) s.diving = true;
      let vt;
      if (input.dive) vt = -ch.swimV;
      else if (input.jump) vt = ch.swimV;
      else if (!s.diving) vt = (surface - s.y) * 3;
      else vt = 0;
      s.vy += (vt - s.vy) * Math.min(1, 6 * dt);
      s.y += s.vy * dt;
      if (s.y >= surface) {
        s.y = surface;
        if (s.vy > 0) s.vy = 0;
        if (!input.dive) s.diving = false;
      }
      const bed = terrain + 0.1;
      if (s.y < bed) {
        s.y = bed;
        if (s.vy < 0) s.vy = 0;
      }
    } else {
      s.y += (surface - s.y) * Math.min(1, 8 * dt);
      s.vy = 0;
    }
    s.onGround = false;
  } else {
    s.diving = false;
    if (input.jump && s.onGround) {
      s.vy = ch.jump;
      s.onGround = false;
    }
    if (s.onGround && s.vy <= 0 && s.y - ground < GROUND_SNAP) {
      s.y = ground;
      s.vy = 0;
    } else {
      s.vy -= GRAVITY * dt;
      s.y += s.vy * dt;
      s.onGround = false;
      if (s.y <= ground) {
        s.y = ground;
        s.vy = 0;
        s.onGround = true;
      }
    }
  }
  return s;
}

// ===== shared/combat.js =====
// shared/combat.js — combat rules (pure, deterministic, no DOM / Three.js).
// Used by the client now (single-player war mode) and by the Node server in Phase 5,
// where the server will own the results instead of the client.
//
//   human : sword swing in a cone in front (melee), cooldown between swings
//   trex  : fire breath, a narrow long cone that burns while the button is held;
//           limited by a "fire energy" meter (needs minToStart to begin, drains while burning)


const COMBAT = Object.freeze({
  // melee animals use the same swing rules as the human (cone in front, cooldown, one blow per swing)
  tricera: Object.freeze({ maxHp: 260, damage: 28, range: 3.4, halfAngle: 0.55, cooldown: 1.3, swingTime: 0.7, hitAt: 0.3, melee: true }),
  raptor: Object.freeze({ maxHp: 80, damage: 8, range: 1.9, halfAngle: 0.8, cooldown: 0.8, swingTime: 0.45, hitAt: 0.18, melee: true }),
  ptero: Object.freeze({ maxHp: 110, damage: 12, range: 2.4, halfAngle: 0.8, cooldown: 0.9, swingTime: 0.5, hitAt: 0.2, melee: true }),
  mosa: Object.freeze({ maxHp: 430, damage: 36, range: 6.2, halfAngle: 0.6, cooldown: 1.2, swingTime: 0.6, hitAt: 0.25, melee: true }),
  plesio: Object.freeze({ maxHp: 300, damage: 26, range: 5.8, halfAngle: 0.7, cooldown: 1.1, swingTime: 0.6, hitAt: 0.25, melee: true }),
  human: Object.freeze({ maxHp: 100, damage: 30, range: 2.6, halfAngle: 0.9, cooldown: 0.5, swingTime: 0.32, hitAt: 0.14 }),
  trex: Object.freeze({
    maxHp: 400, fireDps: 22, fireRange: 12, fireHalfAngle: 0.32,
    energyMax: 100, drain: 25, regen: 12, regenDelay: 0.4, minToStart: 25,
  }),
});

// ---- natural elements: every kind of dinosaur has one. A cycle of five: each element beats the next one and is weak against the previous one
//   fire > ice > air > lightning > water > fire   (x1.35 against the one it beats, x0.75 against the one that beats it)
const ELEMENT = Object.freeze({ trex: 'fire', tricera: 'zap', raptor: 'wind', ptero: 'ice', mosa: 'water', plesio: 'water' });
const EL_CYCLE = Object.freeze(['fire', 'ice', 'wind', 'zap', 'water']);
const EL_GLOW = Object.freeze({
  fire: [1, 0.35, 0.05], zap: [1, 0.9, 0.1], wind: [0.55, 1, 0.8], ice: [0.4, 0.9, 1], water: [0.15, 0.5, 1],
  earth: [0.78, 0.56, 0.26], nature: [0.35, 0.92, 0.28], dark: [0.5, 0.16, 0.75], light: [1, 0.96, 0.7], lava: [1, 0.24, 0.03], // v11: the five new elements
});
// ---- v11: the 10-element wheel, data-driven. The original five keep EXACTLY their old cycle edges (fire > ice > air > lightning > water > fire).
//   The five new ones are wired in so that every element beats 2 others (x1.35) and is beaten by 2 others (x0.75); all other pairs are neutral (x1).
//   Adding an 11th element later = one entry in EL_IDS / EL_BEATS / EL_GLOW (+ a status in applyStatus), the combat code does not change.
const EL_IDS = Object.freeze(['fire', 'ice', 'wind', 'zap', 'water', 'earth', 'nature', 'dark', 'light', 'lava']);
const EL_BEATS = Object.freeze({
  fire: Object.freeze(['ice', 'nature']), ice: Object.freeze(['wind', 'earth']), wind: Object.freeze(['zap', 'dark']),
  zap: Object.freeze(['water', 'light']), water: Object.freeze(['fire', 'lava']), earth: Object.freeze(['zap', 'lava']),
  nature: Object.freeze(['water', 'earth']), dark: Object.freeze(['fire', 'nature']), light: Object.freeze(['wind', 'dark']),
  lava: Object.freeze(['ice', 'light']),
});
function elMulEl(ea, eb) { // damage multiplier of element `ea` attacking element `eb`
  if (!ea || !eb) return 1;
  const w = EL_BEATS[ea];
  const l = EL_BEATS[eb];
  if (w && w.includes(eb)) return 1.35;
  if (l && l.includes(ea)) return 0.75;
  return 1;
}
// damage multiplier of a fighter: its level/round bonus, and -30% while it is under the dark element's curse (hexT)
const dm = (f) => (f.dmgMul || 1) * (f.hexT > 0 ? 0.7 : 1);
function elMul(a, b) {
  return elMulEl(ELEMENT[a.kind], ELEMENT[b.kind]);
}
// what an element skill does to the victim besides the damage: ice freezes (slows), fire burns, water knocks back
function applyStatus(el, from, t, dt) {
  if (!t.alive || t.god) return;
  if (el === 'ice') t.slowT = 1.6;
  else if (el === 'fire') t.burnT = Math.max(t.burnT, 2.5);
  else if (el === 'earth') t.slowT = Math.max(t.slowT, 1.0); // tremor: the shaking ground slows the victim
  else if (el === 'nature') { // roots hold the victim; the vines feed the caster a little
    t.rootT = Math.max(t.rootT || 0, 1.4);
    if (from.alive) from.hp = Math.min(from.maxHp, from.hp + 4 * dt);
  } else if (el === 'dark') t.hexT = Math.max(t.hexT || 0, 3); // curse: its attacks hit 30% weaker
  else if (el === 'light') t.cooldown = Math.max(t.cooldown, 0.4); // dazzled: it cannot start a new attack while the beam is on it
  else if (el === 'lava') t.burnT = Math.max(t.burnT, 3.5); // molten rock burns longer than fire
  else if (el === 'water') {
    const dx = t.x - from.x;
    const dz = t.z - from.z;
    const d = Math.sqrt(dx * dx + dz * dz) || 1;
    t.vx += (dx / d) * 22 * dt;
    t.vz += (dz / d) * 22 * dt;
  }
}

// A fighter is the movement state plus combat state.
function createFighter(id, kind, x, z, heading = 0) {
  const c = COMBAT[kind];
  return Object.assign(createPlayerState(x, z, heading), {
    id,
    kind,
    alive: true,
    hp: c.maxHp,
    maxHp: c.maxHp,
    cooldown: 0, // human: time until the next swing may start
    swingT: -1, // human: seconds into the current swing, -1 when not swinging
    swingHit: false,
    energy: kind === 'trex' ? c.energyMax : 0,
    firing: false,
    idleT: 0, // trex: seconds since it stopped burning (energy regenerates after regenDelay)
    hurtT: 0, // seconds left of the "just got hit" flash
    deadT: 0, // seconds since death (for the fall animation)
    ai: false, comboN: 0, skillT: -1, spinA: 0, zap: false, ice: false, wave: false, tor: null, move: null, spawned: false, // element-combo state (dinosaur AI)
    slowT: 0, burnT: 0, rootT: 0, hexT: 0, carry: 0, grab: null, grabbedBy: null, drowning: false, provoked: false, // statuses (frozen / burning) and the water-dinosaur drag
  });
}

// Is `b` inside the attack cone of `a`? (range measured to b's body edge, cone widened by b's body width)
function inCone(a, b, range, halfAngle) {
  const r = CHARACTERS[b.kind].radius;
  const dx = b.x - a.x;
  const dz = b.z - a.z;
  const dist = Math.sqrt(dx * dx + dz * dz);
  if (Math.abs(b.y - a.y) > (a.flying || b.flying ? 10 : a.diving || b.diving ? 6 : 3)) return false; // flyers and divers fight at different heights
  if (dist - r > range) return false;
  if (dist <= r) return true; // overlapping bodies
  const cos = (-Math.sin(a.heading) * dx - Math.cos(a.heading) * dz) / dist;
  return Math.acos(clamp(cos, -1, 1)) <= halfAngle + Math.asin(Math.min(1, r / dist));
}

function applyDamage(target, amount, events, fromId) {
  if (target.ride && target.ride.alive) target = target.ride; // a rider is protected by the mount: the mount takes the blow
  if (!target.alive || amount <= 0 || target.god) return; // god: the invincible human (never set on dinosaurs)
  target.hp = Math.max(0, target.hp - amount);
  target.hurtT = 0.15;
  if (events) events.push({ type: 'hit', from: fromId, to: target.id, amount });
  if (target.hp <= 0) {
    target.alive = false;
    target.firing = false;
    target.swingT = -1;
    target.skillT = -1;
    target.zap = false;
    target.ice = false;
    target.wave = false;
    target.spinA = 0;
    target.flying = false; // a dead flyer falls
    target.diving = false; // a dead diver floats up
    if (target.grabbedBy) { target.grabbedBy.grab = null; target.grabbedBy = null; }
    target.drowning = false;
    if (events) events.push({ type: 'death', id: target.id });
  }
}

// Advance one fighter's combat state by dt. input.attack = attack button held.
// `events` (optional array) receives { type: 'swing' | 'fire' | 'hit' | 'death', ... }.
const NO_ATTACK = Object.freeze({ attack: false, skill: false });
function updateCombat(f, targets, input, dt, events = null) {
  f.hurtT = Math.max(0, f.hurtT - dt);
  if (!f.alive) {
    f.deadT += dt;
    return f;
  }
  if (f.slowT > 0) f.slowT = Math.max(0, f.slowT - dt);
  if (f.rootT > 0) f.rootT = Math.max(0, f.rootT - dt);
  if (f.hexT > 0) f.hexT = Math.max(0, f.hexT - dt);
  if (f.burnT > 0) {
    f.burnT -= dt;
    applyDamage(f, 5 * dt, null, 'burn'); // burning: a small damage over time
  }
  if (!f.alive) return f;
  if (f.grabbedBy) input = NO_ATTACK; // held under water: it cannot fight back
  if (f.ai) return updateDinoCombat(f, targets, input, dt, events);
  const want = !!input.attack;

  if (f.kind === 'human' || COMBAT[f.kind].melee) {
    const c = COMBAT[f.kind];
    f.cooldown = Math.max(0, f.cooldown - dt);
    if (f.swingT < 0 && want && f.cooldown <= 0) {
      f.swingT = 0;
      f.swingHit = false;
      f.cooldown = c.cooldown;
      if (events) events.push({ type: 'swing', id: f.id });
    } else if (f.swingT >= 0) {
      const prev = f.swingT;
      f.swingT += dt;
      if (!f.swingHit && prev < c.hitAt && f.swingT >= c.hitAt) {
        f.swingHit = true; // the blade lands once per swing
        for (const t of targets) {
          if (t.alive && t.id !== f.id && inCone(f, t, c.range, c.halfAngle)) applyDamage(t, c.damage * dm(f), events, f.id);
        }
      }
      if (f.swingT >= c.swingTime) f.swingT = -1;
    }
    return f;
  }

  const c = COMBAT.trex;
  const wasFiring = f.firing;
  // hysteresis: needs minToStart energy to begin, may keep burning until empty
  f.firing = want && (wasFiring ? f.energy > 0 : f.energy >= c.minToStart);
  if (f.firing) {
    f.energy = Math.max(0, f.energy - c.drain * dt);
    f.idleT = 0;
    if (!wasFiring && events) events.push({ type: 'fire', id: f.id });
    for (const t of targets) {
      if (t.alive && t.id !== f.id && inCone(f, t, c.fireRange, c.fireHalfAngle)) applyDamage(t, c.fireDps * dt * dm(f), events, f.id);
    }
  } else {
    f.idleT += dt;
    if (f.idleT >= c.regenDelay) f.energy = Math.min(c.energyMax, f.energy + c.regen * dt);
  }
  return f;
}

// ---- element combo (dinosaur AI): `basics` normal attacks (a random move each time), then the element skill, then the cycle starts again ----
//   trex = fire breath, tricera = lightning from the horn, raptor = spins once and throws a tornado at the target
const RIDE_COMBO = 6; // ridden: normal hits needed before the skill button appears
const DINO = Object.freeze({
  trex: { basics: 5, skill: 'fire', range: 11, dur: 2.2, dps: 26, half: 0.32, moves: [

    { damage: 24, range: 3.8, halfAngle: 0.95, cooldown: 0.9, swingTime: 0.55, hitAt: 0.3 }, // stomp / tail sweep

    { damage: 9, range: 2.8, halfAngle: 1.0, cooldown: 0.7, swingTime: 0.45, hitAt: 0.18 }, // wing slap

  // mosasaurus + plesiosaur (water): a surging wave that hits hard and throws the victim back
  mosa: { basics: 5, skill: 'water', range: 13, dur: 1.4, dps: 34, half: 0.5, moves: [
    { damage: 38, range: 6.2, halfAngle: 0.6, cooldown: 1.2, swingTime: 0.6, hitAt: 0.25 }, // crushing bite
    { damage: 22, range: 5.6, halfAngle: 1.1, cooldown: 0.9, swingTime: 0.55, hitAt: 0.25 }, // tail slap
  ] },
  plesio: { basics: 5, skill: 'water', range: 12, dur: 1.5, dps: 24, half: 0.45, moves: [

function updateDinoCombat(f, targets, input, dt, events) {
  const d = DINO[f.kind];

  f.cooldown = Math.max(0, f.cooldown - dt);

    w.x += w.vx * dt;
    w.z += w.vz * dt;

      f.zap = d.skill === 'zap';
      f.ice = d.skill === 'ice';

      f.zap = false;
      f.ice = false;
      f.wave = false;

    const x = px - Math.sin(a) * dist;

// ===== shared/ai.js =====
// shared/ai.js — the opponent's brain. Returns the SAME input object a player produces

const FOOD = Object.freeze({ count: 60, eatTime: 3.2, regrow: 10, growTime: 1.5, fullAfter: 5 });

// Between events it simply walks around the island. One event happens `firstAfter` seconds after the round starts, then one every `every` seconds
// (counted from the end of the previous event):
//   event 1: a meal, then (full) it walks to the shore and drinks from the sea
//   event 2: a meal again; afterwards it is thirsty too with probability `drinkChance`, then it drinks
//   event 3 and later: a random choice, hungry (a meal) or thirsty (a drink at the sea), 50 / 50

const NEEDS_BY = Object.freeze({
  tricera: Object.freeze({ ...NEEDS, firstAfter: 25, every: 900, meals: Object.freeze([6, 8, 10]) }),
  raptor: Object.freeze({ ...NEEDS, firstAfter: 12, every: 800, meals: Object.freeze([3, 4, 5]), drinkChance: 0.65 }),
  // the sea creatures do not graze or drink at the shore: they only roam (the schedule never fires)
  // the pteranodon hunts fish, grazes and drinks in turn (event 1: fish, 2: a meal then a drink, 3: a drink, ...), more often than the others
  ptero: Object.freeze({ ...NEEDS, firstAfter: 25, every: 240, meals: Object.freeze([3, 4]), drinkChance: 0.85, drinkTime: 6 }),
  mosa: Object.freeze({ ...NEEDS, firstAfter: 1e9 }),

// A few tufts near the start (so there is food in sight), the rest spread over the whole island so it finds food wherever it roams.
function createFoodField(cx, cz, ok, count = FOOD.count) {
  const rng = mulberry32(WORLD_SEED + 91);
  const items = [];
  const accept = (x, z, gap) => {
    const h = heightAt(x, z);
    if (h < 2.5 || h > 24) return false; // dry, low ground only
    const bm = biomeAt(x, z, h);
    if (bm !== BIOME.PLAINS && bm !== BIOME.FOREST) return false;
    if (Math.abs(heightAt(x + 2, z) - h) + Math.abs(heightAt(x, z + 2) - h) > 3) return false; // not on a steep slope
    if (items.some((o) => Math.hypot(o.x - x, o.z - z) < gap)) return false;

    const a = rng() * Math.PI * 2;
    const r = 6 + Math.sqrt(rng()) * 38;
    const x = cx + Math.cos(a) * r;
    const z = cz + Math.sin(a) * r;
    if (accept(x, z, 4)) add(x, z);

  for (let i = 0; i < 6000 && items.length < count; i++) {
    const a = rng() * Math.PI * 2;
    const r = Math.sqrt(rng()) * WORLD_RADIUS * 0.85;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (accept(x, z, 7)) add(x, z);

function updateFood(items, dt) {

    it.skipT = Math.max(0, it.skipT - dt);
    if (it.state === 'regrow') {
      it.t += dt;
      it.amount = clamp((it.t - FOOD.regrow) / FOOD.growTime, 0, 1); // nothing for 10 s, then it sprouts back
      if (it.t >= FOOD.regrow + FOOD.growTime) {

        it.amount = 1;
        it.t = 0;

function nearestFood(me, items) {

  let bd = Infinity;

    const d = Math.hypot(it.x - me.x, it.z - me.z);
    if (d < bd) {
      bd = d;
      best = it;
    }
  }
  return best;

function pickRoamGoal(me) {
  const ch = CHARACTERS[me.kind];
  if (ch.aquatic || ch.flyer) { // sea creatures roam over the open sea, flyers over the whole island and the sea around it
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * WORLD_RADIUS * 0.9;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      const d = Math.hypot(x - me.x, z - me.z);
      if (d < 25) continue;
      if (ch.aquatic) {
        if (heightAt(x, z) > -3.5) continue;
        let ok = true;
        for (let k = 1; k < d / 8; k++) {
          const f = (k * 8) / d;
          if (heightAt(me.x + (x - me.x) * f, me.z + (z - me.z) * f) > -2) {
            ok = false;
            break;
          }
        }
        if (!ok) continue;
      }
      return { x, z, d };
    }
    return null;
  }
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * WORLD_RADIUS * 0.8;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (heightAt(x, z) < 2.5) continue;
    const d = Math.hypot(x - me.x, z - me.z);
    if (d < 25) continue; // somewhere worth the walk
    let ok = true;
    for (let k = 1; k < d / 10; k++) {
      const f = (k * 10) / d;
      if (heightAt(me.x + (x - me.x) * f, me.z + (z - me.z) * f) < -0.5) {

    const a = (k / count) * Math.PI * 2;
    const ox = Math.cos(a);
    const oz = Math.sin(a);

    while (r > 0 && heightAt(ox * r, oz * r) < -DRINK_DEPTH) r -= 0.5;
    if (r <= 0) continue;
    let ok = true;
    for (let q = r - 4; q > WORLD_RADIUS * 0.35; q -= 4) {
      if (heightAt(ox * q, oz * q) < -0.5) {
        ok = false;
        break;
      }

// ---- fish: schools that circle in the sea (the world draws them, the pteranodon hunts them) ----

  if (mem.fish) {
    const fh = mem.fish;
    if (!fh.school) {
      fh.school = nearestFishSchool(me);
      fh.j = fh.school ? fh.school.hidden.findIndex((h) => h <= FISH.now) : 0;
    }
    if (!fh.school) { // no fish to be had: try again later
      mem.fish = null;
      mem.holdUntil = mem.clock + mem.needs.retry;
      return out;
    }
    fh.t += dt;
    if (fh.phase === 'seek') {
      const sc = fh.school;
      if (sc.hidden[fh.j] > FISH.now) { // somebody else took this fish: pick another one of the school
        fh.j = sc.hidden.findIndex((h) => h <= FISH.now);
        if (fh.j < 0) { fh.school = null; sc.skipUntil = FISH.now + 20; return out; }
      }
      fishPos(sc, fh.j, FISH.now + 0.6, _fp); // aims a little ahead of the fish
      const dx = _fp.x - me.x;
      const dz = _fp.z - me.z;
      const d = Math.sqrt(dx * dx + dz * dz) || 1e-6;
      fh.dist = d;
      out.strafe = dx / d;
      out.fwd = -dz / d;
      out.run = d > 40;
      if (d < 5 && me.y < SEA_LEVEL + 2.6) { // snatched!
        sc.hidden[fh.j] = FISH.now + 35;
        fh.phase = 'swallow';
        fh.t = 0;
        me.carry = 3;
        me.catchSplash = 1; // the world draws a splash where it happened
        me.catchX = _fp.x;
        me.catchZ = _fp.z;
      }
      return out;
    }
    out.strafe = -Math.sin(me.heading) * 0.6; // swallows on the wing, still moving ahead while it climbs
    out.fwd = Math.cos(me.heading) * 0.6;
    if (fh.t >= 3) {
      mem.fish = null;
      me.carry = 0;
      finishEvent(mem);
    }
    return out;
  }

  // 3) a short pause between tufts
  if (mem.restT > 0) {
    mem.restT -= dt;
    return out;
  }

  // 4) a meal or a trip that drags on for far too long (blocked path?) is dropped and retried a little later
  if (mem.actT > mem.needs.giveUp) {
    mem.bitesLeft = 0;
    mem.drink = null;
    mem.fish = null;
    mem.target = null;
    mem.actT = 0;
    mem.holdUntil = mem.clock + mem.needs.retry;
  }

  // 5) nothing to do: start the next event on the schedule (T-Rex only). From the third event on the choice is random, hungry or thirsty;
  // the choice is remembered in `chosen`, so an interrupted event is resumed as the same thing instead of being re-rolled.
  if (me.kind !== 'human' && mem.bitesLeft <= 0 && !mem.drink && !mem.fish && mem.clock >= mem.holdUntil) {
    if (!mem.chosen && mem.clock >= mem.mealAt) mem.chosen = me.kind === 'ptero' ? ((me.growth || 1) < 0.5 ? ['meal', 'drink'][mem.eventIdx % 2] : ['fish', 'meal', 'drink'][mem.eventIdx % 3]) : mem.eventIdx >= 2 && Math.random() < 0.5 ? 'drink' : 'meal';
    if (mem.chosen === 'fish') {
      if (!mem.fish) mem.fish = { school: null, j: 0, phase: 'seek', t: 0, dist: 99 };
      mem.actT = 0;
    } else if (mem.chosen === 'drink' || mem.thirsty) {
      mem.drink = { spot: null, t: -1 };
      mem.actT = 0;
      mem.wStuckT = 0;
    } else if (mem.chosen === 'meal') {
      mem.bitesLeft = mem.needs.meals[mem.mealIdx % mem.needs.meals.length];
      mem.fed = false;
      mem.actT = 0;
      mem.wStuckT = 0;
    }
  }

  // 6) thirsty: walk to the nearest shore spot, face the sea and start drinking
  if (mem.drink) {
    const dr = mem.drink;
    if (!dr.spot || dr.spot.skipUntil > mem.clock) dr.spot = nearestDrinkSpot(me, mem);
    if (!dr.spot) {
      mem.drink = null; // no usable shore right now: try again later
      mem.holdUntil = mem.clock + mem.needs.retry;
    } else {
      const sp = dr.spot;
      const dx = sp.x - me.x;
      const dz = sp.z - me.z;
      const d = Math.sqrt(dx * dx + dz * dz) || 1e-6;
      if (d <= DRINK_ARRIVE) {
        out.aim = true; // at the water's edge: turn to face the sea, then drink
        out.aimYaw = sp.yaw;
        if (Math.abs(wrapAngle(sp.yaw - me.heading)) < 0.25 && !me.flying) { // a flyer has to land first
          dr.t = 0;
          mem.wStuckT = 0;
        }
        return out;
      }
      if (moved < 0.2 * dt) mem.wStuckT += dt; // something in the way: try another spot
      else mem.wStuckT = 0;
      if (mem.wStuckT > 1.2) {
        sp.skipUntil = mem.clock + 30;
        dr.spot = null;
        mem.wStuckT = 0;
        return out;
      }
      out.strafe = (dx / d) * 0.7;
      out.fwd = -(dz / d) * 0.7;
      return out;
    }
  }

  // 7) hungry: walk to the nearest ripe tuft
  if (mem.bitesLeft > 0) {
    if (!mem.target || mem.target.state !== 'ready' || mem.target.skipT > 0) mem.target = nearestFood(me, mem.food);
    const it = mem.target;
    if (it) {
      mem.goal = null;
      const dx = it.x - me.x;
      const dz = it.z - me.z;
      const d = Math.sqrt(dx * dx + dz * dz) || 1e-6;
      const want = Math.atan2(-dx, -dz);
      if (d <= EAT_REACH[me.kind] + 0.35) {
        out.aim = true; // arrived: face the tuft, then start grazing
        out.aimYaw = want;
        if (Math.abs(wrapAngle(want - me.heading)) < 0.25 && !me.flying) { // a flyer has to land first
          mem.eat = it;
          mem.eatT = 0;
          mem.target = null;
          mem.wStuckT = 0;
          it.state = 'eating';
          me.eating = true;
        }
        return out;
      }
      if (moved < 0.2 * dt) mem.wStuckT += dt; // something in the way: try another tuft
      else mem.wStuckT = 0;
      if (mem.wStuckT > 1) {
        it.skipT = 25;
        mem.target = null;
        mem.wStuckT = 0;
        return out;
      }
      out.strafe = (dx / d) * 0.6;
      out.fwd = -(dz / d) * 0.6;
      return out;
    }
  }

  // 8) nothing to do right now: roam the island at a slow walk, resting now and then
  mem.wanderT -= dt;
  if (mem.goal) {
    const gx = mem.goal.x - me.x;
    const gz = mem.goal.z - me.z;
    const gd = Math.sqrt(gx * gx + gz * gz);
    if (moved < 0.15 * dt) mem.wStuckT += dt; // a tree / rock in the way
    else mem.wStuckT = 0;
    if (gd < 2 || mem.wanderT <= 0 || mem.wStuckT > 0.8) {
      mem.goal = null;
      mem.wStuckT = 0;
      mem.wanderT = 3 + Math.random() * 5; // rest a little
    } else {
      out.strafe = (gx / gd) * 0.55;
      out.fwd = -(gz / gd) * 0.55;
    }
  } else if (mem.wanderT <= 0) {
    const g = pickRoamGoal(me);
    if (g) {
      mem.goal = g;
      mem.wanderT = (g.d / (CHARACTERS[me.kind].walk * 0.55)) * 1.6 + 8; // give up on this walk if it takes far too long
    } else {
      mem.wanderT = 2;
    }
  }
  return out;
}

// Flyers and sea creatures steer their height with the same buttons the hero uses: jump = up, dive = down.
function steerVertical(me, target, out, mem, dt) {
  const ch = CHARACTERS[me.kind];
  let want;
  if (ch.flyer) {
    const g = heightAt(me.x, me.z);
    if (mem.layReq || mem.lay) {
      want = g; // a mother lands to lay her egg
    } else if ((me.growth || 1) < 0.5) {
      want = g; // a baby cannot fly yet: it walks, grazes and drinks until it has grown
    } else if (mem.provoked && target.alive) {
      const d = Math.hypot(target.x - me.x, target.z - me.z);
      want = d < 18 ? target.y + 2 : g + 14; // swoops down on its target
    } else if (mem.fish) {
      // fishing: cruises high until it is near the school, then skims just over the water; after the catch it climbs away
      want = mem.fish.phase === 'swallow' ? Math.max(g, SEA_LEVEL) + 9 : mem.fish.dist > 35 ? Math.max(g, SEA_LEVEL) + 10 : SEA_LEVEL + 1.1;
    } else if (mem.eat || mem.bitesLeft > 0 || mem.drink) {
      want = g; // it comes down to the ground to graze or drink
    } else {
      mem.flyT -= dt;
      if (mem.flyT <= 0) {
        mem.fly = !mem.fly; // it lands and rests on the ground now and then (the hero can mount it then)
        mem.flyT = mem.fly ? 30 + Math.random() * 40 : 12 + Math.random() * 14;
      }
      want = mem.fly ? g + 10 + Math.sin(mem.clock * 0.2) * 4 : g;
    }
    out.jump = me.y < want - 0.6;
    out.dive = me.y > want + 0.6;
    return;
  }
  const surface = SEA_LEVEL - ch.height * 0.35;
  const bed = heightAt(me.x, me.z) + 0.2;
  if (mem.layReq || mem.lay) want = me.y; // a mother lays her egg where she is
  else if (mem.prey && mem.prey.alive) want = mem.prey.y;
  else if (mem.provoked && target.alive) want = Math.min(target.y, surface);
  else {
    mem.depthT -= dt;
    if (mem.depthT <= 0) {
      mem.depthT = 6 + Math.random() * 10;
      mem.depthWant = Math.random() < 0.35 ? surface : -1 - Math.random() * 9; // sometimes at the surface, mostly somewhere in the deep
    }
    want = mem.depthWant;
  }
  want = clamp(want, bed, surface);
  out.jump = me.y < want - 0.5;
  out.dive = me.y > want + 0.5;
}

// A water dinosaur going for a swimmer of another element: straight at it, then it grabs it.
function huntInput(me, prey, out, mem) {
  const dx = prey.x - me.x;
  const dz = prey.z - me.z;
  const dist = Math.sqrt(dx * dx + dz * dz) || 1e-6;
  out.aim = true;
  out.aimYaw = Math.atan2(-dx, -dz);
  out.strafe = dx / dist;
  out.fwd = -dz / dist;
  out.run = dist > 6;
  const gap = dist - CHARACTERS[me.kind].radius - CHARACTERS[prey.kind].radius;
  if (gap <= GRAB_REACH && Math.abs(prey.y - me.y) < 4 && !prey.grabbedBy) {
    me.grab = prey;
    prey.grabbedBy = me;
  }
  return out;
}

// Laying an egg: the mother stands still for LAY_TIME seconds (crouching, see the animator); then mem.layDone tells the game to put the egg down behind her.
const LAY_TIME = 5;
function layInput(me, dt, mem, out) {
  out.aim = false;
  if (!mem.lay) {
    cancelNeeds(mem); // she leaves any meal
    if (CHARACTERS[me.kind].flyer && (me.flying || !me.onGround)) { // a flyer is still coming down; over deep water it first heads for the island (it cannot land on the sea)
      if (heightAt(me.x, me.z) <= SEA_LEVEL - 0.8) {
        const dx = -me.x;
        const dz = -me.z;
        const dist = Math.sqrt(dx * dx + dz * dz) || 1e-6;
        out.aim = true;
        out.aimYaw = Math.atan2(-dx, -dz);
        out.strafe = dx / dist;
        out.fwd = -dz / dist;
      }
      return out;
    }
    mem.lay = { t: 0 };
    mem.layReq = false;
  }
  me.laying = true;
  mem.lay.t += dt;
  if (mem.lay.t >= LAY_TIME) {
    mem.lay = null;
    mem.layDone = true;
    me.laying = false;
  }
  return out;
}

function aiInput(me, target, dt, mem) {
  me.provoked = mem.provoked;
  const out = aiInputCore(me, target, dt, mem);
  if (me.alive && (CHARACTERS[me.kind].flyer || CHARACTERS[me.kind].aquatic)) steerVertical(me, target, out, mem, dt);
  return out;
}

function aiInputCore(me, target, dt, mem) {
  const out = { fwd: 0, strafe: 0, yaw: 0, run: false, jump: false, attack: false, aim: true, aimYaw: me.heading };
  me.eating = false; // set again by passiveInput while it grazes
  me.drinking = false; // ... or while it drinks
  me.laying = false; // ... or while a mother lays her egg
  if (!me.alive || !target.alive) {
    out.aim = false;
    return out;
  }
  mem.clock += dt;
  if (me.grab) { // it is holding a victim under water
    if (!me.grab.alive) me.grab = null;
    else {
      out.aim = false;
      return out;
    }
  }
  if (mem.layReq || mem.lay) { // a mother laying her egg stops where she is (a flyer comes down first); a fight cancels it
    if (mem.provoked) { mem.layReq = false; mem.lay = null; } else return layInput(me, dt, mem, out);
  }
  if (mem.prey && mem.prey.alive && isWaterDino(me)) return huntInput(me, mem.prey, out, mem);
  if (mem.bitesLeft > 0 || mem.drink || mem.fish) mem.actT += dt; // how long the current meal / trip has lasted
  else mem.actT = 0;
  if (!mem.provoked) return passiveInput(me, dt, mem);
  // estimate the target's velocity so the T-Rex can lead its fire
  let tvx = 0;
  let tvz = 0;
  if (mem.px !== null && dt > 0) {
    tvx = clamp((target.x - mem.px) / dt, -14, 14);
    tvz = clamp((target.z - mem.pz) / dt, -14, 14);
  }
  mem.px = target.x;
  mem.pz = target.z;
  const lead = me.kind === 'trex' ? 0.3 : 0;
  const dx = target.x + tvx * lead - me.x;
  const dz = target.z + tvz * lead - me.z;
  const dist = Math.sqrt(dx * dx + dz * dz) || 1e-6;
  out.aimYaw = Math.atan2(-dx, -dz);

  // the player ran away: after a few seconds out of reach it gives up and goes back to its calm life
  if (dist > (me.kind === 'trex' ? 15 : COMBAT[me.kind].melee ? 28 : 20)) mem.farT += dt;
  else mem.farT = 0;
  if (mem.farT >= 4) {
    calmDown(me, mem);
    return passiveInput(me, dt, mem);
  }

  mem.delay = Math.max(0, mem.delay - dt);
  if (mem.delay > 0) return out; // stands still, facing the player

  const ux = dx / dist;
  const uz = dz / dist;
  // stuck detection: wanted to move but barely did (tree / rock in the way) => sidestep for a moment
  const moved = Math.hypot(me.x - mem.lx, me.z - mem.lz);
  mem.lx = me.x;
  mem.lz = me.z;
  if (mem.detourT > 0) {
    mem.detourT -= dt;
  } else if (mem.moving && dist > 4 && moved < 0.8 * dt) {
    mem.stuckT += dt;
    if (mem.stuckT > 0.5) {
      mem.stuckT = 0;
      mem.detourT = 0.9;
      mem.detour = Math.random() < 0.5 ? -1 : 1;
    }
  } else {
    mem.stuckT = 0;
  }
  mem.moving = false;
  // with yaw = 0: forward = -Z, right = +X
  const go = (mx, mz) => {
    if (mem.detourT > 0) {
      const k = mem.detour * 0.9;
      const tx = mx - mz * k;
      const tz = mz + mx * k;
      mx = tx;
      mz = tz;
    }
    mem.moving = true;
    out.strafe = mx;
    out.fwd = -mz;
  };

  if (me.ai) { // same pattern for T-Rex / triceratops / raptor: close in for the normal attacks, then use the skill from a distance
    const d = DINO[me.kind];
    if (me.skillT >= 0) return out; // casting: stands still facing the target
    const err = Math.abs(wrapAngle(out.aimYaw - me.heading));
    if (me.comboN >= d.basics) {
      if (dist > d.range * 0.8) go(ux, uz);
      out.run = dist > d.range * 1.6;
      if (dist <= d.range * 0.9 && err < 0.2) out.attack = true;
      return out;
    }
    const m = d.moves[0];
    const rx = Math.cos(target.heading);
    const rz = -Math.sin(target.heading);
    if (me.kind !== 'trex' && target.kind === 'trex' && target.firing && inCone(target, me, COMBAT.trex.fireRange, COMBAT.trex.fireHalfAngle * 1.5)) {
      const sd = Math.sign((me.x - target.x) * rx + (me.z - target.z) * rz) || mem.side;
      go(rx * sd, rz * sd);
      out.run = true;
    } else {
      mem.sideT -= dt;
      if (mem.sideT <= 0) {
        mem.side = -mem.side;
        mem.sideT = 3;
      }
      const flank = me.kind === 'raptor' ? 2.2 : 0;
      const ax = target.x + rx * mem.side * flank - me.x;
      const az = target.z + rz * mem.side * flank - me.z;
      const ad = Math.hypot(ax, az);
      if (ad > (me.kind === 'trex' ? 2.5 : 0.6)) go(ax / ad, az / ad);
      out.run = dist > (me.kind === 'trex' ? 18 : 5);
    }
    if (inCone(me, target, m.range, m.halfAngle)) {
      mem.reactT += dt;
      if (mem.reactT >= mem.react) out.attack = true;
    } else {
      mem.reactT = 0;
    }
    return out;
  }

  if (me.kind === 'trex') {
    const c = COMBAT.trex;
    out.run = dist > 18;
    if (dist > 8) go(ux, uz);
    else if (dist < 3.5) go(-ux, -uz); // too close: back off a little
    const err = Math.abs(wrapAngle(out.aimYaw - me.heading));
    if (dist <= c.fireRange * 0.95 && err < 0.2) out.attack = true; // burn once lined up
    return out;
  }

  // melee fighters (human, triceratops, raptor): dodge sideways out of the fire cone, close in (raptors flank first), swing when in range
  const c = COMBAT[me.kind];
  const flank = me.kind === 'tricera' ? 0 : 2.2;
  const tf = COMBAT.trex;
  const rx = Math.cos(target.heading);
  const rz = -Math.sin(target.heading); // the target's right-hand vector
  if (target.kind === 'trex' && target.firing && inCone(target, me, tf.fireRange, tf.fireHalfAngle * 1.5)) {
    const s = Math.sign((me.x - target.x) * rx + (me.z - target.z) * rz) || mem.side;
    go(rx * s, rz * s);
    out.run = true;
  } else {
    mem.sideT -= dt;
    if (mem.sideT <= 0) {
      mem.side = -mem.side;
      mem.sideT = 3;
    }
    const fx = target.x + rx * mem.side * flank - me.x;
    const fz = target.z + rz * mem.side * flank - me.z;
    const fd = Math.sqrt(fx * fx + fz * fz);
    if (fd > 0.6) go(fx / fd, fz / fd);
    out.run = dist > 5;
  }
  if (inCone(me, target, c.range, c.halfAngle)) {
    mem.reactT += dt;
    if (mem.reactT >= mem.react) out.attack = true; // short reaction time before each attack run
  } else {
    mem.reactT = 0;
  }
  return out;
}

// ===== client/js/input.js =====
// client/js/input.js — keyboard + mouse + touch input.
// poll() returns { fwd, strafe, run, jump, attack, lookDX, lookDY } and resets the look deltas.
// Attack = F key, left mouse button while the pointer is locked, or the on-screen attack button.

const GAME_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyC',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'Space', 'ShiftLeft', 'ShiftRight',
]);

const TOUCH_LOOK_SCALE = 1.6; // finger drags need more rotation per pixel than a mouse

function createInput(canvas, touchRoot) {
  const keys = new Set();
  const stick = { x: 0, y: 0 };
  let lookDX = 0;
  let lookDY = 0;
  let touchJump = false;
  let touchRun = false;
  let touchDive = false;
  let touchAttack = false;
  let jumpLatch = false;
  let attackLatch = false;
  let mouseAttack = false;
  const cleanups = [];

  const on = (target, type, fn, opts) => {
    target.addEventListener(type, fn, opts);
    cleanups.push(() => target.removeEventListener(type, fn, opts));
  };

  // ---- keyboard ----
  on(window, 'keydown', (e) => {
    if (!GAME_KEYS.has(e.code)) return;
    keys.add(e.code);
    e.preventDefault();
  });
  on(window, 'keyup', (e) => keys.delete(e.code));
  on(window, 'blur', () => {
    keys.clear();
    mouseAttack = false;
  });

  // ---- mouse look: pointer lock on click, or drag with the left button ----
  on(canvas, 'click', () => {
    if (document.pointerLockElement === canvas || !canvas.requestPointerLock) return;
    try {
      const p = canvas.requestPointerLock();
      if (p && p.catch) p.catch(() => {});
    } catch {
      /* pointer lock not available */
    }
  });
  on(canvas, 'mousemove', (e) => {
    if (document.pointerLockElement === canvas || (e.buttons & 1)) {
      lookDX += e.movementX;
      lookDY += e.movementY;
    }
  });
  // the left button attacks only while the mouse is locked (otherwise the first click just locks it)
  on(canvas, 'mousedown', (e) => {
    if (e.button === 0 && document.pointerLockElement === canvas) {
      mouseAttack = true;
      e.preventDefault();
    }
  });
  on(window, 'mouseup', (e) => {
    if (e.button === 0) mouseAttack = false;
  });
  on(canvas, 'contextmenu', (e) => e.preventDefault());

  // ---- touch look: drag anywhere on the canvas ----
  const looks = new Map();
  on(canvas, 'pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    looks.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  });
  on(canvas, 'pointermove', (e) => {
    const p = looks.get(e.pointerId);
    if (!p) return;
    lookDX += (e.clientX - p.x) * TOUCH_LOOK_SCALE;
    lookDY += (e.clientY - p.y) * TOUCH_LOOK_SCALE;
    p.x = e.clientX;
    p.y = e.clientY;
  });
  const endLook = (e) => looks.delete(e.pointerId);
  on(canvas, 'pointerup', endLook);
  on(canvas, 'pointercancel', endLook);

  // ---- virtual joystick + buttons ----
  // Every finger is tracked on its own, so moving, jumping and attacking all work at the same time.
  // A finger that slides from one button to another presses the new one (attack -> jump without lifting the thumb).
  const stickEl = touchRoot && touchRoot.querySelector('#stick');
  const knob = touchRoot && touchRoot.querySelector('#stick-knob');
  const runBtn = touchRoot && touchRoot.querySelector('#btn-run');
  if (touchRoot) {
    const btns = {
      jump: touchRoot.querySelector('#btn-jump'),
      dive: touchRoot.querySelector('#btn-dive'),
      attack: touchRoot.querySelector('#btn-attack'),
      run: runBtn,
    };
    const RADIUS = 52;
    const fingers = new Map(); // pointerId -> { kind: 'stick' | 'jump' | 'attack' | 'run' | null }

    const hitBtn = (x, y) => {
      for (const [name, el] of Object.entries(btns)) {
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.width === 0) continue; // hidden (e.g. no attack button outside war mode)
        if (Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)) <= r.width / 2 + 10) return name;
      }
      return null;
    };
    const sync = () => {
      let j = false;
      let a = false;
      let dv = false;
      for (const f of fingers.values()) {
        if (f.kind === 'jump') j = true;
        else if (f.kind === 'attack') a = true;
        else if (f.kind === 'dive') dv = true;
      }
      touchJump = j;
      touchAttack = a;
      touchDive = dv;
    };
    const setKind = (f, kind) => {
      if (f.kind === kind) return;
      f.kind = kind;
      if (kind === 'jump') jumpLatch = true; // a very short tap still counts for one frame
      if (kind === 'attack') attackLatch = true;
    };
    const moveStick = (e) => {
      const r = stickEl.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2);
      let dy = e.clientY - (r.top + r.height / 2);
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len > RADIUS) {
        dx = (dx / len) * RADIUS;
        dy = (dy / len) * RADIUS;
      }
      stick.x = dx / RADIUS;
      stick.y = -dy / RADIUS; // up = forward
      if (Math.sqrt(stick.x * stick.x + stick.y * stick.y) < 0.12) {
        stick.x = 0;
        stick.y = 0;
      }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
    };
    const toggleRun = () => {
      touchRun = !touchRun;
      if (runBtn) runBtn.setAttribute('aria-pressed', String(touchRun));
    };

    on(touchRoot, 'pointerdown', (e) => {
      const inStick = !!stickEl && stickEl.contains(e.target);
      const name = inStick ? null : hitBtn(e.clientX, e.clientY);
      if (!inStick && !name) return;
      e.preventDefault();
      try { e.target.setPointerCapture(e.pointerId); } catch { /* ignore */ }
      if (inStick) {
        for (const [id, f] of fingers) if (f.kind === 'stick') fingers.delete(id); // one stick finger at a time: the newest wins
        fingers.set(e.pointerId, { kind: 'stick' });
        moveStick(e);
        return;
      }
      const f = { kind: null };
      fingers.set(e.pointerId, f);
      if (name === 'run') {
        f.kind = 'run';
        toggleRun(); // works while other fingers are held down (a 'click' would not)
      } else {
        setKind(f, name);
      }
      sync();
    });
    on(touchRoot, 'pointermove', (e) => {
      const f = fingers.get(e.pointerId);
      if (!f) return;
      if (f.kind === 'stick') {
        moveStick(e);
        return;
      }
      const name = hitBtn(e.clientX, e.clientY);
      const next = name === 'run' ? (f.kind === 'run' ? 'run' : null) : name; // sliding onto "run" does not toggle it
      if (next !== f.kind) {
        setKind(f, next);
        sync();
      }
    });
    const end = (e) => {
      const f = fingers.get(e.pointerId);
      if (!f) return;
      fingers.delete(e.pointerId);
      if (f.kind === 'stick' && !Array.from(fingers.values()).some((o) => o.kind === 'stick')) {
        stick.x = 0;
        stick.y = 0;
        if (knob) knob.style.transform = 'translate(0px, 0px)';
      }
      sync();
    };
    on(touchRoot, 'pointerup', end);
    on(touchRoot, 'pointercancel', end);
    on(touchRoot, 'lostpointercapture', end);
    on(touchRoot, 'contextmenu', (e) => e.preventDefault()); // a long press on a button must not open a menu / cancel the touch
  }

  return {
    poll() {
      const k = (...codes) => (codes.some((c) => keys.has(c)) ? 1 : 0);
      const out = {
        fwd: k('KeyW', 'ArrowUp') - k('KeyS', 'ArrowDown') + stick.y,
        strafe: k('KeyD', 'ArrowRight') - k('KeyA', 'ArrowLeft') + stick.x,
        run: keys.has('ShiftLeft') || keys.has('ShiftRight') || touchRun,
        jump: keys.has('Space') || touchJump || jumpLatch,
        dive: keys.has('KeyC') || touchDive,
        attack: keys.has('KeyF') || mouseAttack || touchAttack || attackLatch,
        lookDX,
        lookDY,
      };
      lookDX = 0;
      lookDY = 0;
      jumpLatch = false;
      attackLatch = false;
      return out;
    },
    dispose() {
      cleanups.forEach((fn) => fn());
      cleanups.length = 0;
      if (runBtn) runBtn.setAttribute('aria-pressed', 'false');
      if (knob) knob.style.transform = 'translate(0px, 0px)';
      try { if (document.pointerLockElement) document.exitPointerLock(); } catch { /* ignore */ }
    },
  };
}

// ===== client/js/models.js =====
// client/js/models.js — characters built from smooth low-poly shapes (rounded limbs, ellipsoids, cones).
// Every model faces -Z at rotation.y = 0 and has its origin at the feet.
// update(dt, fighter) animates from the fighter state; flash(0..1) tints red when hurt; fall(0..1) topples it.


// medium / high graphics: physically based materials (roughness + metalness, a bump map on the scales, lit by the sky environment);
// low graphics keeps the cheap Lambert shading so phones stay fast
const pbr = (color, rough = 0.8, metal = 0) => (CHAR_DETAIL >= 0.7 ? new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }) : new THREE.MeshLambertMaterial({ color }));
const lambert = (color) => pbr(color);

function part(geometry, material, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  return mesh;
}

function box(w, h, d, material, x = 0, y = 0, z = 0) {
  return part(new THREE.BoxGeometry(w, h, d), material, x, y, z);
}

// A limb that swings around a joint located at its top.
function limb(w, h, d, material, jx, jy, jz) {
  const pivot = new THREE.Group();
  pivot.position.set(jx, jy, jz);
  pivot.add(box(w, h, d, material, 0, -h / 2, 0));
  return pivot;
}

const lerp = (a, b, t) => a + (b - a) * t;

// model detail: 1 = everything, <0.7 (Low graphics) skips the tiny extras (spikes, stripes, brows) to save draw calls
let CHAR_DETAIL = 1;
function setCharDetail(d) {
  CHAR_DETAIL = Number.isFinite(d) ? d : 1;
}

// small seamless reptile-scale texture (128px, grayscale so the character colour still decides the hue); built once and shared
let scaleTexCache = null;
function scaleTexture() {
  if (scaleTexCache) return scaleTexCache;
  try {
    const S = 128;
    const N = 16;
    const cell = S / N;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    if (!g) return null;
    g.fillStyle = '#b4b4b4';
    g.fillRect(0, 0, S, S);
    const rnd = mulberry32(77);
    g.strokeStyle = 'rgba(110,110,110,0.55)';
    g.lineWidth = 1;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = 206 + Math.floor(rnd() * 44);
        g.fillStyle = `rgb(${v},${v},${v})`;
        const cx = (c + 0.5 + (r % 2) * 0.5) * cell;
        const cy = (r + 0.5) * cell;
        for (const ox of [-S, 0, S]) { // wrapped copies keep the tile seamless
          g.beginPath();
          g.ellipse(cx + ox, cy, cell * 0.46, cell * 0.44, 0, 0, Math.PI * 2);
          g.fill();
          g.stroke();
        }
      }
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(5, 3);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 2;
    scaleTexCache = tex;
    return tex;
  } catch {
    return null; // no canvas: the plain colour still works
  }
}

// the scale texture colours the skin; on PBR materials it is also a bump map, so the scales have relief under the sun
function skinify(map, ...mats) {
  if (!map) return;
  mats.forEach((m) => {
    m.map = map;
    if (m.isMeshStandardMaterial) {
      m.bumpMap = map;
      m.bumpScale = 1.0;
      m.roughness = 0.72;
    }
  });
}

// ---- smooth shape helpers (no cubes): rounded limbs, ellipsoids, cones ----
// tapered round limb from point a to point b: radius ra at a, rb at b (rb = 0 makes a cone: teeth, claws, blade)
function link(a, b, ra, rb, material, shadow = true, seg = 8) {
  // note: THREE is loaded lazily, so nothing here may touch it at module load time
  const pa = new THREE.Vector3(a[0], a[1], a[2]);
  const pb = new THREE.Vector3(b[0], b[1], b[2]);
  const dir = pb.clone().sub(pa);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rb, ra, len, seg, 1), material);
  m.position.copy(pa).add(pb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = shadow;
  return m;
}

function ball(r, material, x, y, z, sx = 1, sy = 1, sz = 1, seg = 10, shadow = true) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(5, seg - 3)), material);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = shadow;
  return m;
}

// ---- animation state machine: idle, walk, run, jump, fall, land, swim, attack, hurt, death ----
// Every blend weight eases toward its target (exponential smoothing), so states cross-fade and never pop.
// The gait phase advances with the distance actually travelled, so feet match the ground speed (no sliding).
const approach = (v, to, rate, dt) => v + (to - v) * (1 - Math.exp(-rate * dt));
// blends two angles through their direction vectors, so a full-turn stroke can fade in and out without the arm snapping when the angle wraps past 2*PI
const blendAngle = (a, b, w) => Math.atan2(lerp(Math.sin(a), Math.sin(b), w), lerp(Math.cos(a), Math.cos(b), w));

function createAnimator(p) {
  const A = {
    state: 'idle', phase: 0, t: 0, mv: 0, rn: 0, air: 0, swim: 0, atk: 0, atkT: 0, hurt: 0, land: 0, dead: 0, rise: 0, turn: 0, lean: 0, pv: 0,
    events: [], eat: 0, lay: 0, _bite: 0, _gr: true, _sw: false, _h: null, _sp: 0, _vy: 0, _landT: 0, _landAmt: 0, _hurtT: 0, _cool: 0, _half: 0, _halfP: 0, _atk: false,
  };
  A.update = (dt, st) => {
    const ev = A.events;
    const alive = st.alive !== false;
    const sp = st.speed;
    const grounded = st.onGround && !st.swimming;
    const dd = Math.max(dt, 1e-3);
    A.t += dt;
    if (A._h !== null) A.turn = approach(A.turn, clamp(wrapAngle(st.heading - A._h) / dd, -8, 8), 8, dt);
    A._h = st.heading;
    const slow = grounded && alive ? 1 - clamp(sp / (p.walk * 0.6), 0, 1) : 0; // standing still, or nearly
    A.pv = approach(A.pv, slow * clamp(Math.abs(A.turn) / p.turnRef, 0, 1), 10, dt); // turning on the spot: the feet have to step round
    A.lean = approach(A.lean, clamp((sp - A._sp) / dd / p.leanK, -0.3, 0.3), 8, dt); // lean into acceleration / braking
    A._sp = sp;
    // one-shot events (sounds are played from these)
    if (A._gr && !grounded && !st.swimming && st.vy > 1) ev.push({ type: 'jump' });
    if (!A._gr && grounded && !A._sw) {
      A._landT = 0.3;
      A._landAmt = clamp(-A._vy / 10, 0.2, 1);
      ev.push({ type: 'land', amt: A._landAmt });
    }
    if (st.swimming && !A._sw) ev.push({ type: 'splash', big: true });
    if (!grounded && !st.swimming) A._vy = st.vy;
    A._gr = grounded;
    A._sw = st.swimming;
    A._cool -= dt;
    if (alive && st.hurtT > 0 && A._cool <= 0) {
      A._hurtT = 0.45;
      A._cool = 0.6;
      ev.push({ type: 'hurt' });
    }
    A._hurtT = Math.max(0, A._hurtT - dt);
    A._landT = Math.max(0, A._landT - dt);
    const attacking = alive && (st.swingT >= 0 || !!st.firing);
    if (attacking && !A._atk && st.kind === 'trex') ev.push({ type: 'roar' });
    A._atk = attacking;
    A.atkT = attacking ? A.atkT + dt : 0;
    // the distance covered per cycle follows the step size (which scales with A.mv): slow gaits take short quick steps instead of dragging long ones
    const cover = st.swimming ? 1 : clamp(A.mv, 0.3, 1);
    A.phase += ((sp * dt) / (p.stride(sp) * cover) + (st.swimming ? 0.12 * dt : 0)) * Math.PI * 2;
    if (grounded && alive) A.phase += Math.min(Math.abs(A.turn) * p.pivotK, p.pivotMax) * (1 - clamp(sp / (p.walk * 0.6), 0, 1)) * dt; // stepping round on the spot
    const half = Math.floor((A.phase + Math.PI / 2) / Math.PI); // a foot lands at every half cycle
    if (half !== A._half) {
      A._half = half;
      if (grounded && A.mv > 0.3 && alive) ev.push({ type: 'step', rn: A.rn, surf: biomeAt(st.x, st.z, st.y) });
      else if (st.swimming && sp > 0.5) ev.push({ type: 'splash', big: false });
    }
    const halfP = Math.floor(A.phase / Math.PI); // stepping on the spot: a foot comes down each time the lift curve returns to zero
    if (halfP !== A._halfP) {
      A._halfP = halfP;
      if (grounded && alive && A.mv <= 0.3 && A.pv > 0.3) ev.push({ type: 'step', rn: 0, soft: true, surf: biomeAt(st.x, st.z, st.y) });
    }
    A.mv = approach(A.mv, clamp(sp / (p.walk * (st.swimming ? 0.4 : 0.8)), 0, 1), p.rate, dt);
    A.rn = approach(A.rn, grounded ? clamp((sp - p.walk) / (p.run - p.walk), 0, 1) : 0, p.rate, dt);
    A.air = approach(A.air, !st.onGround && !st.swimming ? 1 : 0, 16, dt);
    A.swim = approach(A.swim, st.swimming ? 1 : 0, 8, dt);
    A.rise = approach(A.rise, clamp(st.vy / 7.5, -1, 1), 12, dt);
    A.atk = approach(A.atk, attacking ? 1 : 0, attacking ? 30 : 9, dt);
    A.hurt = approach(A.hurt, A._hurtT > 0 ? 1 : 0, A._hurtT > 0 ? 40 : 7, dt);
    A.land = approach(A.land, A._landT > 0 ? A._landAmt : 0, A._landT > 0 ? 30 : 8, dt);
    A.dead = approach(A.dead, alive ? 0 : 1, 6, dt);
    const eating = alive && (!!st.eating || !!st.drinking) && grounded; // drinking uses the same head-down pose as grazing
    A.eat = approach(A.eat, eating ? 1 : 0, eating ? 5 : 8, dt);
    A.lay = approach(A.lay, alive && st.laying ? 1 : 0, 3, dt); // a mother crouching to lay her egg
    if (eating) {
      const bite = Math.floor(A.t * 2.4); // about 2.4 bites (or sips) a second
      if (bite !== A._bite) {
        A._bite = bite;
        ev.push({ type: st.drinking ? 'sip' : 'chomp' });
      }
    }
    A.state = !alive ? 'death' : A._hurtT > 0.25 ? 'hurt' : attacking ? 'attack' : st.swimming ? 'swim'
      : !st.onGround ? (st.vy > 0.5 ? 'jump' : 'fall') : A._landT > 0 ? 'land' : A.rn > 0.5 ? 'run' : A.mv > 0.1 ? 'walk' : 'idle';
  };
  return A;
}

// Height (in the body's frame, after the body's own tilt) of the sole of one leg: hip (hx,hy,hz) -> knee at (ky,kz) -> sole point (fy,fz) in knee space.
// The lowest sole is put exactly on the ground each frame, so legs never sink in and never hover, whatever the pose.
function legSole(hx, hy, hz, ky, kz, fy, fz, t, k, rx, ry, rz) {
  const ck = Math.cos(k);
  const sk = Math.sin(k);
  const y1 = ky + fy * ck - fz * sk;
  const z1 = kz + fy * sk + fz * ck;
  const y = hy + y1 * Math.cos(t) - z1 * Math.sin(t);
  const z = hz + y1 * Math.sin(t) + z1 * Math.cos(t);
  const x1 = hx * Math.cos(rz) - y * Math.sin(rz); // body orientation, three.js Euler XYZ: v' = Rx * Ry * Rz * v
  const yy = hx * Math.sin(rz) + y * Math.cos(rz);
  const z2 = -x1 * Math.sin(ry) + z * Math.cos(ry);
  return yy * Math.cos(rx) - z2 * Math.sin(rx);
}

// smooth minimum of two heights: the body height changes smoothly when the lowest foot switches (never below the true minimum, so no foot sinks in)
const smin = (a, b, k) => Math.min(a, b) - (Math.max(k - Math.abs(a - b), 0) / k) ** 2 * k * 0.25;
