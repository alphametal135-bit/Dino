  };
  let prevP = null;
  for (let i = 0; i <= 6; i++) {
    const x = lerp(-0.17, 0.12, i / 6);
    const y = lerp(1.55, 1.04, i / 6);
    const pt = [x, y, surfZ(x, y)];
    if (prevP) up.add(link(prevP, pt, 0.02, 0.02, leather, false, 5));
    prevP = pt;
  }
  up.add(ball(0.15, leather, 0, 1.36, 0.2, 1, 1.3, 0.6, 10));
  up.add(link([-0.16, 1.6, 0.25], [0.16, 1.6, 0.25], 0.055, 0.055, cloth, true, 8));
  up.add(link([0, 1.55, 0], [0, 1.58, 0], 0.085, 0.085, shirt, false, 10)); // collar
  up.add(link([0, 1.56, 0], [0, 1.66, 0], 0.07, 0.06, skin, false, 8));

  // head: skull, hair, eyes, nose
  const head = new THREE.Group();
  head.position.set(0, 1.74, 0);
  head.add(ball(0.15, skin, 0, 0, 0, 1, 1.08, 1, 12));
  head.add(ball(0.165, hairM, 0, 0.035, 0.04, 1, 0.95, 1, 12));
  head.add(ball(0.022, dark, -0.055, 0.015, -0.135, 1, 1, 1, 6, false));
  head.add(ball(0.022, dark, 0.055, 0.015, -0.135, 1, 1, 1, 6, false));
  head.add(ball(0.03, skin, 0, -0.02, -0.15, 1, 1, 1, 6, false)); // nose: shows facing direction
  // face details: eye whites, ears, brows, mouth and a hair fringe
  [-1, 1].forEach((sx) => {
    head.add(ball(0.03, white, sx * 0.055, 0.015, -0.133, 1, 1, 0.6, 8, false));
    head.add(ball(0.034, skin, sx * 0.147, -0.005, 0.005, 0.5, 1, 0.8, 6, false));
    if (fine) head.add(link([sx * 0.09, 0.07, -0.108], [sx * 0.03, 0.078, -0.137], 0.011, 0.011, hairM, false, 5));
  });
  head.add(link([-0.032, -0.072, -0.128], [0.032, -0.072, -0.128], 0.008, 0.008, mouthM, false, 5));
  head.add(ball(0.075, hairM, 0, 0.105, -0.085, 1.5, 0.5, 0.9, 8, false));
  up.add(head);

  // arm: shoulder -> upper arm -> elbow -> forearm + hand
  const makeArm = (x) => {
    const arm = new THREE.Group();
    arm.position.set(x, 1.55, 0);
    arm.add(ball(0.09, shirt, 0, 0, 0, 1, 1, 1, 8));
    arm.add(link([0, 0, 0], [0, -0.3, 0], 0.075, 0.065, shirt, true, 8));
    const elbow = new THREE.Group();
    elbow.position.set(0, -0.3, 0);
    elbow.add(link([0, 0, 0], [0, -0.28, 0], 0.06, 0.05, skin, true, 8));
    elbow.add(ball(0.055, skin, 0, -0.3, 0, 1, 1, 1, 8, false));
    elbow.add(link([0, -0.2, 0], [0, -0.255, 0], 0.062, 0.062, leather, false, 8)); // leather cuff
    elbow.add(ball(0.04, skin, 0, -0.345, -0.015, 0.9, 1.2, 0.9, 8, false)); // fingers
    elbow.add(ball(0.02, skin, -Math.sign(x) * 0.05, -0.29, -0.03, 1, 1, 1.3, 6, false)); // thumb
    arm.add(elbow);
    return { arm, elbow };
  };
  const L = makeArm(-0.34);
  const R = makeArm(0.34);
  const armL = L.arm;
  const armR = R.arm;

  // sword in the right hand, pointing forward (-Z): grip, crossguard, pommel, pointed blade
  const sword = new THREE.Group();
  sword.position.set(0, -0.3, 0);
  sword.add(link([0, 0, 0.13], [0, 0, -0.06], 0.025, 0.025, leather, true, 6));
  sword.add(ball(0.035, steel, 0, 0, 0.14, 1, 1, 1, 6, false));
  sword.add(link([-0.12, 0, -0.08], [0.12, 0, -0.08], 0.022, 0.022, leather, true, 6));
  const blade = link([0, 0, -0.1], [0, 0, -1.1], 0.045, 0, steel, true, 4);
  blade.scale.z = 0.3; // flat blade
  sword.add(blade);
  R.elbow.add(sword);

  // leg: hip -> thigh -> knee -> shin + boot
  const makeLeg = (x) => {
    const leg = new THREE.Group();
    leg.position.set(x, 0.93, 0);
    leg.add(link([0, 0, 0], [0, -0.46, 0], 0.105, 0.085, pants, true, 8));
    const knee = new THREE.Group();
    knee.position.set(0, -0.46, 0);
    knee.add(link([0, 0, 0], [0, -0.4, 0], 0.08, 0.065, pants, true, 8));
    knee.add(ball(0.075, leather, 0, -0.4, -0.05, 1, 0.85, 1.9, 8));
    knee.add(link([0, -0.27, 0], [0, -0.4, 0], 0.074, 0.078, leather, true, 8)); // boot shaft
    knee.add(ball(0.08, leather, 0, -0.01, -0.035, 1, 0.8, 0.8, 8, false)); // knee pad
    leg.add(knee);
    return { leg, knee };
  };
  const LL = makeLeg(-0.12);
  const LR = makeLeg(0.12);
  const legL = LL.leg;
  const legR = LR.leg;

  up.add(armL, armR);
  inner.add(legL, legR);

  const A = createAnimator({ walk: 4.5, run: 8.5, rate: 12, leanK: 150, turnRef: 3, pivotK: 3.2, pivotMax: 11, stride: (v) => 2.8 + 0.9 * clamp((v - 4.5) / 4, 0, 1) });
  let dvW = 0; // diving weight: underwater he swims breaststroke with a frog kick instead of the surface crawl
  let dvS = 0; // arm spread of the stroke
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, rn, air, swim, atk, hurt, land, dead, rise, lean, turn } = A;
      const ph = A.phase;
      const s = Math.sin(ph);
      const c = Math.cos(ph);
      const gk = mv * (1 - air) * (1 - swim); // ground-gait weight
      const idle = (1 - gk) * (1 - air) * (1 - swim) * (1 - dead);
      const amp = lerp(0.5, 0.68, rn) * gk; // thigh swing: walk -> run (kept moderate so the body bob stays natural now that the feet are planted exactly)
      const kn = lerp(0.6, 1.4, rn) * gk; // knees fold while the leg swings forward
      let tL = s * amp;
      let tR = -s * amp;
      let kL = -Math.max(0, c) * kn;
      let kR = -Math.max(0, -c) * kn;
      let aL = -s * lerp(0.45, 0.9, rn) * gk; // arms counter-swing against the legs
      let aR = -aL;
      let eb = 0.25 + gk * (0.2 + rn); // elbows bend more when running
      let lx = -(0.04 + 0.16 * rn) * gk - lean; // forward lean (negative = forward), more when accelerating
      let ty = -s * 0.14 * gk * (0.6 + rn); // shoulders twist against the hips
      const b = Math.sin(A.t * 1.9); // breathing
      lx += b * 0.012 * idle;
      // turning on the spot: each foot lifts straight up and plants in turn, so the planted foot never drags over the ground
      const pv = A.pv * (1 - air) * (1 - swim) * (1 - 0.6 * atk);
      const pl = Math.max(0, s);
      const pr = Math.max(0, -s);
      tL += pv * 0.55 * pl;
      kL -= pv * 1.1 * pl;
      tR += pv * 0.55 * pr;
      kR -= pv * 1.1 * pr;
      ty += clamp(turn * 0.025, -0.25, 0.25) * (1 - swim); // the chest leads into a turn, the hips follow
      const roll = c * 0.03 * gk * (0.6 + rn); // the pelvis tilts with every step and the shoulders tilt the other way
      // air: takeoff tucks the legs and swings the arms up, falling reaches for the ground
      const u = Math.max(rise, 0);
      const d = Math.max(-rise, 0);
      tL = lerp(tL, 0.35 + 0.45 * u + 0.1 * d, air);
      tR = lerp(tR, -0.1 + 0.3 * u + 0.3 * d, air);
      kL = lerp(kL, -(0.45 + 0.9 * u - 0.3 * d), air);
      kR = lerp(kR, -(0.3 + 0.7 * u - 0.2 * d), air);
      aL = lerp(aL, u * 1.1, air);
      aR = lerp(aR, u * 1.1, air);
      // landing: bend the knees and absorb the impact
      tL += 1.0 * land;
      tR += 0.85 * land;
      kL -= 1.9 * land;
      kR -= 1.7 * land;
      lx -= 0.35 * land;
      aL += 0.5 * land;
      aR += 0.5 * land;
      // swimming: crawl stroke + flutter kick
      const sw = ph % (Math.PI * 2);
      tL = lerp(tL, Math.sin(ph * 3) * 0.4, swim);
      tR = lerp(tR, -Math.sin(ph * 3) * 0.4, swim);
      kL = lerp(kL, -0.25, swim);
      kR = lerp(kR, -0.25, swim);
      aL = blendAngle(aL, sw, swim);
      aR = blendAngle(aR, sw + Math.PI, swim);
      eb = lerp(eb, 0.5, swim);
      // diving (underwater): breaststroke - the arms sweep from overhead out to the sides and back, the legs kick together like a frog, with a glide between strokes
      dvW = approach(dvW, st.diving && st.swimming ? 1 : 0, 5, dt);
      dvS = 0;
      let kickSpread = 0;
      if (dvW > 0.01) {
        const pulse = 0.5 + 0.5 * Math.sin(ph); // 1 = arms pulled in, 0 = reaching forward (the glide)
        aL = lerp(aL, lerp(2.9, 1.2, pulse), dvW);
        aR = aL;
        dvS = dvW * 0.9 * pulse;
        tL = tR = lerp(tL, 0.12 + 0.32 * (1 - pulse), dvW);
        kL = kR = lerp(kL, -(0.35 + 1.0 * (1 - pulse)), dvW);
        kickSpread = dvW * 0.3 * (1 - pulse);
        eb = lerp(eb, 0.25 + 0.5 * pulse, dvW);
      }
      // sword: wind-up -> strike (lands around hitAt) -> recover
      let ebR = eb;
      if (atk > 0.01) {
        const p = clamp(st.swingT / COMBAT.human.swingTime, 0, 1);
        let arm;
        let tw;
        let fl;
        if (p < 0.22) {
          const k = p / 0.22;
          arm = lerp(0.3, 2.7, k);
          tw = -0.5 * k;
          fl = -0.12 * k;
        } else if (p < 0.5) {
          const k = (p - 0.22) / 0.28;
          arm = lerp(2.7, 0.15, k * k);
          tw = lerp(-0.5, 0.45, k);
          fl = lerp(-0.12, 0.3, k);
        } else {
          const k = (p - 0.5) / 0.5;
          arm = lerp(0.15, 0.3, k);
          tw = lerp(0.45, 0, k);
          fl = lerp(0.3, 0, k);
        }
        aR = lerp(aR, arm, atk);
        aL = lerp(aL, -0.5, atk);
        ty = lerp(ty, tw, atk);
        lx = lerp(lx, -fl, atk);
        ebR = lerp(eb, 0.2, atk);
        const stance = atk * (1 - rn) * 0.35; // lunge stance
        tL += stance;
        tR -= stance;
      }
      // grazing: crouch, bend over from the waist and reach down to the grass, biting rhythmically
      const eat = A.eat;
      const bt = 0.5 + 0.5 * Math.sin(A.t * 15);
      tL += 0.85 * eat;
      tR += 0.75 * eat;
      kL -= 1.6 * eat;
      kR -= 1.5 * eat;
      aL = lerp(aL, 1.6 + 0.25 * bt, eat);
      aR = lerp(aR, 1.6 + 0.25 * bt, eat);
      ebR = lerp(ebR, 0.5, eat);
      // hurt: recoil backwards; death: go limp
      lx += 0.35 * hurt;
      tL = lerp(tL, 0.25, dead);
      tR = lerp(tR, -0.15, dead);
      kL = lerp(kL, -0.4, dead);
      kR = lerp(kR, -0.2, dead);
      const za = 0.07 * idle + 0.8 * air + 0.6 * hurt + 0.5 * dead + dvS; // arms drift outward (balance / flail / limp)
      legL.rotation.x = tL;
      legR.rotation.x = tR;
      legL.rotation.z = -kickSpread; // (the riding pose spreads the legs)
      legR.rotation.z = kickSpread;
      LL.knee.rotation.x = kL;
      LR.knee.rotation.x = kR;
      armL.rotation.x = aL;
      armR.rotation.x = aR;
      armL.rotation.z = -za;
      armR.rotation.z = za;
      armL.position.y = armR.position.y = 1.55 + 0.012 * b * idle + 0.035 * hurt + 0.03 * land + 0.015 * u * air; // shoulders rise with the breath, a hit, a landing
      L.elbow.rotation.x = eb;
      R.elbow.rotation.x = ebR;
      upper.rotation.x = lx * 0.6 - eat * (0.95 + 0.12 * bt);
      upper.rotation.y = ty;
      upper.rotation.z = -roll * 1.6;
      inner.rotation.x = lx * 0.4 - 0.9 * swim - 0.7 * swim * d + 0.5 * swim * u; // diving: head down, rising: head up
      inner.rotation.y = -ty * 0.5; // hips counter-rotate
      inner.rotation.z = turn * 0.035 * Math.min(mv * 1.5, 1) + Math.sin(A.t * 0.6) * 0.015 * idle + roll; // lean into turns / weight shift
      // the lowest foot is put exactly on the ground (legs reaching out or bending lower the body; nothing sinks or hovers); running adds a small hop
      const feet = smin(
        legSole(-0.12, 0.93, 0, -0.46, 0, -0.464, -0.05, tL, kL, inner.rotation.x, inner.rotation.y, inner.rotation.z),
        legSole(0.12, 0.93, 0, -0.46, 0, -0.464, -0.05, tR, kR, inner.rotation.x, inner.rotation.y, inner.rotation.z),
        0.04,
      );
      inner.position.y = lerp(0.35 * swim, 0.07 * rn * gk * (1 - Math.abs(s)) - feet, (1 - air) * (1 - swim));
      inner.position.z = 0.15 * hurt;
      head.rotation.x = -lx + 0.9 * swim + 0.4 * hurt + 0.3 * dead + Math.sin(ph * 2) * 0.03 * gk; // keeps the gaze level
      head.rotation.y = clamp(turn * 0.05, -0.4, 0.4) + Math.sin(A.t * 0.4) * 0.3 * idle; // looks into turns, glances around when idle
      chest.scale.y = 1.1 + b * 0.02;
    },
    // riding pose (applied after update): thighs forward and apart, shins hanging, hands on the reins, a slight lean forward
    // the rider moves with the mount (ma = the mount's animator): leans into its run, bounces with its stride, sways in its turns
    sit(ma) {
      const mv = ma ? ma.mv : 0;
      const rn = ma ? ma.rn : 0;
      const tn = ma ? clamp(ma.turn, -3, 3) : 0;
      const sb = Math.sin(ma ? ma.phase * 2 : A.t * 1.9);
      const bounce = sb * (0.03 + 0.05 * rn) * mv;
      legL.rotation.set(0.95 + bounce * 1.5, 0, -0.55);
      legR.rotation.set(0.95 - bounce * 1.5, 0, 0.55);
      LL.knee.rotation.x = LR.knee.rotation.x = -1.0 - 0.1 * rn * mv;
      armL.rotation.set(0.85 + bounce, 0, -0.1);
      armR.rotation.set(0.85 - bounce, 0, 0.1);
      L.elbow.rotation.x = R.elbow.rotation.x = 0.7 + 0.3 * rn;
      upper.rotation.x = -0.12 - 0.22 * rn * mv + bounce * 0.8; // leans forward when the mount runs
      upper.rotation.z = -tn * 0.05 * mv; // sways into the turn
      upper.rotation.y = 0;
      inner.rotation.set(0, 0, tn * 0.03 * mv);
      inner.position.set(0, 0, 0);
      head.rotation.x = 0.12 + 0.2 * rn * mv;
      head.rotation.y = 0;
    },
  };
}

function createTRex(color) {
  const root = new THREE.Group();
  const inner = new THREE.Group();
  root.add(inner);

  const base = new THREE.Color(color);
  const body = lambert(color);
  const belly = lambert(base.clone().lerp(new THREE.Color(0xffffff), 0.45));
  const back = lambert(base.clone().multiplyScalar(0.7));
  const dark = lambert(0x161616);
  const eyeM = lambert(0xe8c547);
  eyeM.userData.glow = EL_GLOW.fire.map((v) => v * 0.55); // the eyes glow in the colour of its element
  const toothM = lambert(0xf2efe2);
  const fine = CHAR_DETAIL >= 0.7;
  const skinMap = scaleTexture();
  skinify(skinMap, body, back, belly); // scaly skin; the colour still tints it

  // body: barrel torso, pale belly, dark back patches
  const torso = ball(1, body, 0, 2.5, 0.2, 0.95, 0.95, 1.7, 16);
  inner.add(torso);
  const bellyMesh = ball(1, belly, 0, 2.2, 0.1, 0.84, 0.82, 1.62, 14);
  inner.add(bellyMesh);
  [[-0.5, 3.36], [0.3, 3.4], [1.0, 3.3]].forEach(([z, y]) => inner.add(ball(0.4, back, 0, y, z, 1, 0.35, 1.2, 8, false)));
  if (fine) {
    for (let i = 0; i < 9; i++) { // dorsal scutes along the spine line of the torso
      const z = -0.9 + i * 0.28;
      const y = 2.5 + 0.95 * Math.sqrt(Math.max(0, 1 - ((z - 0.2) / 1.7) ** 2));
      inner.add(link([0, y - 0.05, z], [0, y + 0.16, z + 0.05], 0.075, 0, back, false, 5));
    }
    [-1, 1].forEach((sx) => { // dark flank stripes hugging the ribcage
      for (let i = 0; i < 6; i++) {
        const z = -0.7 + i * 0.36;
        const rr = 1 - (0.3 / 0.95) ** 2 - ((z - 0.2) / 1.7) ** 2;
        if (rr > 0.05) inner.add(ball(0.2, back, sx * (0.95 * Math.sqrt(rr) - 0.01), 2.8, z, 0.14, 1.1, 0.3, 6, false));
      }
    });
  }

  // neck (tapered), head with skull, snout, brow ridges, eyes and teeth
  const neck = new THREE.Group(); // pivots at the base of the neck
  neck.position.set(0, 2.9, -1.0);
  const nk = new THREE.Group();
  nk.position.set(0, -2.9, 1.0);
  neck.add(nk);
  inner.add(neck);
  nk.add(link([0, 2.95, -1.0], [0, 3.7, -2.15], 0.62, 0.42, body, true, 10));
  nk.add(link([0, 2.78, -1.0], [0, 3.45, -2.0], 0.55, 0.38, belly, false, 8)); // pale throat
  nk.add(ball(0.6, body, 0, 3.05, -1.15, 0.9, 0.9, 1.0, 10, false)); // neck/shoulder muscle mass
  const head = new THREE.Group();
  head.position.set(0, 3.75, -2.4);
  head.add(ball(0.55, body, 0, 0.02, 0.05, 0.95, 0.85, 1.2, 12));
  head.add(link([0, -0.02, -0.45], [0, -0.1, -1.25], 0.36, 0.24, body, true, 8));
  [-1, 1].forEach((sx) => {
    head.add(ball(0.09, eyeM, sx * 0.42, 0.2, -0.2, 1, 1, 1, 8, false));
    head.add(ball(0.05, dark, sx * 0.47, 0.2, -0.265, 0.6, 1.5, 0.8, 8, false)); // slit pupil
    head.add(ball(0.14, back, sx * 0.4, 0.33, -0.15, 1.2, 0.5, 1.6, 8, false)); // brow ridge
    for (let i = 0; i < 4; i++) {
      const z = -0.6 - i * 0.18;
      head.add(link([sx * 0.2, -0.2, z], [sx * 0.2, -0.4, z], 0.05, 0, toothM, false, 4)); // upper teeth
    }
  });
  head.add(ball(0.24, body, 0, -0.1, -1.25, 1, 1, 0.7, 10)); // rounded snout tip (the snout cylinder ends flat)
  [-1, 1].forEach((sx) => {
    head.add(ball(0.035, dark, sx * 0.09, 0, -1.385, 1, 0.7, 1, 6, false)); // nostrils
    head.add(ball(0.3, body, sx * 0.36, -0.12, 0.15, 0.55, 0.75, 1.3, 10, false)); // jaw muscle
  });
  if (fine) {
    for (let i = 0; i < 5; i++) { // bony bumps along the nose
      const z = -0.55 - i * 0.16;
      const tt = (-z - 0.45) / 0.8;
      head.add(ball(0.05, back, 0, -0.02 - 0.08 * tt + (0.36 - 0.12 * tt) * 0.93, z, 1, 0.7, 1.4, 6, false));
    }
  }
  const jaw = new THREE.Group(); // lower jaw, hinged at the back so the mouth can open
  jaw.position.set(0, -0.3, -0.1);
  jaw.add(link([0, 0, -0.1], [0, -0.03, -1.1], 0.26, 0.16, belly, true, 8));
  [-1, 1].forEach((sx) => {
    for (let i = 0; i < 3; i++) {
      const z = -0.5 - i * 0.22;
      jaw.add(link([sx * 0.15, 0.06, z], [sx * 0.15, 0.22, z], 0.04, 0, toothM, false, 4)); // lower teeth
    }
  });
  jaw.add(ball(0.16, belly, 0, -0.03, -1.1, 1, 1, 0.7, 8, false)); // rounded chin
  head.add(jaw);
  nk.add(head);

  // tail: four chained segments that sway one after another
  const tail = new THREE.Group();
  tail.position.set(0, 2.4, 1.45);
  tail.rotation.x = 0.1; // slightly down
  const lens = [1.1, 1.0, 0.9, 0.8];
  const rs = [0.7, 0.55, 0.42, 0.3, 0.06];
  const segs = [];
  let parent = tail;
  lens.forEach((len, i) => {
    const g = new THREE.Group();
    g.position.set(0, 0, i === 0 ? 0 : lens[i - 1]);
    g.add(link([0, 0, 0], [0, 0, len], rs[i], rs[i + 1], body, true, 8));
    parent.add(g);
    segs.push(g);
    parent = g;
  });
  inner.add(tail);
  if (fine) {
    segs.forEach((g, i) => { // small spikes ride on the tail segments, so they sway with it
      [0.25, 0.7].forEach((u) => {
        const r = lerp(rs[i], rs[i + 1], u) * 0.85;
        g.add(link([0, r, lens[i] * u], [0, r + 0.15 * (1 - i * 0.2), lens[i] * u + 0.05], 0.05, 0, back, false, 5));
      });
    });
  }

  // tiny two-clawed arms
  const makeArm = (x) => {
    const arm = new THREE.Group();
    arm.position.set(x, 2.35, -1.15);
    arm.rotation.x = 0.6;
    arm.add(link([0, 0, 0], [0, -0.3, -0.08], 0.13, 0.09, body, true, 8));
    arm.add(link([0, -0.3, -0.08], [0, -0.55, -0.2], 0.09, 0.06, body, true, 8));
    [-0.03, 0.03].forEach((cx) => arm.add(link([cx, -0.55, -0.2], [cx, -0.7, -0.32], 0.04, 0, toothM, false, 4)));
    return arm;
  };
  const armL = makeArm(-0.5);
  const armR = makeArm(0.5);
  inner.add(armL, armR);

  // powerful legs: thigh, knee, shin, three-toed foot with claws
  const makeLeg = (x) => {
    const hip = new THREE.Group();
    hip.position.set(x, 1.95, 0.3);
    hip.add(link([0, -0.1, 0], [0, -0.9, -0.3], 0.5, 0.3, body, true, 10));
    hip.add(ball(0.42, body, 0, -0.5, -0.12, 1, 1.25, 1, 10, false)); // thigh muscle
    const knee = new THREE.Group();
    knee.position.set(0, -0.9, -0.3);
    knee.add(link([0, 0, 0], [0, -1.0, 0.45], 0.3, 0.2, body, true, 8));
    const foot = new THREE.Group();
    foot.position.set(0, -1.0, 0.45);
    [[0, 0, -0.85], [-0.22, -0.1, -0.7], [0.22, 0.1, -0.7]].forEach(([tx, sx0, tz]) => {
      foot.add(link([sx0 * 0.5, 0.08, 0.05], [tx, 0.07, tz], 0.13, 0.09, body, true, 6));
      foot.add(link([tx, 0.07, tz], [tx, 0.0, tz - 0.2], 0.07, 0, toothM, false, 4)); // claw
    });
    foot.add(ball(0.2, body, 0, 0, 0, 1, 1, 1, 8, false)); // ankle
    foot.add(ball(0.15, belly, 0, 0.04, -0.5, 1, 0.5, 1.6, 8, false)); // toe pad
    knee.add(foot);
    hip.add(knee);
    return { hip, knee };
  };
  const LL = makeLeg(-0.65);
  const LR = makeLeg(0.65);
  inner.add(LL.hip, LR.hip);

  const A = createAnimator({ walk: 6, run: 14, rate: 6, leanK: 60, turnRef: 1.2, pivotK: 2, pivotMax: 6, stride: (v) => 4.4 + 2.6 * clamp((v - 6) / 8, 0, 1) });
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, rn, air, swim, atk, hurt, land, dead, rise, lean, turn } = A;
      const ph = A.phase;
      const s = Math.sin(ph);
      const c = Math.cos(ph);
      const gk = mv * (1 - air) * (1 - swim);
      const idle = (1 - gk) * (1 - air) * (1 - swim) * (1 - dead);
      const amp = lerp(0.38, 0.6, rn) * gk;
      let hL = s * amp; // alternating heavy steps
      let hR = -s * amp;
      let kL = -Math.max(0, c) * lerp(0.5, 0.9, rn) * gk;
      let kR = -Math.max(0, -c) * lerp(0.5, 0.9, rn) * gk;
      let lx = -(0.03 + 0.1 * rn) * gk - lean;
      // turning on the spot: each foot is lifted and set down in turn (slow, heavy steps)
      const pv = A.pv * (1 - air) * (1 - swim) * (1 - 0.6 * atk);
      hL += pv * 0.3 * Math.max(0, s);
      kL -= pv * 0.55 * Math.max(0, s);
      hR += pv * 0.3 * Math.max(0, -s);
      kR -= pv * 0.55 * Math.max(0, -s);
      // heavy footfall: both knees give a little as a foot comes down (the body sinks with them, the feet do not go into the ground)
      const th = 0.1 * gk * Math.pow(Math.abs(s), 8);
      kL -= th;
      kR -= th;
      const u = Math.max(rise, 0);
      hL = lerp(hL, 0.25 + 0.2 * u, air);
      hR = lerp(hR, 0.05 + 0.15 * u, air);
      kL = lerp(kL, -0.5, air);
      kR = lerp(kR, -0.4, air);
      hL += 0.6 * land; // landing: legs buckle, the body sinks
      hR += 0.55 * land;
      kL -= 1.3 * land;
      kR -= 1.2 * land;
      lx -= 0.12 * land;
      hL = lerp(hL, Math.sin(ph * 2) * 0.5, swim); // paddling
      hR = lerp(hR, -Math.sin(ph * 2) * 0.5, swim);
      kL = lerp(kL, -0.6, swim);
      kR = lerp(kR, -0.6, swim);
      hL = lerp(hL, 0.5, dead); // legs buckle on death
      hR = lerp(hR, 0.3, dead);
      kL = lerp(kL, -0.9, dead);
      kR = lerp(kR, -0.7, dead);
      // attack (fire breath): rear back, thrust the head forward, then hold the head up with the jaw open
      const aT = A.atkT;
      const lunge = aT < 0.18 ? aT / 0.18 : aT < 0.3 ? 1 - ((aT - 0.18) / 0.12) * 1.5 : -0.5 * Math.exp(-(aT - 0.3) * 6);
      let nx = -0.6 * lx + Math.sin(ph * 2) * 0.05 * gk;
      nx += atk * (-0.45 * lunge - 0.2) - 0.4 * hurt - 0.3 * swim + 0.35 * dead;
      lx += atk * 0.12 * lunge + 0.1 * hurt + 0.08 * swim;
      // grazing: lean forward and lower the neck until the mouth reaches the grass in front of the feet, biting rhythmically
      const eat = A.eat;
      const bt = 0.5 + 0.5 * Math.sin(A.t * 15);
      lx = lerp(lx, -0.2 - 0.04 * bt, eat);
      nx = lerp(nx, -1.0 - 0.12 * bt, eat);
      const b = Math.sin(A.t * (1.3 + 1.4 * gk)); // breathing: faster after running
      const jawBase = -(0.04 + 0.03 * Math.sin(A.t * 0.9)) * idle;
      const gape = Math.max(0, aT < 0.18 ? aT / 0.18 : 1 - (aT - 0.18) / 0.25); // the mouth gapes wide while the head rears back, then settles into the breath
      jaw.rotation.x = lerp(jawBase, -0.6 - 0.3 * gape + Math.sin(A.t * 16) * 0.05, atk) - 0.4 * hurt - 0.3 * dead - eat * 0.5 * (0.5 + 0.5 * Math.sin(A.t * 15 + 1.6));
      LL.hip.rotation.x = hL;
      LR.hip.rotation.x = hR;
      LL.knee.rotation.x = kL;
      LR.knee.rotation.x = kR;
      armL.rotation.x = armR.rotation.x = 0.6 + Math.sin(ph * 2) * 0.12 * gk + 0.3 * atk + Math.sin(A.t * 22) * 0.06 * hurt;
      inner.rotation.x = lx;
      inner.rotation.z = s * 0.04 * gk; // weight shifts over the planted foot
      inner.position.x = -s * 0.12 * gk;
      // the lowest foot is put exactly on the ground: reaching, bending and the heavy footfall lower the body, but no foot goes into the ground or hovers
      const feet = smin(
        legSole(-0.65, 1.95, 0.3, -0.9, -0.3, -1.05, 0.15, hL, kL, inner.rotation.x, inner.rotation.y, inner.rotation.z),
        legSole(0.65, 1.95, 0.3, -0.9, -0.3, -1.05, 0.15, hR, kR, inner.rotation.x, inner.rotation.y, inner.rotation.z),
        0.04,
      );
      inner.position.y = lerp(0.3 * swim + Math.sin(A.t * 1.4) * 0.06 * swim, -feet, (1 - air) * (1 - swim));
      inner.position.z = 0.35 * atk * lunge + 0.3 * hurt;
      neck.rotation.x = nx;
      neck.rotation.y = clamp(turn * 0.12, -0.5, 0.5) + Math.sin(A.t * 0.35) * 0.3 * idle * (1 - eat); // head leads the turn, looks around when idle
      neck.rotation.z = 0.5 * dead; // the head sinks towards the side it falls on
      head.rotation.x = lerp(-0.4 * lx + Math.sin(ph * 2 + 1) * 0.04 * gk - 0.2 * atk, 0.2 + 0.1 * bt, eat);
      tail.rotation.x = 0.1 - 0.3 * rn * gk + 0.3 * dead + 0.1 * land; // tail lifts when running (counterbalance)
      segs.forEach((g, i) => {
        g.rotation.y = Math.sin(ph - i * 0.8) * (0.1 + 0.14 * gk + 0.25 * swim) - turn * 0.06 * (i + 1) + Math.sin(A.t * 0.7 - i * 0.8) * 0.06 * idle + Math.sin(A.t * 30) * 0.15 * hurt;
      });
      torso.scale.set(0.95 + 0.012 * b, 0.95 + 0.025 * b, 1.7);
      bellyMesh.scale.set(0.84 + 0.015 * b, 0.82 + 0.03 * b, 1.62);
    },
  };
}

// ---- Triceratops: a heavy four-legged herbivore built like the T-Rex (smooth blobs + links, scaly skin, same animator) ----
function createTricera(color) {
  const root = new THREE.Group();
  const inner = new THREE.Group();
  root.add(inner);
  const base = new THREE.Color(color);
  const body = lambert(color);
  const belly = lambert(base.clone().lerp(new THREE.Color(0xffffff), 0.4));
  const back = lambert(base.clone().multiplyScalar(0.7));
  const frillM = lambert(base.clone().lerp(new THREE.Color(0xb5543a), 0.55));
  const hornM = lambert(0xe9e0c4);
  const beakM = lambert(0xd2c48a);
  const dark = lambert(0x161616);
  const eyeM = lambert(0xe8c547);
  eyeM.userData.glow = EL_GLOW.zap.map((v) => v * 0.55); // the eyes glow in the colour of its element
  const fine = CHAR_DETAIL >= 0.7;
  const skinMap = scaleTexture();
  skinify(skinMap, body, back, belly, frillM);

  const torso = ball(1, body, 0, 1.95, 0.15, 1.1, 1.0, 1.9, 16);
  const bellyMesh = ball(1, belly, 0, 1.7, 0.1, 0.96, 0.82, 1.8, 14);
  inner.add(torso, bellyMesh);
  [[-0.7, 2.85], [0.1, 2.9], [0.9, 2.82]].forEach(([z, y]) => inner.add(ball(0.45, back, 0, y, z, 1.1, 0.3, 1.2, 8, false)));
  if (fine) {
    for (let i = 0; i < 7; i++) { // bony bumps along the spine
      const z = -1.0 + i * 0.36;
      const y = 1.95 + Math.sqrt(Math.max(0, 1 - ((z - 0.15) / 1.9) ** 2));
      inner.add(ball(0.09, back, 0, y, z, 1, 0.9, 1, 5, false));
    }
  }

  // short thick neck, big head with beak, nose horn, two long brow horns and the bony frill
  const neck = new THREE.Group();
  neck.position.set(0, 2.2, -1.6);
  neck.add(link([0, 0, 0.5], [0, -0.1, -0.8], 0.85, 0.62, body, true, 10));
  const head = new THREE.Group();
  head.position.set(0, -0.15, -1.0);
  head.add(ball(0.62, body, 0, 0, 0, 0.95, 0.9, 1.3, 14));
  head.add(link([0, -0.12, -0.5], [0, -0.28, -1.25], 0.42, 0.26, body, true, 10));
  head.add(ball(0.27, beakM, 0, -0.3, -1.3, 0.85, 1.0, 0.95, 10)); // parrot-like beak
  head.add(link([0, 0.05, -1.0], [0, 0.42, -1.32], 0.12, 0, hornM, false, 6)); // nose horn
  [-1, 1].forEach((sx) => {
    head.add(ball(0.17, back, sx * 0.34, 0.3, -0.35, 1.1, 0.8, 1.2, 8, false));
    head.add(link([sx * 0.34, 0.3, -0.35], [sx * 0.66, 0.74, -1.8], 0.15, 0, hornM, true, 7)); // brow horns
    head.add(ball(0.09, eyeM, sx * 0.5, 0.16, -0.22, 1, 1, 1, 8, false));
    head.add(ball(0.05, dark, sx * 0.55, 0.16, -0.27, 0.6, 1.4, 0.8, 8, false));
    head.add(ball(0.3, body, sx * 0.42, -0.15, -0.1, 0.6, 0.8, 1.2, 10, false)); // cheek
  });
  const frill = new THREE.Group();
  frill.position.set(0, 0.45, 0.35);
  frill.rotation.x = -0.45;
  frill.add(ball(1, frillM, 0, 0.2, 0, 1.4, 1.15, 0.13, 20));
  const zapM = lambert(0xfff2a0); // the lightning marks glow in the element colour
  zapM.userData.glow = EL_GLOW.zap.map((v) => v * 0.8);
  if (fine) {
    frill.add(ball(1, belly, 0, 0.12, -0.09, 1.0, 0.8, 0.07, 16)); // lighter plate in the middle of the frill
    for (let i = 1; i < 9; i++) { // bony ribs radiating towards the rim
      const a = (i / 9) * Math.PI;
      frill.add(link([0, 0.05, -0.1], [Math.cos(a) * 1.25, 0.2 + Math.sin(a) * 1.02, -0.1], 0.03, 0.02, back, false, 4));
    }
    // a zig-zag lightning bolt across the frill
    const bolt = [[-0.5, 1.15], [-0.15, 0.78], [-0.4, 0.62], [0.05, 0.1], [-0.1, 0.0]];
    for (let i = 0; i < bolt.length - 1; i++) frill.add(link([bolt[i][0], bolt[i][1], -0.12], [bolt[i + 1][0], bolt[i + 1][1], -0.12], 0.045, 0.04, zapM, false, 4));
    for (let i = 0; i <= 10; i++) { // bony knobs around the rim of the frill
      const a = (i / 10) * Math.PI;
      frill.add(ball(0.1, hornM, Math.cos(a) * 1.38, 0.2 + Math.sin(a) * 1.13, 0, 1, 1, 0.9, 6, false));
    }
  }
  head.add(frill);
  if (fine) { // lightning marks along both flanks (point on the body surface from the ellipsoid)
    [-1, 1].forEach((sx) => {
      const pts = [[-0.9, 2.45], [-0.45, 2.1], [-0.7, 1.95], [-0.1, 1.55], [-0.35, 1.45]];
      const P = pts.map(([z, y]) => [sx * 1.1 * 1.03 * Math.sqrt(Math.max(0.02, 1 - ((y - 1.95) / 1.0) ** 2 - ((z - 0.15) / 1.9) ** 2)), y, z]);
      for (let i = 0; i < P.length - 1; i++) inner.add(link(P[i], P[i + 1], 0.045, 0.04, zapM, false, 4));
    });
  }
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.36, -0.2);
  jaw.add(link([0, 0, 0], [0, -0.05, -0.95], 0.28, 0.17, belly, true, 8));
  jaw.add(ball(0.17, beakM, 0, -0.05, -1.0, 1, 0.8, 1, 8, false));
  head.add(jaw);
  neck.add(head);
  inner.add(neck);

  // tail: three chained segments
  const tail = new THREE.Group();
  tail.position.set(0, 1.9, 1.9);
  tail.rotation.x = 0.25;
  const lens = [1.0, 0.9, 0.8];
  const rs = [0.6, 0.45, 0.3, 0.05];
  const segs = [];
  let parent = tail;
  lens.forEach((len, i) => {
    const g = new THREE.Group();
    g.position.set(0, 0, i === 0 ? 0 : lens[i - 1]);
    g.add(link([0, 0, 0], [0, 0, len], rs[i], rs[i + 1], body, true, 8));
    parent.add(g);
    segs.push(g);
    parent = g;
  });
  inner.add(tail);

  // four columnar legs: thigh, knee, shin, wide foot with three nails
  const LEGS = [[-0.78, -1.1, 0], [0.78, -1.1, Math.PI], [-0.8, 1.3, Math.PI], [0.8, 1.3, 0]]; // x, z, gait offset (diagonal pairs)
  const legs = LEGS.map(([x, z, off]) => {
    const hip = new THREE.Group();
    hip.position.set(x, 1.5, z);
    hip.add(link([0, 0, 0], [0, -0.75, 0.05], 0.4, 0.3, body, true, 10));
    const knee = new THREE.Group();
    knee.position.set(0, -0.75, 0.05);
    knee.add(link([0, 0, 0], [0, -0.62, -0.02], 0.3, 0.24, body, true, 8));
    knee.add(ball(0.3, body, 0, -0.67, -0.1, 1, 0.5, 1.3, 8));
    [-0.16, 0, 0.16].forEach((tx) => knee.add(link([tx, -0.7, -0.3], [tx, -0.72, -0.46], 0.07, 0, hornM, false, 4)));
    hip.add(knee);
    inner.add(hip);
    return { hip, knee, x, z, off };
  });

  const A = createAnimator({ walk: 4, run: 10, rate: 6, leanK: 60, turnRef: 1.2, pivotK: 2, pivotMax: 5, stride: (v) => 3.4 + 2 * clamp((v - 4) / 6, 0, 1) });
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, rn, air, swim, atk, hurt, land, dead, lean, turn } = A;
      const ph = A.phase;
      const s = Math.sin(ph);
      const gk = mv * (1 - air) * (1 - swim);
      const idle = (1 - gk) * (1 - air) * (1 - swim) * (1 - dead);
      const eat = A.eat;
      const bt = 0.5 + 0.5 * Math.sin(A.t * 15);
      const aT = A.atkT;
      const lunge = aT < 0.3 ? aT / 0.3 : Math.max(0, 1 - (aT - 0.3) / 0.4); // head goes down and forward, the body follows
      let lx = -lean - 0.02 * gk;
      lx = lerp(lx, -0.22 - 0.03 * bt, eat);
      lx -= 0.1 * atk * lunge;
      const wind = atk * (aT < 0.3 ? 1 : 0); // wind-up: it paws the ground with a front foot, head lowered
      const toss = atk * (aT > 0.3 && aT < 0.7 ? Math.sin(((aT - 0.3) / 0.4) * Math.PI) : 0); // then the horns scoop upwards
      const soles = legs.map((l) => {
        const q = ph + l.off;
        let t = Math.sin(q) * lerp(0.28, 0.45, rn) * gk;
        let k = -Math.max(0, Math.cos(q)) * lerp(0.4, 0.7, rn) * gk;
        const pv = A.pv * (1 - air) * (1 - swim) * (1 - 0.6 * atk);
        t += pv * 0.25 * Math.max(0, Math.sin(q));
        k -= pv * 0.45 * Math.max(0, Math.sin(q));
        t = lerp(t, 0.25, air); k = lerp(k, -0.5, air);
        t += 0.25 * land; k -= 0.5 * land;
        t = lerp(t, Math.sin(ph * 2 + l.off) * 0.5, swim); k = lerp(k, -0.5, swim);
        if (l.z < 0) { t += 0.2 * eat; k -= 0.5 * eat; } // front legs kneel a little to graze
        if (l.z < 0 && l.x > 0 && wind > 0) { t -= 0.5 * wind * Math.max(0, Math.sin(A.t * 14)); k -= 0.4 * wind * Math.max(0, Math.sin(A.t * 14)); } // the paw scrape
        t = lerp(t, 0.3, dead); k = lerp(k, -0.5, dead);
        l.hip.rotation.x = t;
        l.knee.rotation.x = k;
        return legSole(l.x, 1.5, l.z, -0.75, 0.05, -0.82, -0.08, t, k, lx, 0, 0);
      });
      inner.rotation.x = lx;
      inner.rotation.z = s * 0.03 * gk;
      inner.position.x = -s * 0.06 * gk;
      const feet = smin(smin(soles[0], soles[1], 0.04), smin(soles[2], soles[3], 0.04), 0.04);
      inner.position.y = lerp(0.3 * swim, -feet, (1 - air) * (1 - swim));
      inner.position.z = -0.45 * atk * lunge + 0.25 * hurt;
      let nx = -0.5 * lx + Math.sin(ph * 2) * 0.03 * gk;
      nx = lerp(nx, -0.55 - 0.08 * bt, eat);
      nx += atk * (-0.55 * lunge) + 0.3 * hurt + 0.3 * dead - 0.55 * toss + 0.12 * wind;
      neck.rotation.x = nx;
      neck.rotation.y = clamp(turn * 0.1, -0.4, 0.4) + Math.sin(A.t * 0.4) * 0.25 * idle * (1 - eat) + Math.sin(A.t * 28) * 0.12 * hurt;
      neck.rotation.z = 0.5 * dead;
      head.rotation.x = lerp(-0.3 * lx, 0.5, eat) + 0.4 * atk * lunge - 0.5 * toss + Math.sin(ph * 2) * 0.04 * gk; // the head bobs with the stride
      frill.rotation.x = -0.45 + 0.04 * Math.sin(A.t * 1.4) * idle - 0.12 * toss + 0.1 * hurt;
      const zp = 0.18 + 0.2 * Math.max(0, Math.sin(A.t * 2.4)) + atk * (Math.random() < 0.5 ? 0.7 : 0.25); // the frill flickers with electricity, wildly while it attacks
      frillM.userData.glow = EL_GLOW.zap.map((v) => v * zp);
      jaw.rotation.x = -(0.03 + 0.02 * Math.sin(A.t * 0.9)) * idle - eat * 0.35 * (0.5 + 0.5 * Math.sin(A.t * 15 + 1.6)) - 0.25 * hurt - 0.2 * dead;
      tail.rotation.x = 0.25 - 0.15 * rn * gk + 0.25 * dead;
      segs.forEach((g, i) => { g.rotation.y = Math.sin(ph - i * 0.8) * (0.08 + 0.1 * gk) - turn * 0.05 * (i + 1) + Math.sin(A.t * 0.7 - i) * 0.06 * idle + Math.sin(A.t * 9 - i) * 0.2 * wind; });
      const b = Math.sin(A.t * (1.1 + 1.2 * gk));
      torso.scale.set(1.1 + 0.012 * b, 1.0 + 0.025 * b, 1.9);
    },
  };
}

// ---- Velociraptor: a fast, slim two-legged hunter with a long stiff tail, sickle claws and a narrow snout ----
function createRaptor(color) {
  const root = new THREE.Group();
  const inner = new THREE.Group();
  root.add(inner);
  const base = new THREE.Color(color);
  const body = lambert(color);
  const belly = lambert(base.clone().lerp(new THREE.Color(0xffffff), 0.5));
  const back = lambert(base.clone().multiplyScalar(0.62));
  const dark = lambert(0x161616);
  const eyeM = lambert(0xe8c547);
  eyeM.userData.glow = EL_GLOW.wind.map((v) => v * 0.55); // the eyes glow in the colour of its element
  const toothM = lambert(0xf2efe2);
  const fine = CHAR_DETAIL >= 0.7;
  const skinMap = scaleTexture();
  skinify(skinMap, body, back, belly);

  const torso = ball(1, body, 0, 1.15, 0.1, 0.34, 0.38, 0.85, 14);
  const bellyMesh = ball(1, belly, 0, 1.03, 0.07, 0.29, 0.3, 0.8, 12);
  inner.add(torso, bellyMesh);
  if (fine) {
    for (let i = 0; i < 6; i++) { // dark stripes across the back
      const z = -0.5 + i * 0.22;
      const y = 1.15 + 0.38 * Math.sqrt(Math.max(0, 1 - ((z - 0.1) / 0.85) ** 2));
      inner.add(ball(0.12, back, 0, y - 0.02, z, 1.5, 0.35, 0.6, 6, false));
    }
  }
  const neck = new THREE.Group();
  neck.position.set(0, 1.3, -0.6);
  neck.add(link([0, -0.05, 0.1], [0, 0.4, -0.5], 0.22, 0.14, body, true, 8));
  const head = new THREE.Group();
  head.position.set(0, 0.45, -0.58);
  head.add(ball(0.2, body, 0, 0, 0.02, 0.9, 0.85, 1.25, 10));
  head.add(link([0, -0.02, -0.2], [0, -0.06, -0.68], 0.13, 0.07, body, true, 8));
  head.add(ball(0.07, body, 0, -0.06, -0.7, 1, 0.9, 1.1, 6, false));
  [-1, 1].forEach((sx) => {
    head.add(ball(0.05, eyeM, sx * 0.15, 0.07, -0.1, 1, 1, 1, 6, false));
    head.add(ball(0.025, dark, sx * 0.18, 0.07, -0.13, 0.6, 1.4, 0.8, 6, false));
    head.add(ball(0.06, back, sx * 0.14, 0.13, -0.08, 1.2, 0.5, 1.5, 6, false));
    if (fine) for (let i = 0; i < 4; i++) head.add(link([sx * 0.07, -0.1, -0.3 - i * 0.1], [sx * 0.07, -0.2, -0.3 - i * 0.1], 0.02, 0, toothM, false, 4));
  });
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.13, -0.05);
  jaw.add(link([0, 0, -0.05], [0, -0.02, -0.58], 0.1, 0.05, belly, true, 6));
  head.add(jaw);
  neck.add(head);
  inner.add(neck);

  const tail = new THREE.Group();
  tail.position.set(0, 1.12, 0.8);
  const lens = [0.55, 0.5, 0.5, 0.45, 0.4];
  const rs = [0.22, 0.17, 0.13, 0.1, 0.06, 0.02];
  const segs = [];
  let parent = tail;
  lens.forEach((len, i) => {
    const g = new THREE.Group();
    g.position.set(0, 0, i === 0 ? 0 : lens[i - 1]);
    g.add(link([0, 0, 0], [0, 0, len], rs[i], rs[i + 1], body, true, 6));
    parent.add(g);
    segs.push(g);
    parent = g;
  });
  inner.add(tail);

  const makeArm = (x) => {
    const arm = new THREE.Group();
    arm.position.set(x, 1.1, -0.5);
    arm.rotation.x = 0.7;
    arm.add(link([0, 0, 0], [0, -0.22, -0.06], 0.06, 0.045, body, true, 6));
    arm.add(link([0, -0.22, -0.06], [0, -0.38, -0.2], 0.045, 0.03, body, true, 6));
    [-0.03, 0, 0.03].forEach((cx) => arm.add(link([cx, -0.38, -0.2], [cx, -0.48, -0.3], 0.02, 0, toothM, false, 4)));
    return arm;
  };
  const armL = makeArm(-0.3);
  const armR = makeArm(0.3);
  inner.add(armL, armR);

  const makeLeg = (x) => {
    const hip = new THREE.Group();
    hip.position.set(x, 1.0, 0.15);
    hip.add(link([0, -0.05, 0], [0, -0.5, -0.15], 0.24, 0.13, body, true, 8));
    hip.add(ball(0.2, body, 0, -0.25, -0.05, 1, 1.3, 1, 8, false));
    const knee = new THREE.Group();
    knee.position.set(0, -0.5, -0.15);
    knee.add(link([0, 0, 0], [0, -0.5, 0.2], 0.12, 0.07, body, true, 6));
    const foot = new THREE.Group();
    foot.position.set(0, -0.5, 0.2);
    [[0, -0.34], [-0.1, -0.28], [0.1, -0.28]].forEach(([tx, tz]) => {
      foot.add(link([0, 0.04, 0], [tx, 0.03, tz], 0.05, 0.035, body, true, 5));
      foot.add(link([tx, 0.03, tz], [tx, 0, tz - 0.1], 0.03, 0, toothM, false, 4));
    });
    foot.add(link([0.02, 0.04, -0.12], [0.02, -0.14, -0.3], 0.04, 0, toothM, false, 5)); // the sickle claw
    knee.add(foot);
    hip.add(knee);
    inner.add(hip);
    return { hip, knee };
  };
  const LL = makeLeg(-0.27);
  const LR = makeLeg(0.27);

  const A = createAnimator({ walk: 5, run: 16, rate: 8, leanK: 50, turnRef: 1.5, pivotK: 3, pivotMax: 8, stride: (v) => 2.2 + 2 * clamp((v - 5) / 11, 0, 1) });
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, rn, air, swim, atk, hurt, land, dead, lean, turn } = A;
      const ph = A.phase;
      const s = Math.sin(ph);
      const c = Math.cos(ph);
      const gk = mv * (1 - air) * (1 - swim);
      const idle = (1 - gk) * (1 - air) * (1 - swim) * (1 - dead);
      const eat = A.eat;
      const bt = 0.5 + 0.5 * Math.sin(A.t * 15);
      const aT = A.atkT;
      const lunge = aT < 0.18 ? aT / 0.18 : Math.max(0, 1 - (aT - 0.18) / 0.25);
      const amp = lerp(0.5, 0.8, rn) * gk;
      let hL = s * amp;
      let hR = -s * amp;
      let kL = -Math.max(0, c) * lerp(0.6, 1.1, rn) * gk;
      let kR = -Math.max(0, -c) * lerp(0.6, 1.1, rn) * gk;
      const pv = A.pv * (1 - air) * (1 - swim);
      hL += pv * 0.3 * Math.max(0, s); kL -= pv * 0.55 * Math.max(0, s);
      hR += pv * 0.3 * Math.max(0, -s); kR -= pv * 0.55 * Math.max(0, -s);
      let lx = -(0.04 + 0.16 * rn) * gk - lean - 0.35 * atk * lunge;
      hL = lerp(hL, 0.3, air); hR = lerp(hR, 0.1, air);
      kL = lerp(kL, -0.6, air); kR = lerp(kR, -0.5, air);
      hL += 0.7 * land; hR += 0.65 * land; kL -= 1.4 * land; kR -= 1.3 * land;
      hL = lerp(hL, Math.sin(ph * 2) * 0.5, swim); hR = lerp(hR, -Math.sin(ph * 2) * 0.5, swim);
      kL = lerp(kL, -0.6, swim); kR = lerp(kR, -0.6, swim);
      lx = lerp(lx, -0.45 - 0.05 * bt, eat); // crouch and bend the whole body down to the grass
      hL += 0.5 * eat; hR += 0.5 * eat; kL -= 1.0 * eat; kR -= 1.0 * eat;
      hL = lerp(hL, 0.5, dead); hR = lerp(hR, 0.3, dead);
      kL = lerp(kL, -0.9, dead); kR = lerp(kR, -0.7, dead);
      LL.hip.rotation.x = hL; LR.hip.rotation.x = hR;
      LL.knee.rotation.x = kL; LR.knee.rotation.x = kR;
      armL.rotation.x = armR.rotation.x = 0.7 + Math.sin(ph * 2) * 0.15 * gk + 0.8 * atk * lunge;
      inner.rotation.x = lx;
      inner.rotation.z = s * 0.05 * gk;
      inner.position.x = -s * 0.05 * gk;
      const feet = smin(
        legSole(-0.27, 1.0, 0.15, -0.5, -0.15, -0.52, 0.05, hL, kL, lx, 0, inner.rotation.z),
        legSole(0.27, 1.0, 0.15, -0.5, -0.15, -0.52, 0.05, hR, kR, lx, 0, inner.rotation.z),
        0.04,
      );
      inner.position.y = lerp(0.3 * swim, -feet, (1 - air) * (1 - swim));
      inner.position.z = -0.3 * atk * lunge + 0.2 * hurt;
      let nx = -0.6 * lx + Math.sin(ph * 2) * 0.05 * gk;
      nx = lerp(nx, -0.85 - 0.1 * bt, eat);
      nx += atk * (-0.3 * lunge) - 0.4 * hurt + 0.4 * dead;
      neck.rotation.x = nx;
      neck.rotation.y = clamp(turn * 0.12, -0.5, 0.5) + Math.sin(A.t * 0.5) * 0.35 * idle * (1 - eat) + Math.sin(A.t * 30) * 0.1 * hurt;
      neck.rotation.z = 0.5 * dead;
      head.rotation.x = lerp(-0.4 * lx - 0.15 * atk, 0.35, eat);
      jaw.rotation.x = -(0.05 + 0.03 * Math.sin(A.t * 1.1)) * idle - 0.7 * atk * Math.max(0.3, lunge) - eat * 0.4 * (0.5 + 0.5 * Math.sin(A.t * 15 + 1.6)) - 0.3 * hurt - 0.3 * dead;
      tail.rotation.x = -0.1 * rn * gk + 0.3 * dead + 0.1 * land; // held stiff and level, it lifts a little when running
      segs.forEach((g, i) => { g.rotation.y = Math.sin(ph - i * 0.8) * (0.05 + 0.1 * gk) - turn * 0.05 * (i + 1) + Math.sin(A.t * 0.9 - i) * 0.05 * idle; });
      torso.scale.set(0.34, 0.38 + 0.015 * Math.sin(A.t * (1.5 + 2 * gk)), 0.85);
    },
  };
}

// ---- Pteranodon: the flyer (ice element). A small light body, a very long toothless beak balanced by a long crest that points backwards,
// and wings made of a thin leathery membrane stretched between the body and ONE enormously long fourth finger (wingspan ~9 m). ----
// one wing membrane (sx = -1 left, +1 right), local to the shoulder: leading edge S -> W (wrist) -> T (tip, swept back),
// trailing edge T -> P1 -> P2 -> P3 curving in (scalloped) to the hip H
const WING_PTS = {
  S: [0, 0, 0], W: [1.7, 0.1, 0.18], T: [4.5, -0.1, 1.0], P1: [3.4, -0.1, 1.28], P2: [2.35, -0.14, 1.45], P3: [1.35, -0.2, 1.55], H: [0.35, -0.32, 1.6],
};
function wingMembrane(sx, mat) {
  // a real membrane instead of one flat fan: a grid between the leading edge (arm -> wrist -> finger tip) and the trailing edge (hip -> tip),
  // arched like a sail (camber), with the trailing edge scalloped between the anchor points, shaded darker along the bones and with faint ribs (fibres)
  const lead = ['S', 'W', 'T'];
  const trail = ['H', 'P3', 'P2', 'P1', 'T'];
  const along = (keys, t) => {
    const n = keys.length - 1;
    const f = clamp(t, 0, 1) * n;
    const i = Math.min(Math.floor(f), n - 1);
    const fr = f - i;
    const A = WING_PTS[keys[i]];
    const B = WING_PTS[keys[i + 1]];
    return [A[0] + (B[0] - A[0]) * fr, A[1] + (B[1] - A[1]) * fr, A[2] + (B[2] - A[2]) * fr, fr];
  };
  const NU = 16;
  const NV = 6;
  const pos = [];
  const col = [];
  for (let i = 0; i <= NU; i++) {
    const u = i / NU;
    const a = along(lead, u);
    const b = along(trail, u);
    const scallop = Math.sin(b[3] * Math.PI) * 0.3 * (u > 0.02 && u < 0.98 ? 1 : 0); // the edge sags in between the fibres
    for (let j = 0; j <= NV; j++) {
      const v = j / NV;
      const e = v * v * (3 - 2 * v);
      const ex = b[0] + (a[0] - b[0]) * scallop * 0.35;
      const ez = b[2] + (a[2] - b[2]) * scallop * 0.35;
      const x = a[0] + (ex - a[0]) * e;
      const z = a[2] + (ez - a[2]) * e;
      const y = a[1] + (b[1] - a[1]) * e + Math.sin(Math.PI * Math.min(1, v * 1.15)) * 0.16 * (1 - u * 0.55) - 0.05 * v * v;
      pos.push(x * sx, y, z);
      const shade = (0.5 + 0.5 * smoothstep(0, 0.35, v)) * (0.86 + 0.14 * (1 - v)) * (i % 2 ? 0.94 : 1) * (0.94 + 0.06 * Math.sin(i * 2.3 + j));
      col.push(shade, shade, shade);
    }
  }
  const idx = [];
  for (let i = 0; i < NU; i++) {
    for (let j = 0; j < NV; j++) {
      const k = i * (NV + 1) + j;
      const m = k + NV + 1;
      idx.push(k, m, k + 1, k + 1, m, m + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  return m;
}

function createPtero(color) {
  const root = new THREE.Group();
  const inner = new THREE.Group();
  root.add(inner);
  const base = new THREE.Color(color);
  const body = lambert(color);
  const belly = lambert(base.clone().lerp(new THREE.Color(0xffffff), 0.5));
  const back = lambert(base.clone().multiplyScalar(0.62));
  const bone = lambert(base.clone().multiplyScalar(0.5));
  const wingM = lambert(base.clone().lerp(new THREE.Color(0x6b4a3a), 0.45)); // leathery brown-grey skin
  wingM.side = THREE.DoubleSide;
  wingM.vertexColors = true; // the membrane is shaded per vertex (darker along the bones)
  const veinM = lambert(base.clone().multiplyScalar(0.38));
  const crestM = lambert(0xc8483a);
  const beakM = lambert(0xe6dcb6);
  const dark = lambert(0x161616);
  const eyeM = lambert(0xe8c547);
  eyeM.userData.glow = EL_GLOW.ice.map((v) => v * 0.55);
  crestM.userData.glow = EL_GLOW.ice.map((v) => v * 0.25);
  skinify(scaleTexture(), body, back, belly);

  // small, deep-chested body with a very short tail
  const torso = ball(0.5, body, 0, 1.55, 0.15, 0.75, 0.75, 1.55, 12);
  inner.add(torso, ball(0.46, belly, 0, 1.46, 0.12, 0.7, 0.68, 1.5, 10));
  inner.add(link([0, 1.5, 0.9], [0, 1.44, 1.45], 0.14, 0.03, body, true, 6));

  // thin neck, then a head that is mostly beak: the long straight upper beak, a shorter lower beak and a long crest sweeping back
  const neck = new THREE.Group();
  neck.position.set(0, 1.78, -0.62);
  neck.add(link([0, 0, 0], [0, 0.55, -0.6], 0.17, 0.11, body, true, 8));
  const head = new THREE.Group();
  head.position.set(0, 0.6, -0.65);
  head.add(ball(0.17, body, 0, 0, 0, 0.8, 0.85, 1.35, 10));
  head.add(link([0, -0.01, -0.18], [0, 0.03, -2.0], 0.1, 0.018, beakM, true, 6)); // upper beak, the tip tilts slightly up
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.12, -0.12);
  jaw.add(link([0, 0, 0], [0, -0.02, -1.5], 0.065, 0.015, beakM, true, 5)); // the lower beak is shorter
  head.add(jaw);
  head.add(link([0, 0.08, 0.1], [0, 0.34, 1.15], 0.075, 0.008, crestM, true, 5)); // the crest
  head.add(link([0, 0.1, 0.1], [0, 0.17, 0.65], 0.05, 0.01, crestM, true, 4));
  [-1, 1].forEach((sx) => {
    head.add(ball(0.045, eyeM, sx * 0.14, 0.05, -0.15, 1, 1, 1, 6, false));
    head.add(ball(0.022, dark, sx * 0.165, 0.05, -0.17, 0.6, 1.3, 0.8, 6, false));
  });
  // the fish it has caught, held crosswise in the beak (shown while it swallows)
  const fishInBeak = new THREE.Group();
  fishInBeak.position.set(0, -0.1, -1.2);
  fishInBeak.add(ball(0.09, lambert(0xa9b9c4), 0, 0, 0, 0.55, 0.55, 2.2, 8, false));
  fishInBeak.add(link([0, 0, 0.25], [0, 0, 0.5], 0.05, 0.1, lambert(0x7d93a4), false, 4));
  fishInBeak.visible = false;
  head.add(fishInBeak);
  neck.add(head);
  inner.add(neck);

  // wings: short upper arm, the forearm and wrist, then the very long finger that carries the membrane
  const wings = [-1, 1].map((sx) => {
    const w = new THREE.Group();
    w.position.set(sx * 0.38, 1.78, -0.15);
    const L = (k) => WING_PTS[k].map((c, i) => (i === 0 ? c * sx : c));
    w.add(link(L('S'), L('W'), 0.1, 0.06, body, true, 6)); // arm to the wrist
    w.add(link(L('W'), L('T'), 0.055, 0.012, bone, true, 5)); // the wing finger
    w.add(ball(0.09, body, L('W')[0], L('W')[1], L('W')[2], 1, 1, 1, 6, false)); // wrist
    w.add(link(L('W'), [sx * 2.0, -0.02, 0.4], 0.03, 0.012, bone, false, 4)); // the small fingers at the wrist
    w.add(wingMembrane(sx, wingM));
    inner.add(w);
    return w;
  });

  const makeLeg = (x) => {
    const hip = new THREE.Group();
    hip.position.set(x, 1.3, 0.55);
    hip.add(link([0, 0, 0], [0, -0.55, -0.05], 0.085, 0.06, body, true, 6));
    const knee = new THREE.Group();
    knee.position.set(0, -0.55, -0.05);
    knee.add(link([0, 0, 0], [0, -0.6, 0.08], 0.06, 0.035, body, true, 6));
    knee.add(ball(0.09, beakM, 0, -0.62, -0.02, 1, 0.45, 1.9, 6, false)); // foot
    hip.add(knee);
    inner.add(hip);
    return { hip, knee };
  };
  const LL = makeLeg(-0.18);
  const LR = makeLeg(0.18);

  const A = createAnimator({ walk: 4, run: 8, rate: 8, leanK: 80, turnRef: 2, pivotK: 3, pivotMax: 6, stride: (v) => 1.8 + 1.2 * clamp((v - 4) / 4, 0, 1) });
  let eatW = 0;
  let lastBite = 0;
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, rn, air, atk, hurt, land, dead, rise, lean, turn } = A;
      const ph = A.phase;
      const s = Math.sin(ph);
      const c = Math.cos(ph);
      const gk = mv * (1 - air);
      const idle = (1 - gk) * (1 - air) * (1 - dead);
      const aT = A.atkT;
      const lunge = aT < 0.18 ? aT / 0.18 : Math.max(0, 1 - (aT - 0.18) / 0.3);
      // eating / drinking on the ground (head down), swallowing a fish in the air
      eatW = approach(eatW, (st.eating || st.drinking) && !st.flying && dead < 0.5 ? 1 : 0, 6, dt);
      const carry = st.carry > 0 ? 1 : 0;
      fishInBeak.visible = st.carry > 0.4;
      // the legs walk on the ground and trail behind in the air
      let hL = s * 0.5 * gk;
      let hR = -s * 0.5 * gk;
      let kL = -Math.max(0, c) * 0.7 * gk;
      let kR = -Math.max(0, -c) * 0.7 * gk;
      hL = lerp(hL, -0.9, air);
      hR = lerp(hR, -0.9, air);
      kL = lerp(kL, -0.5, air);
      kR = lerp(kR, -0.5, air);
      hL += 0.4 * land;
      hR += 0.4 * land;
      kL -= 0.8 * land;
      kR -= 0.8 * land;
      hL = lerp(hL, 0.3, dead);
      hR = lerp(hR, 0.2, dead);
      LL.hip.rotation.x = hL;
      LR.hip.rotation.x = hR;
      LL.knee.rotation.x = kL;
      LR.knee.rotation.x = kR;
      // wings. In the air they open fully: the downstroke is slow and wide, the upstroke folds the tip (it flaps while climbing and mostly soars when level).
      // On the ground they fold back along the body, the wing finger pointing backwards, and the membrane is gathered.
      const flapRate = 3.2 + 3 * Math.max(rise, 0);
      const fl = Math.sin(A.t * flapRate);
      const glide = clamp(1 - Math.abs(rise) * 1.4, 0, 1) * clamp(A.mv, 0, 1);
      const amp = lerp(0.65, 0.12, glide * 0.9);
      let wa = lerp(0, 0.1 + fl * amp + 0.12 * Math.max(-rise, 0), air); // wing elevation: + = up
      wa = lerp(wa, -0.9, dead);
      const fold = (1 - air) * (1 - 0.35 * dead) * (1 - 0.75 * clamp(land * 2, 0, 1)); // 0 = open, 1 = folded; the wings flare out to brake as the feet touch down
      wings.forEach((w, i) => {
        const sx = i === 0 ? -1 : 1;
        w.rotation.z = -sx * wa * -1;
        w.rotation.y = -sx * (1.38 * fold + 0.1 * (1 - fold) * Math.sin(A.t * flapRate) * air); // the wing sweeps back when folded
        w.scale.set(1 - 0.72 * fold, 1, 1 - 0.3 * fold); // the membrane is gathered
        w.rotation.x = 0.05 * fl * air - 0.6 * fold; // the folded wing lies along the flank
      });
      // the tip of the finger folds on the upstroke (the wing bends at the wrist)
      inner.rotation.x = clamp(0.5 * rise, -0.5, 0.5) * air - 0.1 * rn * gk - lean * 0.5 + 0.1 * hurt - 0.12 * atk * lunge;
      inner.rotation.z = clamp(turn * 0.12, -0.5, 0.5) * air + Math.sin(A.t * 30) * 0.05 * hurt;
      inner.position.y = 0.16 * Math.sin(A.t * flapRate + 1) * air * (1 - glide);
      neck.rotation.x = -0.15 * air - 0.5 * atk * lunge + 0.45 * dead + 1.1 * eatW + Math.sin(A.t * 1.4) * 0.04 * idle + 0.25 * carry;
      neck.rotation.y = clamp(turn * 0.1, -0.4, 0.4) + Math.sin(A.t * 0.5) * 0.3 * idle * (1 - eatW);
      const bite = Math.sin(A.t * 15) * eatW;
      head.rotation.x = Math.sin(ph * 2) * 0.05 * gk + 0.15 * atk + 0.35 * eatW + 0.12 * bite - 0.4 * carry;
      jaw.rotation.x = -0.05 * idle - 0.6 * atk * Math.max(0.3, lunge) - 0.3 * hurt - 0.3 * dead - 0.35 * Math.max(0, bite) - 0.25 * carry * (0.5 + 0.5 * Math.sin(A.t * 9));
      torso.scale.set(0.75 + 0.012 * Math.sin(A.t * 1.6), 0.75, 1.55);
      // chewing / pecking sounds come from the animator events
      if (eatW > 0.9) {
        const b = Math.floor(A.t * 2.4);
        if (b !== lastBite) { lastBite = b; A.events.push({ type: st.drinking ? 'sip' : 'chomp' }); }
      }
    },
  };
}

// ---- long-bodied sea creatures (water element) ----
function createMosa(color) {
  const root = new THREE.Group();
  const inner = new THREE.Group();
  root.add(inner);
  const base = new THREE.Color(color);
  const body = lambert(color);
  const belly = lambert(base.clone().lerp(new THREE.Color(0xffffff), 0.5));
  const back = lambert(base.clone().multiplyScalar(0.6));
  const finM = lambert(base.clone().lerp(new THREE.Color(0x0b2f45), 0.45));
  const toothM = lambert(0xf2efe2);
  const dark = lambert(0x161616);
  const eyeM = lambert(0xe8c547);
  eyeM.userData.glow = EL_GLOW.water.map((v) => v * 0.55);
  finM.userData.glow = EL_GLOW.water.map((v) => v * 0.18);
  skinify(scaleTexture(), body, back, belly);
  const BY = 1.1; // height of the body's centre above the origin

  const torso = ball(1, body, 0, BY, 0, 0.8, 0.8, 2.0, 14);
  const bellyMesh = ball(1, belly, 0, BY - 0.2, -0.1, 0.7, 0.62, 1.85, 12);
  inner.add(torso, bellyMesh);
  inner.add(ball(0.5, finM, 0, BY + 0.85, 0.1, 0.07, 1.0, 1.0, 8)); // dorsal fin
  inner.add(ball(0.4, back, 0, BY + 0.6, -0.9, 0.9, 0.35, 1.5, 8, false));

  const neck = new THREE.Group(); // lunges forward on an attack
  neck.position.set(0, BY + 0.05, -1.85);
  const head = new THREE.Group();
  head.add(ball(0.58, body, 0, 0, -0.25, 0.9, 0.78, 1.4, 12));
  head.add(link([0, -0.04, -0.7], [0, -0.1, -1.7], 0.36, 0.2, body, true, 8)); // long snout
  head.add(ball(0.2, body, 0, -0.1, -1.7, 1, 0.9, 0.8, 8));
  [-1, 1].forEach((sx) => {
    head.add(ball(0.09, eyeM, sx * 0.44, 0.2, -0.45, 1, 1, 1, 8, false));
    head.add(ball(0.05, dark, sx * 0.49, 0.2, -0.5, 0.6, 1.4, 0.8, 6, false));
    head.add(ball(0.14, back, sx * 0.4, 0.34, -0.4, 1.2, 0.5, 1.6, 8, false));
    for (let i = 0; i < 5; i++) head.add(link([sx * 0.2, -0.22, -0.75 - i * 0.2], [sx * 0.2, -0.42, -0.75 - i * 0.2], 0.045, 0, toothM, false, 4));
  });
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.3, -0.15);
  jaw.add(link([0, 0, -0.1], [0, -0.03, -1.55], 0.26, 0.14, belly, true, 8));
  [-1, 1].forEach((sx) => {
    for (let i = 0; i < 4; i++) jaw.add(link([sx * 0.15, 0.06, -0.55 - i * 0.24], [sx * 0.15, 0.24, -0.55 - i * 0.24], 0.04, 0, toothM, false, 4));
  });
  head.add(jaw);
  neck.add(head);
  inner.add(neck);

  const tail = new THREE.Group();
  tail.position.set(0, BY, 1.85);
  const lens = [1.1, 1.0, 0.95, 0.9, 0.8];
  const rs = [0.58, 0.46, 0.36, 0.27, 0.18, 0.05];
  const segs = [];
  let parent = tail;
  lens.forEach((len, i) => {
    const g = new THREE.Group();
    g.position.set(0, 0, i === 0 ? 0 : lens[i - 1]);
    g.add(link([0, 0, 0], [0, 0, len], rs[i], rs[i + 1], body, true, 8));
    if (i === lens.length - 1) g.add(ball(0.7, finM, 0, 0.12, len * 0.85, 0.07, 1.0, 0.9, 8)); // the tail fluke
    parent.add(g);
    segs.push(g);
    parent = g;
  });
  inner.add(tail);

  const flippers = [[-1, -1.0], [1, -1.0], [-1, 1.0], [1, 1.0]].map(([sx, z], k) => {
    const g = new THREE.Group();
    g.position.set(sx * 0.7, BY - 0.45, z);
    g.add(link([0, 0, 0], [sx * 1.5, -0.35, 0.4], 0.14, 0.07, body, true, 6));
    g.add(ball(0.7, finM, sx * 1.05, -0.25, 0.3, 1.0, 0.09, 0.7, 8));
    inner.add(g);
    return { g, sx, k };
  });

  const A = createAnimator({ walk: 7, run: 16, rate: 6, leanK: 60, turnRef: 1.2, pivotK: 2, pivotMax: 5, stride: (v) => 5 + 3 * clamp((v - 7) / 9, 0, 1) });
  let gW = 0; // holding a victim: the head thrashes and the whole body shakes
  return {
    root,
    anim: A,
    update(dt, st) {
      A.update(dt, st);
      const { mv, atk, hurt, dead, rise, turn } = A;
      const ph = A.phase;
      const sw = 0.25 + 0.75 * mv;
      const aT = A.atkT;
      const lunge = aT < 0.2 ? aT / 0.2 : Math.max(0, 1 - (aT - 0.2) / 0.35);
      gW = approach(gW, st.grab && st.alive !== false ? 1 : 0, 8, dt);
      const alive = 1 - dead;
      segs.forEach((g, i) => { // the tail drives it: the wave grows towards the tip, stronger while holding prey, limp when dead
        g.rotation.y = (Math.sin(ph - i * 0.9) * (0.12 + 0.22 * sw) * alive - turn * 0.07 * (i + 1) + Math.sin(A.t * 30) * 0.12 * hurt) * (1 + 0.5 * gW) + Math.sin(A.t * 12 - i) * 0.14 * gW;
      });
      flippers.forEach(({ g, sx, k }) => {
        g.rotation.z = sx * -Math.sin(ph + k * 1.1) * 0.55 * sw * alive - sx * 0.5 * dead; // paddling, hanging limp when dead
        g.rotation.x = Math.cos(ph + k * 1.1) * 0.25 * sw * alive;
      });
      inner.rotation.x = clamp(0.55 * rise, -0.5, 0.5) + 0.08 * hurt;
      inner.rotation.z = clamp(turn * 0.06, -0.3, 0.3) * alive + Math.sin(A.t * 11) * 0.12 * gW; // shakes the victim (the belly-up roll on death comes from fall)
      inner.position.y = Math.sin(A.t * 1.3) * 0.05;
      neck.rotation.y = clamp(turn * 0.1, -0.4, 0.4) + Math.sin(A.t * 0.5) * 0.12 * alive + Math.sin(A.t * 13) * 0.4 * gW;
      neck.rotation.x = -0.25 * atk * lunge + 0.2 * dead;
      neck.position.z = -1.85 - 0.6 * atk * lunge;
      jaw.rotation.x = -0.05 - 0.03 * Math.sin(A.t * 0.9) - 0.85 * atk * Math.max(0.3, lunge) - 0.3 * hurt - 0.3 * dead;
      tail.rotation.x = 0.15 * rise;
      torso.scale.set(0.8 + 0.012 * Math.sin(A.t * 1.8), 0.8 + 0.02 * Math.sin(A.t * 1.8), 2.0);
    },
  };
}

  const tsegs = [];
  let tp = tail;
  lens.forEach((len, i) => {

    tp = g;

  const flippers = [[-1, -0.7], [1, -0.7], [-1, 0.8], [1, 0.8]].map(([sx, z], k) => {

    g.add(ball(0.8, finM, sx * 1.15, -0.22, 0.35, 1.0, 0.08, 0.75, 8));

      gW = approach(gW, st.grab && st.alive !== false ? 1 : 0, 8, dt);

        g.rotation.y = Math.sin(A.t * 1.1 - i * 0.5) * 0.1 * (1 - atk) * alive + clamp(turn * 0.04, -0.15, 0.15) + Math.sin(A.t * 11 - i * 0.7) * 0.22 * gW;
      });

      });
      flippers.forEach(({ g, sx, k }) => { // four flippers paddle in alternating pairs; limp when dead
        g.rotation.z = sx * -Math.sin(ph + k * 1.6) * 0.6 * sw * alive - sx * 0.5 * dead;
        g.rotation.x = Math.cos(ph + k * 1.6) * 0.3 * sw * alive;
      });
      inner.rotation.x = clamp(0.5 * rise, -0.45, 0.45) + 0.08 * hurt;
      inner.rotation.z = clamp(turn * 0.05, -0.25, 0.25) * alive + Math.sin(A.t * 11) * 0.1 * gW;
      inner.position.y = Math.sin(A.t * 1.2) * 0.05;
      head.rotation.x = 0.35 * atk * lunge;
      jaw.rotation.x = -0.05 - 0.03 * Math.sin(A.t * 0.9) - 0.8 * atk * Math.max(0.3, lunge) - 0.3 * hurt - 0.3 * dead;

  };
}

function flashAll(root, amount) {
  root.traverse((o) => {
    if (o.material && o.material.emissive) {
      const g = o.material.userData.glow || [0, 0, 0]; // element glow is kept under the red hurt flash
      o.material.emissive.setRGB(amount * 0.9 + g[0], amount * 0.1 + g[1], g[2]);
    }
  });
}

function createCharacter(kind, color) {
  const m = kind === 'trex' ? createTRex(color) : kind === 'tricera' ? createTricera(color) : kind === 'raptor' ? createRaptor(color)
    : kind === 'ptero' ? createPtero(color) : kind === 'mosa' ? createMosa(color) : kind === 'plesio' ? createPlesio(color) : createHuman(color);
  m.root.rotation.order = 'YXZ'; // heading first, then local tilt (so a fall tips over the character's own axis)
  m.flash = (amount) => flashAll(m.root, amount);
  m.fallTime = kind === 'human' ? 0.6 : kind === 'raptor' || kind === 'ptero' ? 0.8 : 1.25;
  // the fall happens inside its own group, so `root` keeps only the heading (and the ground position)
  const rig = new THREE.Group();
  m.root.children.slice().forEach((c) => {
    m.root.remove(c);
    rig.add(c);
  });
  m.root.add(rig);
  const K = kind === 'mosa' ? 1.45 : kind === 'plesio' ? 1.4 : 1; // the water dinosaurs are bigger
  rig.scale.setScalar(K);
  let G = 1; // growth: hatchlings are small and grow up
  m.setGrowth = (g) => { G = g; rig.scale.set(K * g, K * g * (1 - 0.14 * m.anim.lay), K * g); };
  const baseUpdate = m.update;
  m.update = (dt, st) => {
    baseUpdate(dt, st);
    rig.scale.set(K * G, K * G * (1 - 0.14 * m.anim.lay), K * G); // laying: the whole body squats a little
  };
  m.fall = (p) => {
    if (kind !== 'human') {
      // the heavy dinosaurs tip onto its side: it accelerates like a falling mass, then rebounds slightly
      const e = p < 0.85 ? (p / 0.85) * (p / 0.85) : 1 - 0.04 * Math.sin(((p - 0.85) / 0.15) * Math.PI);
      if (kind === 'mosa' || kind === 'plesio') { // sea creatures roll belly-up about the middle of the body and float
        const a = e * Math.PI * 0.95;
        rig.rotation.z = a;
        rig.position.set(1.05 * K * G * Math.sin(a), 1.05 * K * G * (1 - Math.cos(a)), 0);
        return;
      }
      const a = e * (Math.PI / 2);
      const x0 = kind === 'raptor' ? -0.4 : kind === 'ptero' ? -0.6 : kind === 'tricera' ? -1.15 : -1; // it turns about the edge of its body that meets the ground
      rig.rotation.z = a;
      rig.position.set(x0 * G * (1 - Math.cos(a)), -x0 * G * Math.sin(a), 0);
    } else {
      // humans topple quickly and ease out; the chest rests on the ground instead of sinking into it
      const e = 1 - (1 - p) * (1 - p) * (1 - p);
      rig.rotation.x = e * (Math.PI / 2);
      rig.position.y = 0.2 * e;
    }
  };
  return m;
}

// client/js/effects.js — fire breath particles (a small pool of additive-blended spheres).
// Purely visual: the damage comes from shared/combat.js (same cone: ~12 m long).


const COUNT = 110;
const LIFE = 0.8; // seconds
const SPEED = 15; // m/s  => ~12 m reach, matching COMBAT.trex.fireRange
const EMIT_RATE = 60; // particles per second
const MOUTH_FORWARD = 3.6; // metres in front of the T-Rex origin
const MOUTH_HEIGHT = 3.5;
const MOUTH = { trex: [3.6, 3.5], ptero: [2.2, 2.5], mosa: [5.2, 1.8], plesio: [5.9, 3.6] }; // [forward, height] of the mouth per animal

function createFireFx(scene) {
  const geo = new THREE.SphereGeometry(0.3, 6, 5);

      blending: THREE.AdditiveBlending,
    });
