    mesh.visible = false;
    scene.add(mesh);
    parts.push({ mesh, age: LIFE, vx: 0, vy: 0, vz: 0, kind: 'fire' });
  }
  let cursor = 0;

  function spawn(f, kind) {
    const p = parts[cursor];
    cursor = (cursor + 1) % COUNT;
    const fx = -Math.sin(f.heading);
    const fz = -Math.cos(f.heading);
    const wide = kind === 'water' ? 1.8 : 1; // the wave sprays wider
    const spread = 2.4 * wide; // sideways/vertical scatter in m/s
    const speed = kind === 'water' ? SPEED * 0.8 : SPEED;
    const [mf, mh] = MOUTH[f.kind] || [MOUTH_FORWARD, MOUTH_HEIGHT];
    p.kind = kind;
    p.age = 0;
    p.vx = fx * speed + (Math.random() - 0.5) * spread;
    p.vy = (Math.random() - 0.3) * spread * 0.6 + (kind === 'water' ? 2.5 : 0);
    p.vz = fz * speed + (Math.random() - 0.5) * spread;
    p.mesh.position.set(f.x + fx * mf, f.y + mh, f.z + fz * mf);
    p.mesh.visible = true;
  }

  return {
    // call every frame for a dinosaur that is burning (kind 'fire'), breathing frost ('ice') or surging a wave ('water')
    emit(f, dt, kind = 'fire') {
      f.fxAcc = (f.fxAcc || 0) + dt * EMIT_RATE;
      while (f.fxAcc >= 1) {
        f.fxAcc -= 1;
        spawn(f, kind);
      }
    },
    update(dt) {
      for (const p of parts) {
        if (p.age >= LIFE) {
          p.mesh.visible = false;
          continue;
        }
        p.age += dt;
        const t = Math.min(p.age / LIFE, 1);
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.scale.setScalar(0.6 + t * 2.2);
        p.mesh.material.opacity = 0.9 * (1 - t);
        if (p.kind === 'ice') {
          p.mesh.material.color.setHSL(0.52, 0.9, 0.85 - 0.3 * t); // white-cyan frost
          p.mesh.scale.setScalar(0.5 + t * 1.6);
        } else if (p.kind === 'water') {
          p.vy -= 9 * dt; // the spray falls back
          p.mesh.material.color.setHSL(0.58, 0.85, 0.62 - 0.2 * t);
          p.mesh.scale.setScalar(0.7 + t * 1.8);
        } else p.mesh.material.color.setHSL(0.12 * (1 - t), 1, 0.5); // yellow -> red
      }
    },
    dispose() {
      geo.dispose();
      for (const p of parts) {
        p.mesh.material.dispose();
        scene.remove(p.mesh);
      }
    },
  };
}

// ---- element skills: lightning bolts from the triceratops horn + the raptor's tornado (drawn straight from the fighter state) ----
function createSkillFx(scene) {
  const live = new Map();
  const N = 10;
  const boltMat = new THREE.LineBasicMaterial({ color: 0xfff27a, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
  const glowGeo = new THREE.SphereGeometry(0.35, 8, 6);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffe94d, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  const fillMat = new THREE.MeshBasicMaterial({ color: 0x14306b, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x6fa8ff, wireframe: true, transparent: true, opacity: 0.8, depthWrite: false });
  const geos = [glowGeo];
  function build() {
    const bolts = new THREE.Group();
    bolts.visible = false;
    const lines = [];
    for (let k = 0; k < 3; k++) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
      const l = new THREE.Line(g, boltMat);
      l.frustumCulled = false;
      bolts.add(l);
      lines.push(l);
      geos.push(g);
    }
    const glow = new THREE.Mesh(glowGeo, glowMat);
    bolts.add(glow);
    const tor = new THREE.Group();
    tor.visible = false;
    for (let i = 0; i < 5; i++) {
      const g = new THREE.CylinderGeometry(0.9 + i * 0.4, 0.5 + i * 0.4, 1.1, 8, 1, true);
      geos.push(g);
      const lvl = new THREE.Group();
      lvl.position.y = 0.55 + i * 1.1;
      lvl.add(new THREE.Mesh(g, fillMat), new THREE.Mesh(g, wireMat));
      tor.add(lvl);
    }
    scene.add(bolts, tor);
    return { bolts, lines, glow, tor };
  }
  return {
    update(list, dt) {
      for (const [f] of list) {
        let o = live.get(f);
        if (!o) {
          if (!f.zap && !f.tor) continue;
          o = build();
          live.set(f, o);
        }
        const zap = f.alive && f.zap;
        o.bolts.visible = zap;
        if (zap) {
          const fx = -Math.sin(f.heading);
          const fz = -Math.cos(f.heading);
          const rx = fz;
          const rz = -fx;
          const sx = f.x + fx * 3.2;
          const sy = f.y + 1.9;
          const sz = f.z + fz * 3.2;
          for (const l of o.lines) {
            const p = l.geometry.attributes.position;
            for (let i = 0; i < N; i++) {
              const s = i / (N - 1);
              const j = i === 0 ? 0 : (Math.random() - 0.5) * 2.2 * Math.sin(s * Math.PI * 0.9 + 0.3);
              p.setXYZ(i, sx + fx * s * 10 + rx * j, sy - s * 0.9 + (i === 0 ? 0 : (Math.random() - 0.5) * 1.4), sz + fz * s * 10 + rz * j);
            }
            p.needsUpdate = true;
          }
          o.glow.position.set(sx, sy, sz);
          o.glow.scale.setScalar(0.8 + Math.random() * 0.7);
        }
        const w = f.alive && f.tor;
        o.tor.visible = !!w;
        if (w) {
          o.tor.position.set(w.x, w.y, w.z);
          const k = Math.max(0.05, Math.min(1, w.t / 0.35, (1.8 - w.t) / 0.3));
          o.tor.scale.set(k, 1, k);
          o.tor.children.forEach((c, i) => { c.rotation.y += dt * (9 - i); });
        }
      }
    },
    dispose() {
      for (const o of live.values()) scene.remove(o.bolts, o.tor);
      geos.forEach((g) => g.dispose());
      [boltMat, glowMat, fillMat, wireMat].forEach((m) => m.dispose());
      live.clear();
    },
  };
}

// ===== client/js/world.js =====
// client/js/world.js — the Phase 1 island: terrain, sea, trees, rocks, sky and light.
// Everything is generated from shared/terrain.js, so the server will see the same ground.


const MESH_SIZE = WORLD_RADIUS * 2 + 40;
const SEGMENTS = 200; // 4 m cells

const BIOME_COLORS = {
  [BIOME.OCEAN]: 0x3d6b7a,
  [BIOME.BEACH]: 0xe0d29a,
  [BIOME.PLAINS]: 0x86b05a,
  [BIOME.FOREST]: 0x4d8a3a,
  [BIOME.ROCK]: 0x8a8a84,
  [BIOME.SNOW]: 0xf1f4f6,
  [BIOME.DESERT]: 0xd9b96a,
  [BIOME.VOLCANIC]: 0x3d3633,
};

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(MESH_SIZE, MESH_SIZE, SEGMENTS, SEGMENTS);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  const rock = new THREE.Color(0x77736a);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const h = pos.getY(i);
    const biome = biomeAt(x, z, h);
    let tint = 0.92 + 0.16 * (Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1);
    if (biome === BIOME.PLAINS || biome === BIOME.FOREST) tint *= 0.88 + 0.24 * fbm(x / 22, z / 22, 2); // patchy grass
    c.setHex(BIOME_COLORS[biome]);
    if (biome === BIOME.BEACH && h < 0.9) c.multiplyScalar(0.8); // wet sand near the water
    if (biome !== BIOME.SNOW && biome !== BIOME.VOLCANIC) c.lerp(rock, smoothstep(0.16, 0.4, 1 - nrm.getY(i))); // steep slopes show bare rock
    if (h < 0) c.multiplyScalar(clamp(1 + h / 22, 0.4, 1)); // the sea floor gets darker with depth
    colors[i * 3] = c.r * tint;
    colors[i * 3 + 1] = c.g * tint;
    colors[i * 3 + 2] = c.b * tint;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  mesh.receiveShadow = true;
  return mesh;
}

function scatter(rng, maxCount, attempts, accept) {
  const pts = [];
  for (let i = 0; i < attempts && pts.length < maxCount; i++) {
    const a = rng() * Math.PI * 2;
    const r = Math.sqrt(rng()) * WORLD_RADIUS * 0.95;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const h = heightAt(x, z);
    if (accept(x, z, h)) pts.push({ x, y: h, z });
  }
  return pts;
}

// ---- smooth, vertex-coloured props: each type is ONE merged geometry = one draw call ----
// (THREE is loaded lazily, so none of this may run at module load time)
function mergeColored(parts) {
  const pos = [];
  const nor = [];
  const col = [];
  const c = new THREE.Color();
  parts.forEach(([g, hex]) => {
    const n = g.index ? g.toNonIndexed() : g;
    const p = n.attributes.position.array;
    c.setHex(hex);
    pos.push(...p);
    nor.push(...n.attributes.normal.array);
    for (let i = 0; i < p.length; i += 3) col.push(c.r, c.g, c.b);
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}

function tube(a, b, ra, rb, seg) {
  const pa = new THREE.Vector3(a[0], a[1], a[2]);
  const pb = new THREE.Vector3(b[0], b[1], b[2]);
  const d = pb.clone().sub(pa);
  const g = new THREE.CylinderGeometry(rb, ra, d.length(), seg, 1, true);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
  const m = pa.clone().add(pb).multiplyScalar(0.5);
  g.translate(m.x, m.y, m.z);
  return g;
}

function pineGeo() {
  const cone = (r, h, y) => new THREE.ConeGeometry(r, h, 7, 1, true).translate(0, y, 0);
  return mergeColored([
    [tube([0, 0, 0], [0, 3, 0], 0.38, 0.22, 6), 0x6b4a2b],
    [cone(2.1, 2.8, 3.4), 0x2f6b34],
    [cone(1.6, 2.5, 4.9), 0x38793b],
    [cone(1.0, 2.2, 6.3), 0x428a42],
  ]);
}

function roundGeo() {
  const blob = (r, x, y, z) => new THREE.SphereGeometry(r, 7, 5).translate(x, y, z);
  return mergeColored([
    [tube([0, 0, 0], [0, 3.2, 0], 0.34, 0.22, 6), 0x6b4a2b],
    [blob(1.5, 0, 4.3, 0), 0x5c9a3a],
    [blob(1.1, 1.0, 3.8, 0.3), 0x66a63f],
    [blob(1.0, -0.9, 3.9, -0.4), 0x549134],
  ]);
}

function palmGeo() {
  const top = [0.9, 5.2, 0];
  const parts = [
    [tube([0, 0, 0], [0.25, 1.8, 0], 0.3, 0.24, 6), 0x8a6a45],
    [tube([0.25, 1.8, 0], [0.65, 3.6, 0], 0.24, 0.2, 6), 0x7d5f3d],
    [tube([0.65, 3.6, 0], top, 0.2, 0.16, 6), 0x8a6a45],
    [new THREE.SphereGeometry(0.22, 6, 4).translate(top[0] + 0.2, top[1] - 0.25, top[2]), 0x4a3220], // coconut
  ];
  for (let i = 0; i < 7; i++) { // fronds: flat blades fanning out from the crown
    const g = new THREE.ConeGeometry(0.42, 2.8, 4, 1, true).translate(0, 1.4, 0).scale(0.25, 1, 1);
    g.rotateZ(-1.6);
    g.rotateY((i / 7) * Math.PI * 2);
    g.translate(top[0], top[1], top[2]);
    parts.push([g, i % 2 ? 0x4f9a3a : 0x5fae42]);
  }
  return mergeColored(parts);
}

function rockGeo() {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) { // lumpy shape; same position => same offset, so no cracks
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const k = 0.82 + 0.3 * hash2(Math.round(x * 10), Math.round(y * 10) * 31 + Math.round(z * 10));
    pos.setXYZ(i, x * k, y * k * 0.9, z * k);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  const col = new Float32Array(pos.count * 3);
  const gray = new THREE.Color(0x8a8883);
  const moss = new THREE.Color(0x5f7f45);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { // moss on the upward-facing sides
    c.copy(gray).lerp(moss, smoothstep(0.5, 0.85, nrm.getY(i)) * 0.8);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

// wind: sways the upper part of each instance (GPU only, no per-frame JS cost)
function addWind(mat, windU, amp) {
  mat.customProgramCacheKey = () => 'wind';
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = windU;
    sh.uniforms.uAmp = { value: amp };
    sh.vertexShader = 'uniform float uTime;\nuniform float uAmp;\n' + sh.vertexShader.replace('#include <begin_vertex>', [
      'vec3 transformed = vec3( position );',
      '#ifdef USE_INSTANCING',
      'float wph = instanceMatrix[3][0] * 0.13 + instanceMatrix[3][2] * 0.09;',
      '#else',
      'float wph = 0.0;',
      '#endif',
      'float wsw = (sin(uTime * 1.5 + wph) + 0.5 * sin(uTime * 2.7 + wph * 1.7)) * uAmp * max(position.y, 0.0);',
      'transformed.x += wsw;',
      'transformed.z += wsw * 0.6;',
    ].join('\n'));
  };
}

function buildTrees(rng, castShadow, obs, windU, detail) {
  const pts = scatter(rng, Math.round(1400 * (0.5 + 0.5 * detail)), 9000, (x, z, h) => {
    if (h < 2.5) return false;
    const b = biomeAt(x, z, h);
    return b === BIOME.FOREST || (b === BIOME.PLAINS && rng() < 0.06);
  });
  const palms = scatter(rng, Math.round(110 * detail), 3000, (x, z, h) => h > 1.1 && h < 3.2 && rng() < 0.2);
  const groups = [[], [], palms]; // pines, broadleaf trees, beach palms
  pts.forEach((p) => groups[biomeAt(p.x, p.z, p.y) === BIOME.FOREST && rng() < 0.7 ? 0 : 1].push(p));
  const geos = [pineGeo(), roundGeo(), palmGeo()];
  const tops = [7, 6, 5.5];
  const radii = [0.4, 0.34, 0.3];
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  const meshes = [];
  groups.forEach((list, k) => {
    if (!list.length) return;
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
    addWind(mat, windU, k === 2 ? 0.05 : 0.028);
    const mesh = new THREE.InstancedMesh(geos[k], mat, list.length);
    list.forEach((p, i) => {
      const s = 0.8 + rng() * 0.9;
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.y = rng() * Math.PI * 2;
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      const v = 0.82 + rng() * 0.18; // slight brightness variation (real colours live in the vertices)
      col.setRGB(v, v, v);
      mesh.setColorAt(i, col);
      obs.push({ x: p.x, z: p.z, r: radii[k] * s, top: p.y + tops[k] * s, tree: true });
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = castShadow;
    mesh.frustumCulled = false;
    meshes.push(mesh);
  });
  return meshes;
}

// ---- rocks you can stand on ----
// Every rock is the same lumpy mesh (only its turn about the vertical axis and its size differ), so the height of its top surface is measured ONCE from the
// real mesh into a small grid over the local (x, z); each rock then answers "how high is my surface at world (x, z)" by un-turning and un-scaling the point.
const ROCK_GRID = 41;
const ROCK_EXTENT = 1.25; // the grid covers local x, z in [-1.25, 1.25] (the mesh is at most ~1.12 wide)
let ROCK_PROFILE = null;

// positions: flat [x, y, z, ...] list of triangles (3 vertices each). Returns the highest y of the mesh over every grid point (-Infinity where the mesh is not).
function makeRockProfile(positions) {
  const N = ROCK_GRID;
  const cell = (2 * ROCK_EXTENT) / (N - 1);
  const h = new Float32Array(N * N).fill(-Infinity);
  const idx = (v) => clamp(Math.floor((v + ROCK_EXTENT) / cell), 0, N - 1);
  for (let t = 0; t + 8 < positions.length; t += 9) {
    const ax = positions[t], ay = positions[t + 1], az = positions[t + 2];
    const bx = positions[t + 3], by = positions[t + 4], bz = positions[t + 5];
    const cx = positions[t + 6], cy = positions[t + 7], cz = positions[t + 8];
    const det = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
    if (Math.abs(det) < 1e-9) continue; // a vertical sliver: it has no top
    const i0 = idx(Math.min(ax, bx, cx));
    const i1 = Math.min(N - 1, idx(Math.max(ax, bx, cx)) + 1);
    const j0 = idx(Math.min(az, bz, cz));
    const j1 = Math.min(N - 1, idx(Math.max(az, bz, cz)) + 1);
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        const x = -ROCK_EXTENT + i * cell;
        const z = -ROCK_EXTENT + j * cell;
        const l1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / det;
        const l2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / det;
        const l3 = 1 - l1 - l2;
        if (l1 < -1e-6 || l2 < -1e-6 || l3 < -1e-6) continue;
        const y = l1 * ay + l2 * by + l3 * cy;
        if (y > h[i * N + j]) h[i * N + j] = y;
      }
    }
  }
  return { h, cell };
}

// height of the mesh's top at local (lx, lz), or null outside the rock (bilinear between the grid points that the mesh covers)
function sampleRockProfile(p, lx, lz) {
  const N = ROCK_GRID;
  const gx = (lx + ROCK_EXTENT) / p.cell;
  const gz = (lz + ROCK_EXTENT) / p.cell;
  if (gx < 0 || gz < 0 || gx > N - 1 || gz > N - 1) return null;
  const i = Math.min(Math.floor(gx), N - 2);
  const j = Math.min(Math.floor(gz), N - 2);
  const fx = gx - i;
  const fz = gz - j;
  let w = 0;
  let sum = 0;
  for (let a = 0; a < 2; a++) {
    for (let b = 0; b < 2; b++) {
      const v = p.h[(i + a) * N + (j + b)];
      if (v === -Infinity) continue;
      const k = (a ? fx : 1 - fx) * (b ? fz : 1 - fz);
      w += k;
      sum += k * v;
    }
  }
  return w >= 0.5 ? sum / w : null;
}

// rocks: [{ x, z, r, rock: { sx, sy, sz, c, s, y0 } }] (c, s = cos / sin of the turn; y0 = height of the rock's centre).
// A rock is a bump to walk over, as long as the feet can step onto it; where it rises more than `step` above the feet it is a wall.
function createRockSurface(rocks, profile) {
  const CELL = 12;
  const cells = new Map();
  for (const o of rocks) {
    const k = Math.floor(o.x / CELL) * 4096 + Math.floor(o.z / CELL);
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push(o);
  }
  const topAt = (o, x, z) => {
    const r = o.rock;
    const dx = x - o.x;
    const dz = z - o.z;
    if (dx * dx + dz * dz > o.r * o.r) return null;
    const h = sampleRockProfile(profile, (dx * r.c - dz * r.s) / r.sx, (dx * r.s + dz * r.c) / r.sz);
    return h === null ? null : r.y0 + h * r.sy;
  };
  // calls fn(rock, surfaceHeight) for every rock whose surface exists at (x, z); stops and returns what fn returns as soon as it is truthy
  const each = (x, z, fn) => {
    const cx = Math.floor(x / CELL);
    const cz = Math.floor(z / CELL);
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        const list = cells.get((cx + i) * 4096 + (cz + j));
        if (!list) continue;
        for (const o of list) {
          const h = topAt(o, x, z);
          if (h === null) continue;
          const res = fn(o, h);
          if (res) return res;
        }
      }
    }
    return null;
  };
  // the rock that is a wall for feet at height y standing at (x, z), or null
  const wall = (x, z, y, step) => each(x, z, (o, h) => (h > y + step ? o : null));
  return {
    // the highest rock surface at (x, z) that feet at height y can stand on (not more than `step` above them), or null
    support(x, z, y, step) {
      let best = null;
      each(x, z, (o, h) => {
        if (h <= y + step && (best === null || h > best)) best = h;
        return null;
      });
      return best;
    },
    // keeps a fighter (or a probe: just {x, z, y}) out of rock walls: it slides along the wall, or is pushed out if it already stands inside one
    collide(f, step) {
      if (!wall(f.x, f.z, f.y, step)) return;
      if (typeof f.px === 'number') {
        const py = typeof f.py === 'number' ? f.py : f.y;
        const x = f.x;
        const z = f.z;
        if (!wall(f.px, f.pz, py, step)) {
          if (!wall(f.px, z, f.y, step)) {
            f.x = f.px; // blocked along x only: keep sliding along z
            f.vx = 0;
          } else if (!wall(x, f.pz, f.y, step)) {
            f.z = f.pz; // blocked along z only: keep sliding along x
            f.vz = 0;
          } else {
            f.x = f.px;
            f.z = f.pz;
            f.vx = 0;
            f.vz = 0;
          }
          return;
        }
      }
      for (let k = 0; k < 40; k++) { // already inside (spawned there, or shoved by another fighter): walk out, away from the rock's centre
        const o = wall(f.x, f.z, f.y, step);
        if (!o) return;
        let dx = f.x - o.x;
        let dz = f.z - o.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d > 1e-6) {
          dx /= d;
          dz /= d;
        } else {
          dx = 1;
          dz = 0;
        }
        f.x += dx * 0.25;
        f.z += dz * 0.25;
      }
    },
  };
}

function buildRocks(rng, castShadow, obs) {
  const pts = scatter(rng, 260, 4000, (x, z, h) => h > 1.5 && rng() < 0.12);
  const geo = rockGeo();
  ROCK_PROFILE = makeRockProfile((geo.index ? geo.toNonIndexed() : geo).attributes.position.array);
  const rocks = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), pts.length);
  const dummy = new THREE.Object3D();
  pts.forEach((p, i) => {
    dummy.position.set(p.x, p.y + 0.2, p.z);
    rng(); // the old random tumble used three random numbers; rocks now only turn about the vertical axis (so their top can be walked on)
    const yaw = rng() * Math.PI * 2; // ... and the three numbers are still drawn, so the trees and grass that follow keep their places
    rng();
    dummy.rotation.set(0, yaw, 0);
    const sx = 0.6 + rng() * 1.6;
    const sy = 0.5 + rng() * 1.0;
    const sz = 0.6 + rng() * 1.6;
    dummy.scale.set(sx, sy, sz);
    obs.push({ x: p.x, z: p.z, r: Math.max(sx, sz) * 1.25, rock: { sx, sy, sz, c: Math.cos(yaw), s: Math.sin(yaw), y0: p.y + 0.2 } });
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  });
  rocks.instanceMatrix.needsUpdate = true;
  rocks.castShadow = castShadow;
  rocks.frustumCulled = false;
  return rocks;
}

// grass tufts that ripple in the wind
function buildGrass(rng, windU, detail) {
  const pts = scatter(rng, Math.round(2200 * detail), 6000, (x, z, h) => {
    if (h < 2.5) return false;
    const b = biomeAt(x, z, h);
    return b === BIOME.PLAINS || b === BIOME.FOREST;
  });
  const blade = (rot) => new THREE.ConeGeometry(0.16, 0.9, 3, 1, true).translate(0, 0.45, 0).rotateZ(0.25).rotateY(rot);
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  addWind(mat, windU, 0.2);
  const mesh = new THREE.InstancedMesh(mergeColored([[blade(0), 0x6fae45], [blade(2.1), 0x7fbf4c], [blade(4.2), 0x5e9a3a]]), mat, Math.max(1, pts.length));
  mesh.count = pts.length;
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  pts.forEach((p, i) => {
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.y = rng() * Math.PI * 2;
    dummy.scale.setScalar(0.7 + rng() * 0.8);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    const v = 0.75 + rng() * 0.25;
    col.setRGB(v, v, v);
    mesh.setColorAt(i, col);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  return mesh;
}

// ---- food: fresh, lush grass tufts the enemy can eat; they shrink while eaten and sprout back later ----
function tuftGeo() {
  const parts = [];
  const greens = [0x7fd04a, 0x69bf3c, 0x8edc55, 0x5aae35];
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * Math.PI * 2 + (i % 2) * 0.4;
    const r = 0.1 + (i % 3) * 0.1;
    const h = 0.8 + (i % 4) * 0.16;
    const blade = new THREE.ConeGeometry(0.13, h, 3, 1, true).translate(0, h / 2, 0).rotateZ(0.18 + (i % 3) * 0.08).rotateY(a);
    blade.translate(Math.cos(a) * r, 0, Math.sin(a) * r);
    parts.push([blade, greens[i % 4]]);
  }
  [[0.18, 0.95, 0.1], [-0.2, 0.85, -0.05], [0.02, 1.0, -0.22]].forEach(([x, y, z]) => {
    parts.push([new THREE.SphereGeometry(0.08, 6, 4).translate(x, y, z), 0xffe36a]); // little flowers: it reads as food
  });
  return mergeColored(parts);
}

function createFoodVisuals(scene, items) {
  const geo = tuftGeo();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const meshes = items.map((it) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(it.x, it.y - 0.03, it.z);
    m.rotation.y = it.id * 2.3;
    scene.add(m);
    return m;
  });
  return {
    update(time) {
      items.forEach((it, i) => {
        const m = meshes[i];
        const a = it.amount;
        m.visible = a > 0.02;
        if (!m.visible) return;
        if (it.state === 'eating') {
          const bite = 1 + 0.06 * Math.sin(time * 30); // shakes as it is bitten
          m.scale.set((0.55 + 0.45 * a) * bite, a, (0.55 + 0.45 * a) * bite);
        } else {
          const k = it.state === 'regrow' ? 1 - Math.pow(1 - a, 3) : 1; // sprouts back with a little overshoot-free ease
          m.scale.setScalar(Math.max(0.01, k));
          m.rotation.z = Math.sin(time * 1.6 + it.id) * 0.03; // sways in the breeze
        }
      });
    },
  };
}

function foodSpotFree(world, x, z) {
  for (const [ox, oz] of [[0, 0], [1.4, 0], [-1.4, 0], [0, 1.4], [0, -1.4]]) {
    const px = x + ox;
    const pz = z + oz;
    const probe = { x: px, z: pz, y: heightAt(px, pz), kind: 'human' };
    world.collide(probe); // pushed out => a tree or rock is there
    if (Math.abs(probe.x - px) > 1e-4 || Math.abs(probe.z - pz) > 1e-4) return false;
  }
  return true;
}

// ---- sea floor, desert and volcano props ----
function kelpGeo() {

  [[0, 0, 0x2f7d46], [0.32, 0.1, 0x3f9a4e], [-0.28, -0.12, 0x2a6f3c]].forEach(([x, z, hex], i) => {

// ---- coral reef: realistic colonies instead of coloured blobs ----
// Every colony is one merged geometry with natural colours that fade from a dull base to paler growing tips; branching corals are built from real
// branches that fork, brain coral has the winding ridges, table coral is a flat plate on a stem, sea fans are a lattice, tube sponges have hollow tops,
// anemones have a ring of soft tentacles. (Colours and shapes are fixed per type; each placed colony is rotated, scaled and tinted a little.)
function coralMerge(parts, height, seed) {
  const rng = mulberry32(seed);
  const pos = [];
  const nor = [];
  const col = [];
  const cb = new THREE.Color();
  const ct = new THREE.Color();
  const c = new THREE.Color();
  parts.forEach(([g, base, tip, fn]) => {
    if (g.index) g.computeVertexNormals(); // smooth shading across shared vertices
    const n = g.index ? g.toNonIndexed() : g;
    const p = n.attributes.position.array;
    const nn = n.attributes.normal.array;
    cb.setHex(base);
    ct.setHex(tip);
    for (let i = 0; i < p.length; i += 9) {
      const jitter = 0.9 + 0.2 * rng(); // each triangle is a touch lighter or darker: a mottled, living surface
      for (let k = 0; k < 9; k += 3) {
        pos.push(p[i + k], p[i + k + 1], p[i + k + 2]);
        nor.push(nn[i + k], nn[i + k + 1], nn[i + k + 2]);
        const t = clamp(p[i + k + 1] / height, 0, 1) ** 1.3;
        c.copy(cb).lerp(ct, t).multiplyScalar(jitter * (fn ? fn(p[i + k], p[i + k + 1], p[i + k + 2]) : 1));
        col.push(c.r, c.g, c.b);
      }
    }
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}

const _cv = (x, y, z) => new THREE.Vector3(x, y, z);
// a branch that forks: staghorn / elkhorn coral
function coralBranch(parts, rng, p, dir, len, r, depth, base, tip) {
  const e = [p[0] + dir.x * len, p[1] + dir.y * len, p[2] + dir.z * len];
  parts.push([tube(p, e, r, r * 0.74, 5), base, tip]);
  parts.push([new THREE.SphereGeometry(r * 0.74, 5, 4).translate(e[0], e[1], e[2]), base, tip]); // rounded tip
  if (depth <= 0) return;
  const kids = depth > 1 && rng() < 0.45 ? 3 : 2;
  for (let k = 0; k < kids; k++) {
    const nd = _cv(dir.x + (rng() - 0.5) * 1.1, Math.max(0.25, dir.y * 0.8 + 0.25), dir.z + (rng() - 0.5) * 1.1).normalize();
    coralBranch(parts, rng, e, nd, len * (0.66 + 0.1 * rng()), r * 0.72, depth - 1, base, tip);
  }
}
function staghornGeo(base, tip, seed) {
  const rng = mulberry32(seed);
  const parts = [];
  const mains = 4 + Math.floor(rng() * 2);
  for (let i = 0; i < mains; i++) {
    const a = (i / mains) * Math.PI * 2 + rng() * 0.6;
    coralBranch(parts, rng, [0, 0, 0], _cv(Math.cos(a) * 0.55, 0.9, Math.sin(a) * 0.55).normalize(), 0.42, 0.075, 3, base, tip);
  }
  parts.push([new THREE.SphereGeometry(0.16, 6, 4).scale(1, 0.6, 1), base, base]); // the common base
  return coralMerge(parts, 1.5, seed);
}
function brainGeo(base, tip, seed) {
  const g = new THREE.SphereGeometry(0.62, 30, 18, 0, Math.PI * 2, 0, Math.PI / 2).scale(1, 0.72, 1);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  const ridge = (x, z) => Math.sin(x * 21 + Math.sin(z * 15) * 2.3) * Math.sin(z * 19 + Math.sin(x * 13) * 2.1); // winding grooves
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i), p.getY(i), p.getZ(i));
    const d = v.clone().normalize().multiplyScalar(0.03 * ridge(v.x, v.z));
    p.setXYZ(i, v.x + d.x, v.y + d.y, v.z + d.z);
  }
  return coralMerge([[g, base, tip, (x, y, z) => 0.78 + 0.27 * (ridge(x, z) * 0.5 + 0.5)]], 0.5, seed); // the grooves are darker
}
function tableGeo(base, tip, seed) {
  const rng = mulberry32(seed);
  const plate = new THREE.CylinderGeometry(1.0, 0.82, 0.09, 18, 1);
  const pp = plate.attributes.position;
  for (let i = 0; i < pp.count; i++) { // an uneven, slightly wavy plate
    const x = pp.getX(i);
    const z = pp.getZ(i);
    const r = Math.hypot(x, z);
    const w = 1 + 0.07 * Math.sin(Math.atan2(z, x) * 5 + seed);
    pp.setXYZ(i, x * w, pp.getY(i) + 0.05 * Math.sin(r * 5 + seed), z * w);
  }
  plate.translate(0, 0.62, 0).rotateZ(0.08);
  const rim = new THREE.TorusGeometry(0.9, 0.045, 5, 22).rotateX(Math.PI / 2).translate(0, 0.66, 0);
  return coralMerge([
    [tube([0, 0, 0], [0.04, 0.6, 0], 0.17, 0.1, 6), base, base],
    [plate, base, tip],
    [rim, tip, tip],
  ], 0.75, seed);
}
function seaFanGeo(base, tip, seed) {
  const parts = [[tube([0, 0, 0], [0, 0.32, 0], 0.045, 0.03, 5), base, base]];
  const L = 1.0;
  const rings = [0.38, 0.62, 0.86];
  for (let a = -0.95; a <= 0.951; a += 0.158) {
    parts.push([tube([0, 0.32, 0], [Math.sin(a) * L, 0.32 + Math.cos(a) * L, 0], 0.016, 0.008, 4), base, tip]);
  }
  rings.forEach((rr) => {
    for (let a = -0.95; a < 0.94; a += 0.158) {
      parts.push([tube([Math.sin(a) * L * rr, 0.32 + Math.cos(a) * L * rr, 0], [Math.sin(a + 0.158) * L * rr, 0.32 + Math.cos(a + 0.158) * L * rr, 0], 0.01, 0.01, 3), tip, tip]);
    }
  });
  return coralMerge(parts, 1.3, seed);
}
function pipeGeo(base, tip, seed) {
  const rng = mulberry32(seed);
  const parts = [];
  for (let i = 0; i < 7; i++) {
    const a = rng() * Math.PI * 2;
    const rr = 0.05 + rng() * 0.28;
    const h = 0.45 + rng() * 0.7;
    const x = Math.cos(a) * rr;
    const z = Math.sin(a) * rr;
    parts.push([new THREE.CylinderGeometry(0.09 + rng() * 0.04, 0.13, h, 8, 1, true).translate(x, h / 2, z), base, tip]);
    parts.push([new THREE.CircleGeometry(0.085, 8).rotateX(-Math.PI / 2).translate(x, h - 0.04, z), 0x3a1d24, 0x3a1d24]); // the dark hollow
  }
  return coralMerge(parts, 1.1, seed);
}
function anemoneGeo(base, tip, seed) {
  const rng = mulberry32(seed);
  const parts = [[new THREE.CylinderGeometry(0.2, 0.24, 0.16, 10), 0xb89472, 0xb89472]];
  for (let i = 0; i < 34; i++) {
    const a = (i / 34) * Math.PI * 2 + rng() * 0.2;
    const rr = 0.05 + rng() * 0.15;
    const h = 0.32 + rng() * 0.2;
    const lean = 0.35 + rng() * 0.5;
    const g = new THREE.ConeGeometry(0.02, h, 4).translate(0, h / 2, 0).rotateZ(-lean * Math.cos(a)).rotateX(lean * Math.sin(a)).translate(Math.cos(a) * rr, 0.14, Math.sin(a) * rr);
    parts.push([g, base, tip]);
  }
  return coralMerge(parts, 0.65, seed);
}
// the colony types (colour pairs: dull base -> pale growing tip)
function coralTypes() {
  return [
    { w: 0.17, geo: staghornGeo(0xb08a62, 0xf1dcb8, 11), sway: false },
    { w: 0.10, geo: staghornGeo(0x8c5f9a, 0xdcb9ea, 12), sway: false },

    { w: 0.07, geo: staghornGeo(0xd9843f, 0xf7d19a, 14), sway: false },
    { w: 0.13, geo: brainGeo(0x8a7a3e, 0xc9b673, 21), sway: false },
    { w: 0.05, geo: brainGeo(0x6e7d4a, 0xaebd7d, 22), sway: false },
    { w: 0.12, geo: tableGeo(0x9b7a53, 0xdcc08f, 31), sway: false },
    { w: 0.06, geo: seaFanGeo(0x8f3d63, 0xd96d90, 41), sway: true },
    { w: 0.04, geo: seaFanGeo(0xb89a2c, 0xf0d870, 42), sway: true },
    { w: 0.08, geo: pipeGeo(0x9c4558, 0xd98494, 51), sway: false },
    { w: 0.10, geo: anemoneGeo(0xd88aa0, 0xfff0f2, 61), sway: true },
  ];
}

function cactusGeo() {
  const g = 0x4f8a3a;
  return mergeColored([
    [tube([0, 0, 0], [0, 2.4, 0], 0.28, 0.24, 7), g],
    [new THREE.SphereGeometry(0.24, 7, 4).translate(0, 2.4, 0), g],
    [tube([0, 1.2, 0], [0.7, 1.3, 0], 0.16, 0.15, 6), g],
    [tube([0.7, 1.3, 0], [0.7, 2.1, 0], 0.15, 0.12, 6), g],

// a small reef fish ~0.75 m long, nose towards -z: a streamlined silver body that is darker on the back and pale underneath, a forked tail,
// a dorsal fin, pectoral fins and an eye. The colour of each school is a tint (instance colour) over these silver tones.
function fishGeo() {
  const E = (sx, sy, sz, x, y, z) => new THREE.SphereGeometry(1, 9, 6).scale(sx, sy, sz).translate(x, y, z);
  const fin = (r, h, sx, x, y, z, rx = 0, rz = 0) => new THREE.ConeGeometry(r, h, 4).scale(sx, 1, 1).rotateX(rx).rotateZ(rz).translate(x, y, z); // thin first, then turned into place
  return mergeColored([
    [E(0.1, 0.13, 0.33, 0, 0.035, 0), 0x6f8ea6], // back (darker)
    [E(0.095, 0.09, 0.31, 0, -0.045, 0.01), 0xe6edf2], // belly (pale)
    [E(0.06, 0.07, 0.16, 0, 0, 0.3), 0x7f9bb0], // tail stalk
    [fin(0.15, 0.2, 0.1, 0, 0.0, 0.5, -Math.PI / 2), 0x4f6f88], // tail fin
    [fin(0.17, 0.2, 0.1, 0, 0.0, 0.5, -Math.PI / 2).rotateZ(0).scale(1, 0.55, 1), 0x587a93],
    [fin(0.06, 0.2, 0.1, 0, 0.19, -0.02), 0x4f6f88], // dorsal fin
    [fin(0.045, 0.14, 0.1, 0, 0.17, 0.2), 0x4f6f88], // second dorsal
    [fin(0.04, 0.14, 0.1, 0, -0.14, 0.2, 0, Math.PI), 0x6b8aa1], // anal fin
    [fin(0.04, 0.16, 0.1, 0.1, -0.05, -0.08, 0, -Math.PI / 2 - 0.5), 0x6b8aa1], // pectoral fins
    [fin(0.04, 0.16, 0.1, -0.1, -0.05, -0.08, 0, Math.PI / 2 + 0.5), 0x6b8aa1],
    [E(0.022, 0.022, 0.022, 0.085, 0.045, -0.2), 0x101820], // eyes
    [E(0.022, 0.022, 0.022, -0.085, 0.045, -0.2), 0x101820],
  ]);
}

// instanced props placed with an accept function (positions only, one draw call each)
function placeInstanced(geo, mat, pts, rng, scaleMin, scaleMax, yOffset = 0) {
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, pts.length));
  mesh.count = pts.length;
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  pts.forEach((p, i) => {
    dummy.position.set(p.x, p.y + yOffset, p.z);
    dummy.rotation.y = rng() * Math.PI * 2;
    dummy.scale.setScalar(scaleMin + rng() * (scaleMax - scaleMin));
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    const v = 0.8 + rng() * 0.2;
    col.setRGB(v, v, v);
    mesh.setColorAt(i, col);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  return mesh;
}

function createWorld(scene, quality, renderer) {
  const detail = quality.detail || 1;
  const windU = { value: 0 }; // shared clock for the wind and water shaders
  const sky = new THREE.Color(0x9ad0f0);
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, 120, 520);

  const hemi = new THREE.HemisphereLight(0xbfdcff, 0x4a5a3a, 1.2);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
  sun.castShadow = quality.shadows;
  if (quality.shadows) {
    sun.shadow.mapSize.set(quality.shadowMap, quality.shadowMap);
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
  }
  scene.add(sun);
  scene.add(sun.target);

  scene.add(buildTerrain());

  // water: moving glints and ripples drawn in the shader
  const waterMat = new THREE.MeshLambertMaterial({ color: 0x2a7fb8, transparent: true, opacity: 0.72, side: THREE.DoubleSide }); // double sided: seen from below it is the surface above the diver
  waterMat.customProgramCacheKey = () => 'water';
  waterMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = windU;
    sh.vertexShader = 'varying vec2 vWp;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      'vec3 transformed = vec3( position );\nvWp = ( modelMatrix * vec4( position, 1.0 ) ).xz;');
    sh.fragmentShader = 'uniform float uTime;\nvarying vec2 vWp;\n' + sh.fragmentShader.replace('#include <dithering_fragment>', [
      'float w = sin(vWp.x * 0.9 + uTime * 1.4) * sin(vWp.y * 0.8 - uTime * 1.1) + 0.6 * sin((vWp.x + vWp.y) * 0.5 + uTime * 0.8);',
      'gl_FragColor.rgb += vec3(0.05, 0.08, 0.1) * smoothstep(0.7, 1.4, w);',
      '#include <dithering_fragment>',
    ].join('\n'));
  };
  const water = new THREE.Mesh(new THREE.PlaneGeometry(MESH_SIZE * 4, MESH_SIZE * 4), waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = SEA_LEVEL;
  scene.add(water);

  const deep = new THREE.Mesh(
    new THREE.PlaneGeometry(MESH_SIZE * 4, MESH_SIZE * 4),
    new THREE.MeshLambertMaterial({ color: 0x14394f }),
  );
  deep.rotation.x = -Math.PI / 2;
  deep.position.y = -30;
  scene.add(deep);

  // sky dome (gradient), sun disc and drifting clouds; the group follows the player so they stay far away
  const skyGroup = new THREE.Group();
  const dome = new THREE.SphereGeometry(1000, 16, 10);
  const dp = dome.attributes.position;
  const dcol = new Float32Array(dp.count * 3);
  const zenith = new THREE.Color(0x4a90d9);
  const dc = new THREE.Color();
  for (let i = 0; i < dp.count; i++) {
    dc.copy(sky).lerp(zenith, clamp(dp.getY(i) / 700, 0, 1)); // horizon matches the fog colour
    dcol[i * 3] = dc.r;
    dcol[i * 3 + 1] = dc.g;
    dcol[i * 3 + 2] = dc.b;
  }
  dome.setAttribute('color', new THREE.BufferAttribute(dcol, 3));
  const domeMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }); // its colour tints the whole sky (day / dusk / night / storm)
  const domeMesh = new THREE.Mesh(dome, domeMat);
  domeMesh.renderOrder = -2;
  domeMesh.frustumCulled = false;
  skyGroup.add(domeMesh);
  const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(32, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff6d0, fog: false }));
  sunDisc.add(new THREE.Mesh(new THREE.SphereGeometry(62, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff1c0, transparent: true, opacity: 0.22, fog: false, depthWrite: false })));
  skyGroup.add(sunDisc);
  const puff = (r, x, y, z) => new THREE.SphereGeometry(r, 7, 5).scale(1, 0.5, 1).translate(x, y, z);
  const cloudGeo = mergeColored([[puff(26, 0, 0, 0), 0xffffff], [puff(20, 28, -3, 6), 0xf4f8fc], [puff(22, -30, -2, -4), 0xf4f8fc], [puff(16, 10, 6, -14), 0xffffff]]);
  const cloudMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.92, fog: false, depthWrite: false });
  const clouds = [];
  const crng = mulberry32(WORLD_SEED + 7);
  for (let i = 0; i < Math.round(6 + 6 * detail); i++) {
    const cloud = new THREE.Mesh(cloudGeo, cloudMat);
    cloud.userData = { x0: (crng() - 0.5) * 1400, speed: 3 + crng() * 4 };
    cloud.position.set(0, 130 + crng() * 90, (crng() - 0.5) * 1200);
    cloud.scale.setScalar(0.8 + crng() * 1.2);
    cloud.frustumCulled = false;
    skyGroup.add(cloud);
    clouds.push(cloud);
  }
  const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(22, 12, 8), new THREE.MeshBasicMaterial({ color: 0xdfe8ff, fog: false }));
  skyGroup.add(moonDisc);
  const starPos = new Float32Array(420 * 3);
  const srng = mulberry32(WORLD_SEED + 99);
  for (let i = 0; i < 420; i++) {
    const a = srng() * Math.PI * 2;
    const e = Math.asin(0.05 + srng() * 0.95);
    starPos.set([Math.cos(a) * Math.cos(e) * 950, Math.sin(e) * 950, Math.sin(a) * Math.cos(e) * 950], i * 3);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  skyGroup.add(stars);
  scene.add(skyGroup);

  // HDR-style environment: the sky gradient and a bright sun are baked once into a reflection map that lights the PBR materials (medium / high graphics)
  let envTex = null;
  if (quality.detail >= 0.7 && renderer && THREE.PMREMGenerator) {
    try {
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
      const glint = new THREE.Mesh(new THREE.SphereGeometry(70, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfff1c0, fog: false }));
      glint.position.set(0.6 * 900, 0.8 * 900, 0.4 * 900);
      envScene.add(glint);
      const pm = new THREE.PMREMGenerator(renderer);
      envTex = pm.fromScene(envScene, 0.02).texture;
      pm.dispose();
      scene.environment = envTex;
      scene.environmentIntensity = 0.5;
    } catch {
      envTex = null; // no environment: the materials still work with the direct lights
    }
  }

  const rng = mulberry32(WORLD_SEED + 1);
  const obs = [];
  buildTrees(rng, quality.shadows, obs, windU, detail).forEach((m) => scene.add(m));
  const rockObs = []; // rocks are not circles: they have their own walkable surface
  scene.add(buildRocks(rng, quality.shadows, rockObs));
  const rockSurf = createRockSurface(rockObs, ROCK_PROFILE);
  scene.add(buildGrass(rng, windU, detail));
  // sea floor, desert and volcano props: they use their own random stream, so the trees / rocks / grass above keep their places
  const prng = mulberry32(WORLD_SEED + 55);
  const flora = [];
  const kelpPts = scatter(prng, Math.round(320 * detail), 5000, (x, z, h) => h < -2 && h > -12 && prng() < 0.3);
  if (kelpPts.length) {
    const km = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    addWind(km, windU, 0.07); // the kelp sways in the current
    flora.push(placeInstanced(kelpGeo(), km, kelpPts, prng, 0.9, 1.9));
  }
  // reefs: colonies grow in patches on the shallow sea floor around the island, a mix of types in each patch (not scattered evenly)
  const reefCentres = scatter(prng, Math.round(10 + 12 * detail), 9000, (x, z, h) => h < -1.8 && h > -7.5 && prng() < 0.25);
  const types = coralTypes();
  const wSum = types.reduce((a, t) => a + t.w, 0);
  const buckets = types.map(() => []);
  reefCentres.forEach((c) => {
    const n = Math.round(10 + 10 * detail);
    for (let i = 0; i < n; i++) {
      const a = prng() * Math.PI * 2;
      const r = Math.sqrt(prng()) * 7;
      const x = c.x + Math.cos(a) * r;
      const z = c.z + Math.sin(a) * r;
      const h = heightAt(x, z);
      if (h > -1.5 || h < -9) continue;
      let pick = prng() * wSum;
      let k = 0;
      while (k < types.length - 1 && (pick -= types[k].w) > 0) k++;
      buckets[k].push({ x, y: h - 0.05, z });
    }
  });
  types.forEach((t, k) => {
    if (!buckets[k].length) return;
    const cm = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    if (t.sway) addWind(cm, windU, 0.05); // fans and anemones move gently in the current
    flora.push(placeInstanced(t.geo, cm, buckets[k], prng, 0.8, 1.7));
  });
  const cactusPts = scatter(prng, Math.round(110 * detail), 5000, (x, z, h) => h > 1.2 && biomeAt(x, z, h) === BIOME.DESERT && prng() < 0.12);
  if (cactusPts.length) {
    flora.push(placeInstanced(cactusGeo(), new THREE.MeshLambertMaterial({ vertexColors: true }), cactusPts, prng, 0.8, 1.5));
    cactusPts.forEach((c) => obs.push({ x: c.x, z: c.z, r: 0.5, top: c.y + 2.4, tree: true }));
  }
  const lavaPts = scatter(prng, Math.round(28 * detail), 6000, (x, z, h) => h > 22 && biomeAt(x, z, h) === BIOME.VOLCANIC && prng() < 0.05);
  const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff5a14, fog: true });
  if (lavaPts.length) {
    const lava = new THREE.InstancedMesh(new THREE.CircleGeometry(1, 10).rotateX(-Math.PI / 2), lavaMat, lavaPts.length);
    const ld = new THREE.Object3D();
    lavaPts.forEach((p, i) => {
      ld.position.set(p.x, p.y + 0.12, p.z);
      ld.rotation.set(0, 0, 0);
      ld.scale.setScalar(1.6 + prng() * 2.6);
      ld.updateMatrix();
      lava.setMatrixAt(i, ld.matrix);
    });
    lava.frustumCulled = false;
    flora.push(lava);
  }
  flora.forEach((m) => scene.add(m));
  // schools of fish circling in the sea (the same schools the pteranodon hunts: see fishSchools in the shared ai code)
  const schools = fishSchools().slice(0, Math.max(8, Math.round(fishSchools().length * (0.4 + 0.6 * detail))));
  const FISH_PER = FISH.PER;
  const fish = schools.length ? new THREE.InstancedMesh(fishGeo(), new THREE.MeshLambertMaterial({ vertexColors: true }), schools.length * FISH_PER) : null;
  if (fish) {
    const tints = [[1, 1, 1], [1, 0.82, 0.5], [0.65, 0.95, 1], [1, 0.6, 0.55]];
    const col = new THREE.Color();
    schools.forEach((sc, i) => {
      const t = tints[Math.floor(sc.hue * tints.length) % tints.length];
      for (let j = 0; j < FISH_PER; j++) {
        const v = 0.85 + 0.15 * ((i * 7 + j * 3) % 5) / 4;
        col.setRGB(t[0] * v, t[1] * v, t[2] * v);
        fish.setColorAt(i * FISH_PER + j, col);
      }
    });
    fish.frustumCulled = false;
    scene.add(fish);
  }
  const fishD = new THREE.Object3D();
  const fp = { x: 0, y: 0, z: 0, yaw: 0 };

  // ---- day / night cycle and weather (clear -> cloudy -> rain -> storm -> fog, smooth transitions) ----
  const DAY_LEN = 720; // seconds for a whole day
  const WX = {
    clear: { cloud: 0, rain: 0, fog: 0, storm: 0 },
    cloudy: { cloud: 0.55, rain: 0, fog: 0, storm: 0 },
    rain: { cloud: 0.85, rain: 0.75, fog: 0.25, storm: 0 },
    storm: { cloud: 1, rain: 1, fog: 0.35, storm: 1 },
    fog: { cloud: 0.35, rain: 0, fog: 1, storm: 0 },
  };
  const WX_WEIGHTS = [['clear', 40], ['cloudy', 20], ['rain', 18], ['storm', 10], ['fog', 12]];
  const wx = { name: 'clear', t: 80, cloud: 0, rain: 0, fog: 0, storm: 0, flash: 0, flashIn: 8, boltT: 0 };
  const pickWeather = () => {
    let r = Math.random() * WX_WEIGHTS.reduce((a, b) => a + b[1], 0);
    for (const [n, w] of WX_WEIGHTS) { r -= w; if (r <= 0) return n; }
    return 'clear';
  };
  const DROPS = Math.round(350 + 650 * detail);
  const dropRel = new Float32Array(DROPS * 3);
  for (let i = 0; i < DROPS; i++) dropRel.set([(Math.random() - 0.5) * 60, Math.random() * 26, (Math.random() - 0.5) * 60], i * 3);
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DROPS * 6), 3));
  const rainMat = new THREE.LineBasicMaterial({ color: 0xb8cde6, transparent: true, opacity: 0.4, depthWrite: false });
  const rainLines = new THREE.LineSegments(rainGeo, rainMat);
  rainLines.frustumCulled = false;
  rainLines.visible = false;
  scene.add(rainLines);
  const snowGeo = new THREE.BufferGeometry();
  snowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DROPS * 3), 3));
  const snowPts = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.9, depthWrite: false }));
  snowPts.frustumCulled = false;
  snowPts.visible = false;
  scene.add(snowPts);
  const boltGeo = new THREE.BufferGeometry();
  boltGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(14 * 3), 3));
  const bolt = new THREE.Line(boltGeo, new THREE.LineBasicMaterial({ color: 0xeaf0ff, fog: false, transparent: true, opacity: 0.95 }));
  bolt.frustumCulled = false;
  bolt.visible = false;
  scene.add(bolt);

  const horizonDay = sky.clone(); // the day-time horizon colour (the dome gradient is baked from it)
  const cNight = new THREE.Color(0.05, 0.07, 0.16);
  const cDusk = new THREE.Color(1.0, 0.62, 0.5);
  const cStorm = new THREE.Color(0.32, 0.35, 0.4);
  const M = new THREE.Color();
  const tmp = new THREE.Color();
  const sunDir = new THREE.Vector3();
  const cSunDay = new THREE.Color(0xfff1d6);
  const cSunDusk = new THREE.Color(0xff9a50);
  const cUnder = new THREE.Color(0.05, 0.3, 0.42);
  let underwater = false;

  const CELL = 12;
  const grid = new Map();
  for (const o of obs) {
    const k = Math.floor(o.x / CELL) * 4096 + Math.floor(o.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(o);
  }

  return {
    // what a character stands on at (x, z) with its feet at height y: the terrain, or a rock top it can step / jump onto (installed with setGroundFn)
    ground(x, z, y, ch) {
      const g = heightAt(x, z);
      const r = rockSurf.support(x, z, y, ch.step);
      return r !== null && r > g ? r : g;
    },
    // push a fighter out of trees (a T-Rex tramples them) and slide it along rock walls; a rock lower than the feet can step up is walked onto
    collide(f) {
      const rad = f.kind === 'human' ? CHARACTERS.human.radius : CHARACTERS[f.kind].radius * 0.6;
      const cx = Math.floor(f.x / CELL);
      const cz = Math.floor(f.z / CELL);
      for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
          const list = grid.get((cx + i) * 4096 + (cz + j));
          if (!list) continue;
          for (const o of list) {
            if (f.kind === 'trex' && (o.tree || o.top - heightAt(o.x, o.z) < 1.2)) continue;
            if (f.y > o.top - 0.1) continue;
            const dx = f.x - o.x;
            const dz = f.z - o.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const min = o.r + rad;
            if (d < min) {
              if (d > 1e-6) {
                f.x = o.x + (dx / d) * min;
                f.z = o.z + (dz / d) * min;
              } else {
                f.x = o.x + min;
              }
            }
          }
        }
      }
      rockSurf.collide(f, CHARACTERS[f.kind].step);
    },
    // current weather name, the hour of the day (0..24) and whether the camera is under water (for the HUD and the sounds)
    get weather() { return wx.name; },
    get hour() { return (((0.3 + this.clock / DAY_LEN) % 1) * 24 + 0) % 24; },
    get underwater() { return underwater; },
    clock: 0,
    onThunder: null, // (distanceMetres) => void : the game plays the rumble
    // every frame: wind/water clock, sun and moon on a day cycle (and their shadows), weather, drifting clouds, centred on the player
    update(focus, time = 0, camPos = null, dt = 0.016) {
      this.clock = time;
      windU.value = time;
      // ---- hour of the day: 0.25 sunrise, 0.5 noon, 0.75 sunset, 0 / 1 midnight (the game starts in the morning)
      const tod = (0.3 + time / DAY_LEN) % 1;
      const ang = (tod - 0.25) * Math.PI * 2;
      const ey = Math.sin(ang);
      sunDir.set(Math.cos(ang) * 0.9, ey, Math.cos(ang) * 0.4).normalize();
      const dayAmt = smoothstep(-0.12, 0.28, ey);
      const dusk = Math.max(0, 1 - Math.abs(ey) / 0.3) * 0.9;
      // ---- weather state machine
      wx.t -= dt;
      if (wx.t <= 0) {
        wx.name = pickWeather();
        wx.t = 50 + Math.random() * 70;
      }
      const tg = WX[wx.name];
      const k = Math.min(1, 0.25 * dt);
      for (const key of ['cloud', 'rain', 'fog', 'storm']) wx[key] += (tg[key] - wx[key]) * k;
      // ---- sky tint, fog colour, light colours
      M.copy(cNight).lerp(new THREE.Color(1, 1, 1), dayAmt).lerp(cDusk, dusk);
      const lum = M.r * 0.3 + M.g * 0.59 + M.b * 0.11;
      tmp.setRGB(lum, lum, lum).multiplyScalar(0.72 - 0.35 * wx.storm);
      M.lerp(tmp, Math.min(0.95, wx.cloud * 0.75 + wx.storm * 0.2));
      domeMat.color.copy(M);
      const fogCol = horizonDay.clone().multiply(M);
      let near = 120 - 110 * wx.fog - 50 * wx.rain;
      let far = 520 - 400 * wx.fog - 200 * wx.rain - 60 * wx.storm;
      underwater = !!camPos && camPos.y < water.position.y - 0.05;
      if (underwater) {
        const depthK = clamp(1 + camPos.y / 28, 0.2, 1);
        fogCol.copy(cUnder).multiplyScalar((0.22 + 0.78 * dayAmt) * depthK);
        near = 1;
        far = 26 + 40 * depthK;
      }
      scene.fog.color.copy(fogCol);
      scene.fog.near = near;
      scene.fog.far = far;
      if (scene.background && scene.background.isColor) scene.background.copy(fogCol);
      skyGroup.visible = !underwater;
      // ---- lightning (storms)
      if (wx.storm > 0.6 && !underwater) {
        wx.flashIn -= dt;
        if (wx.flashIn <= 0) {
          wx.flashIn = 4 + Math.random() * 9;
          wx.flash = 1;
          wx.boltT = 0.28;
          const a = Math.random() * Math.PI * 2;
          const r = 40 + Math.random() * 180;
          let bx = focus.x + Math.cos(a) * r;
          let bz = focus.z + Math.sin(a) * r;
          const bp = boltGeo.attributes.position;
          for (let i = 0; i < 14; i++) {
            bp.setXYZ(i, bx, 150 - i * (150 - heightAt(bx, bz)) / 13, bz);
            bx += (Math.random() - 0.5) * 9;
            bz += (Math.random() - 0.5) * 9;
          }
          bp.needsUpdate = true;
          if (this.onThunder) this.onThunder(r);
        }
      }
      wx.flash = Math.max(0, wx.flash - dt * 4);
      wx.boltT = Math.max(0, wx.boltT - dt);
      bolt.visible = wx.boltT > 0 && !underwater;
      // ---- lights
      const sunI = dayAmt * 2.2 * (1 - 0.55 * wx.storm - 0.25 * wx.cloud);
      const moonI = (1 - dayAmt) * 0.38;
      const up = ey > -0.05 ? 1 : -1; // the shadow-casting light is the sun by day and the moon (the opposite side of the sky) by night
      sun.intensity = (sunI + moonI) * (underwater ? 0.5 : 1) + wx.flash * 2;
      sun.color.copy(cSunDay).lerp(cSunDusk, dusk).lerp(new THREE.Color(0x9fb4ff), 1 - dayAmt);
      hemi.intensity = (0.28 + 0.95 * dayAmt) * (1 - 0.3 * wx.cloud) + wx.flash * 1.6;
      if (scene.environment) scene.environmentIntensity = (0.12 + 0.4 * dayAmt) * (1 - 0.5 * wx.cloud);
      sun.position.set(focus.x + sunDir.x * up * 140, focus.y + sunDir.y * up * 140, focus.z + sunDir.z * up * 140);
      sun.target.position.set(focus.x, focus.y, focus.z);
      sun.target.updateMatrixWorld();
      skyGroup.position.set(focus.x, 0, focus.z);
      sunDisc.position.set(sunDir.x * 900, sunDir.y * 900, sunDir.z * 900);
      moonDisc.position.set(-sunDir.x * 900, -sunDir.y * 900, -sunDir.z * 900);
      starMat.opacity = clamp(1 - dayAmt * 1.6, 0, 1) * (1 - wx.cloud * 0.9);
      cloudMat.opacity = 0.5 + 0.45 * Math.max(wx.cloud, 0.3);
      cloudMat.color.copy(M).lerp(new THREE.Color(1, 1, 1), 0.25 * dayAmt);
      cloudMat.color.multiplyScalar(1 - 0.5 * wx.storm);
      clouds.forEach((c) => { c.position.x = ((c.userData.x0 + time * c.userData.speed * (1 + wx.storm) + 700) % 1400 + 1400) % 1400 - 700; });
      water.position.y = Math.sin(time * 0.8) * 0.04;
      // ---- rain / snow around the camera (snow instead of rain high on the mountains)
      const cp = camPos || focus;
      const snowK = wx.rain * smoothstep(22, 30, cp.y);
      const rainK = wx.rain * (1 - snowK);
      rainLines.visible = rainK > 0.05 && !underwater;
      snowPts.visible = snowK > 0.05 && !underwater;
      if (rainLines.visible) {
        rainMat.opacity = 0.45 * rainK;
        const rp = rainGeo.attributes.position;
        const wind = 3 + 6 * wx.storm;
        const n = Math.round(DROPS * rainK);
        for (let i = 0; i < DROPS; i++) {
          if (i >= n) { rp.setXYZ(i * 2, 0, -999, 0); rp.setXYZ(i * 2 + 1, 0, -999, 0); continue; }
          let y = dropRel[i * 3 + 1] - 30 * dt;
          if (y < 0) y += 26;
          dropRel[i * 3 + 1] = y;
          const x = cp.x + dropRel[i * 3];
          const z = cp.z + dropRel[i * 3 + 2];
          const yy = cp.y - 8 + y;
          rp.setXYZ(i * 2, x, yy, z);
          rp.setXYZ(i * 2 + 1, x + wind * 0.03, yy + 0.9, z);
        }
        rp.needsUpdate = true;
      }
      if (snowPts.visible) {
        const sp = snowGeo.attributes.position;
        for (let i = 0; i < DROPS; i++) {
          let y = dropRel[i * 3 + 1] - 3 * dt;
          if (y < 0) y += 26;
          dropRel[i * 3 + 1] = y;
          sp.setXYZ(i, cp.x + dropRel[i * 3] + Math.sin(time + i) * 0.6, cp.y - 8 + y, cp.z + dropRel[i * 3 + 2]);
        }
        sp.needsUpdate = true;
      }
      // ---- lava glow, fish
      lavaMat.color.setRGB(1, 0.32 + 0.12 * Math.sin(time * 2.1), 0.07);
      FISH.now = time; // the hunters read the same clock
      if (fish) {
        let n = 0;
        for (const sc of schools) {
          for (let j = 0; j < FISH_PER; j++) {
            fishPos(sc, j, time, fp);
            const gone = sc.hidden[j] > time; // caught by a pteranodon: it is back after 35 s
            fishD.position.set(fp.x, fp.y, fp.z);
            fishD.rotation.set(0, fp.yaw + 0.18 * Math.sin(time * 9 + j * 2 + sc.ph), 0); // the tail beat swings the body
            fishD.scale.setScalar(gone ? 0.0001 : sc.surface ? 0.9 : 1.15);
            fishD.updateMatrix();
            fish.setMatrixAt(n++, fishD.matrix);
          }
        }
        fish.instanceMatrix.needsUpdate = true;
      }
    },
    dispose() {
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
        }
      });
    },
  };
}

// ===== client/js/wildlife.js =====
// Ambient dinosaurs. Every one runs on EXACTLY the same brain as the T-Rex enemy (shared/ai.js): it is calm until attacked,
// roams the island, eats tufts of grass and drinks at the shore on its own schedule (see NEEDS_BY), turns hostile when it is
// hurt or threatened, fights with the same rules (shared/combat.js) and calms down again when the player escapes.
// New in the ecosystem: a herd / pack alerts its own kind - when one member is attacked the others join the fight.
const WILD = {
  tricera: { n: 2, color: '#e6c11c' }, // herd of heavy horned herbivores: charge and gore
  raptor: { n: 3, color: '#16336b' }, // pack of fast hunters: flank the target and bite
  ptero: { n: 2, color: '#8fa7b8' }, // flyers (ice): glide over the island, swoop when provoked, land to rest now and then
  mosa: { n: 1, color: '#2d5f7a' }, // sea hunter (water): dives, and drags swimmers of other elements under
  plesio: { n: 2, color: '#3f8f86' }, // long-necked sea creatures (water): the same
};

// A random dry spot anywhere on the island (at least 60 m from the player) for the war-mode T-Rex.
function randomEnemySpot(world, player) {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  for (let i = 0; i < 400; i++) {
    const a = rng() * Math.PI * 2;
    const r = 60 + rng() * WORLD_RADIUS * 0.6;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const h = heightAt(x, z);
    if (h < 2.5 || h > 22 || Math.hypot(x - player.x, z - player.z) < 60 || !foodSpotFree(world, x, z)) continue;
    return { x, z };
  }
  return findEnemySpawn(player.x, player.z, player.heading);
}

function spawnWildlife(scene, player, world, detail, food, round) {
  const rng = mulberry32(WORLD_SEED + 7);
  const list = [];
  for (const kind of Object.keys(WILD)) {
    const n = Math.max(1, Math.round(WILD[kind].n * (0.5 + detail / 2)));
    let ax = 0;
    let az = 0;
    for (let i = 0, tries = 0; i < n && tries < 500; tries++) {
      const first = i === 0;
      const a = rng() * Math.PI * 2;
      const r = first ? (CHARACTERS[kind].aquatic ? 150 + rng() * (WORLD_RADIUS * 0.95 - 150) : 70 + rng() * WORLD_RADIUS * 0.45) : 3 + rng() * 7; // sea creatures start out in the open sea
      const x = (first ? 0 : ax) + Math.cos(a) * r;
      const z = (first ? 0 : az) + Math.sin(a) * r;
      const h = heightAt(x, z);
      const sea = !!CHARACTERS[kind].aquatic;
      if (sea ? h > -5 || Math.hypot(x - player.x, z - player.z) < 40 : h < 2.5 || h > 22 || Math.hypot(x - player.x, z - player.z) < 60 || !foodSpotFree(world, x, z)) continue;
      if (first) { ax = x; az = z; }
      const f = createFighter(`${kind}${i}`, kind, x, z, rng() * Math.PI * 2);
      if (sea) { // starts in the open water at a random depth
        f.y = Math.max(h + 1, -1.5 - rng() * 4);
        f.swimming = true;
        f.diving = true;
      }
      f.maxHp = Math.round(f.maxHp * Math.min(2, 1 + 0.12 * (round - 1))); // tougher every round, like the enemy
      f.hp = f.maxHp;
      f.dmgMul = Math.min(1.6, 1 + 0.08 * (round - 1));
      f.ai = true;
      const model = createCharacter(kind, WILD[kind].color);
      scene.add(model.root);
      const mem = createAiMemory(round, food, kind);
      mem.mealAt += rng() * 30; // so the herd does not all get hungry at the same second
      list.push({ f, model, kind, mem });
      i++;
    }
  }
  return list;
}

// Water dinosaurs choose a swimmer to drag under (the closest creature of another element that is in deep water) and hold it down until it drowns.
function updateHunts(fs, wild, dt, evs) {
  for (const w of wild) {
    const f = w.f;
    if (!f.alive || f.ridden || !isWaterDino(f)) { w.mem.prey = null; continue; }
    if (f.grab) { w.mem.prey = f.grab; continue; }
    let best = null;
    let bd = 34;
    for (const v of fs) {
      if (!canBeDragged(f, v)) continue;
      const d = Math.hypot(v.x - f.x, v.z - f.z);
      if (d < bd) { bd = d; best = v; }
    }
    w.mem.prey = best;
  }
  applyGrabs(fs, dt, evs);
}

function updateWildlife(list, player, world, dt, evs) {
  for (const a of list) { // herd / pack alarm
    if (!a.mem.provoked || !a.f.alive) continue;
    for (const b of list) {
      if (b === a || b.kind !== a.kind || !b.f.alive || b.mem.provoked || Math.hypot(a.f.x - b.f.x, a.f.z - b.f.z) > 45) continue;
      b.mem.provoked = true;
      b.mem.delay = 0.35;
      b.mem.farT = 0;
      cancelNeeds(b.mem);
    }
  }
  for (const w of list) {
    const f = w.f;
    if (player.ride === f) continue; // ridden: the player drives it
    checkProvoked(player, f, w.mem);
    const ec = aiInput(f, player, dt, w.mem);
    stepPlayer(f, ec, dt, CHARACTERS[f.kind]);
    world.collide(f);
    updateCombat(f, [player], ec, dt, evs);
    if (f.alive && player.alive) separate(player, f);
  }
}

// ===== client/js/ecosystem.js =====
// Renewal of the species, done by the dinosaurs themselves. When a wild dinosaur dies, 20 MINUTES later a living ADULT of the same species lays an egg:
// she stops (a flyer lands first), crouches for a few seconds and the egg appears behind her. The egg incubates, cracks, wobbles and hatches into a very small
// baby of that species. The baby grows up only from the food it eats (every meal / fish / drink it finishes makes it bigger). One death owes exactly one egg.
// If no adult of the species is alive, the egg waits until one is.
// Timers are wall-clock times in localStorage, so the 20 minutes keep running while the game is closed and a reload never duplicates an egg:
//   slot = { kind, state: 'dead' | 'egg' | 'alive', diedAt, laidAt, hatchAt, hatchedAt, eats, ex, ey, ez }   (one slot per wild dinosaur id)
const ECO_KEY = 'dino-world-ecosystem-v1';
const RENEW_MS = 20 * 60 * 1000; // the rule: 20 minutes after the death
const INCUBATE_MS = 2 * 60 * 1000; // incubation, from laying to hatching
const MEALS_ADULT = 7; // meals (events) a baby needs to be a full adult
const BABY_SCALE = 0.2; // size of a newborn compared with an adult
const EGG_DIM = { trex: 0.7, tricera: 0.62, raptor: 0.42, ptero: 0.38, mosa: 0.85, plesio: 0.75 }; // egg height in metres, per species
const EGG_TINT = { // [shell colour, speckle colour]
  trex: ['#d8c8a0', '#6e5530'], tricera: ['#c9d3b0', '#52663a'], raptor: ['#e0d6bd', '#7a4f3a'],
  ptero: ['#e9e4d6', '#8f8a7a'], mosa: ['#b9cfd2', '#3f6a78'], plesio: ['#c6dccb', '#3d7a62'],
};

function loadEco() {
  try {
    const o = JSON.parse(localStorage.getItem(ECO_KEY));
    if (o && o.slots) return o;
  } catch { /* nothing saved yet */ }
  return { slots: {} };
}
function saveEco(eco) {
  try { localStorage.setItem(ECO_KEY, JSON.stringify(eco)); } catch { /* storage unavailable */ }
}

// a safe place for the egg, searching in a spiral from where the dinosaur died: dry flat ground for land animals and the flyer, the shallow sea floor for sea creatures
function findEggSpot(kind, x, z, world) {
  const aquatic = !!CHARACTERS[kind].aquatic;
  for (let ring = 0; ring < 120; ring++) {
    const n = ring === 0 ? 1 : 8 + ring * 2;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + ring * 0.7;
      const px = x + Math.cos(a) * ring * 4;
      const pz = z + Math.sin(a) * ring * 4;
      if (Math.hypot(px, pz) > WORLD_RADIUS * 0.95) continue;
      const h = heightAt(px, pz);
      if (aquatic) {
        if (h > -4.5 || h < -7) continue;
      } else {
        if (h < 2 || h > 22) continue;
        if (Math.abs(heightAt(px + 2, pz) - h) + Math.abs(heightAt(px, pz + 2) - h) > 3) continue; // not on a slope
        if (!foodSpotFree(world, px, pz)) continue; // not inside a tree or rock
      }
      return { x: px, z: pz, y: h };
    }
  }
  return { x, z, y: heightAt(x, z) };
}

function eggTexture(kind) {
  try {
    const [shell, speck] = EGG_TINT[kind] || EGG_TINT.trex;
    const S = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    if (!g) return null;
    g.fillStyle = shell;
    g.fillRect(0, 0, S, S);
    const rnd = mulberry32(kind.length * 31 + 5);
    g.fillStyle = speck;
    for (let i = 0; i < 70; i++) {
      g.globalAlpha = 0.25 + rnd() * 0.5;
      g.beginPath();
      g.ellipse(rnd() * S, rnd() * S, 1.5 + rnd() * 4, 1 + rnd() * 3, rnd() * 3, 0, Math.PI * 2);
      g.fill();
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  } catch {
    return null;
  }
}

// the egg (with its nest on land): intact -> cracks appear -> it wobbles -> it bursts into two halves
function createEggVisual(kind, x, y, z) {
  const H = EGG_DIM[kind] || 0.6;
  const aquatic = !!CHARACTERS[kind].aquatic;
  const root = new THREE.Group();
  root.position.set(x, y, z);
  const lift = aquatic ? 0.02 : 0.1;
  if (!aquatic) { // a nest of dried grass and a ring of small stones
    const nest = new THREE.Mesh(new THREE.TorusGeometry(H * 0.95, H * 0.17, 6, 16).rotateX(Math.PI / 2).translate(0, H * 0.1, 0), lambert(0x6e5530));
    nest.receiveShadow = true;
    root.add(nest);
    const rng = mulberry32(Math.floor(x * 13 + z * 7));
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + rng();
      root.add(ball(H * (0.08 + rng() * 0.06), lambert(0x8a8478), Math.cos(a) * H * 1.2, H * 0.06, Math.sin(a) * H * 1.2, 1, 0.6, 1, 6, false));
    }
  }
  const mat = pbr(0xffffff, 0.5);
  mat.map = eggTexture(kind);
  mat.side = THREE.DoubleSide;
  const body = new THREE.Group();
  body.position.y = lift + H * 0.5;
  const egg = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14).scale(H * 0.37, H * 0.5, H * 0.37), mat);
  egg.castShadow = true;
  body.add(egg);
  // cracks: dark zig-zag lines on the upper half, shown one after the other as hatching comes closer
  const crackMat = new THREE.MeshBasicMaterial({ color: 0x2b2118 });
  const cracks = [];
  const crng = mulberry32(kind.length * 97 + Math.floor(x));
  const surf = (th, ph) => [Math.sin(th) * Math.cos(ph) * H * 0.37 * 1.01, Math.cos(th) * H * 0.5 * 1.01, Math.sin(th) * Math.sin(ph) * H * 0.37 * 1.01];
  for (let k = 0; k < 7; k++) {
    const ph0 = (k / 7) * Math.PI * 2 + crng() * 0.5;
    const grp = new THREE.Group();
    let th = 0.25 + crng() * 0.3;
    let ph = ph0;
    let prev = surf(th, ph);
    for (let s = 0; s < 4; s++) {
      th += 0.22 + crng() * 0.2;
      ph += (crng() - 0.5) * 0.5;
      const cur = surf(th, ph);
      grp.add(new THREE.Mesh(tube(prev, cur, H * 0.011, H * 0.008, 3), crackMat));
      prev = cur;
    }
    grp.visible = false;
    body.add(grp);
    cracks.push(grp);
  }
  // the two halves of the shell (hidden until it bursts)
  const half = (up) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 8, 0, Math.PI * 2, up ? 0 : Math.PI / 2, Math.PI / 2).scale(H * 0.37, H * 0.5, H * 0.37), mat);
    m.castShadow = true;
    m.visible = false;
    return m;
  };
  const top = half(true);
  const bottom = half(false);
  body.add(top, bottom);
  root.add(body);
  return { root, body, egg, top, bottom, cracks, H, shownCracks: 0, burstT: -1, vy: 0, wobT: 0 };
}

function createEcosystem(scene, world, sfx) {
  const eco = loadEco();
  const eggs = new Map(); // slot id -> visual
  const bursting = [];
  const mothers = new Set(); // slot ids whose egg a mother is laying right now (not saved: after a reload the egg is simply due again)
  const showEgg = (id, sl) => {
    if (eggs.has(id)) return;
    const v = createEggVisual(sl.kind, sl.ex, sl.ey, sl.ez);
    v.slot = sl;
    scene.add(v.root);
    eggs.set(id, v);
  };
  // eggs that were already lying there when the game was closed
  for (const [id, sl] of Object.entries(eco.slots)) if (sl.state === 'egg') showEgg(id, sl);
  let dirty = false;
  const growthOf = (sl) => clamp(BABY_SCALE + (1 - BABY_SCALE) * ((sl.eats || 0) / MEALS_ADULT), BABY_SCALE, 1);
  return {
    slot: (id) => eco.slots[id],
    all: () => Object.entries(eco.slots),
    // the first time a wild dinosaur is seen dead: the 20 minutes start now
    recordDeath(f, now) {
      eco.slots[f.id] = { kind: f.kind, state: 'dead', diedAt: now };
      saveEco(eco);
    },
    // an egg that is owed without a death (once per save): due after delayMs. Used for the first pterosaur clutch near the start.
    owe(id, kind, now, delayMs) {
      if (eco.slots[id]) return;
      eco.slots[id] = { kind, state: 'dead', diedAt: now + delayMs - RENEW_MS };
      saveEco(eco);
    },
    takeMother: (id) => { mothers.add(id); },
    cancelMother: (id) => { mothers.delete(id); },
    // the mother has finished laying: the egg appears at (x, z) (moved to a safe spot if needed) and starts to incubate
    layEgg(id, x, z, now) {
      const sl = eco.slots[id];
      mothers.delete(id);
      if (!sl || sl.state !== 'dead') return null;
      const spot = findEggSpot(sl.kind, x, z, world);
      Object.assign(sl, { state: 'egg', laidAt: now, hatchAt: now + INCUBATE_MS, ex: spot.x, ey: spot.y, ez: spot.z });
      saveEco(eco);
      showEgg(id, sl);
      return spot;
    },
    setEats(id, n) {
      const sl = eco.slots[id];
      if (sl) { sl.eats = n; dirty = true; }
    },
    // clock tick (about twice a second). Returns what happened: { type: 'due' } (an egg is owed and needs a mother) and { type: 'hatch' }.
    update(now) {
      const evs = [];
      for (const [id, sl] of Object.entries(eco.slots)) {
        if (sl.state === 'dead' && now >= sl.diedAt + RENEW_MS && !mothers.has(id)) evs.push({ type: 'due', id, kind: sl.kind });
        if (sl.state === 'egg' && now >= sl.hatchAt) {
          sl.state = 'alive';
          sl.hatchedAt = sl.hatchAt;
          sl.eats = 0;
          dirty = true;
          const v = eggs.get(id);
          if (v) { // it bursts open in front of the player
            v.burstT = 0;
            v.vy = 2.2;
            v.top.visible = v.bottom.visible = true;
            v.egg.visible = false;
            v.cracks.forEach((cr) => { cr.visible = false; });
            bursting.push([id, v]);
            sfx('hatch', sl.ex, sl.ez);
          }
          evs.push({ type: 'hatch', id, kind: sl.kind, x: sl.ex, y: sl.ey, z: sl.ez, growth: growthOf(sl) });
        }
      }
      if (dirty) { saveEco(eco); dirty = false; }
      return evs;
    },
    growthOf,
    // every frame: the incubation (cracks, wobble) and the burst
    frame(dt, t, now) {
      for (const [id, v] of eggs) {
        const sl = v.slot;
        if (sl.state !== 'egg') continue;
        const p = clamp((now - sl.laidAt) / INCUBATE_MS, 0, 1);
        const want = p < 0.5 ? 0 : Math.min(v.cracks.length, 1 + Math.floor((p - 0.5) / 0.5 * v.cracks.length));
        while (v.shownCracks < want) {
          v.cracks[v.shownCracks++].visible = true;
          sfx('crack', sl.ex, sl.ez);
        }
        const amp = smoothstep(0.7, 1, p) * 0.16; // restless as it gets close: short wobbling fits every couple of seconds
        const burst = Math.max(0, Math.sin(t * 2.1 + v.H * 9)) ** 2;
        v.body.rotation.z = Math.sin(t * 17) * amp * burst;
        v.body.rotation.x = Math.cos(t * 13) * amp * 0.7 * burst;
        if (amp * burst > 0.1 && Math.floor(t * 17 / Math.PI) !== v.lastTap) {
          v.lastTap = Math.floor(t * 17 / Math.PI);
          if (v.lastTap % 4 === 0) sfx('tap', sl.ex, sl.ez);
        }
      }
      for (let i = bursting.length - 1; i >= 0; i--) {
        const [id, v] = bursting[i];
        v.burstT += dt;
        v.vy -= 6 * dt;
        v.top.position.y = Math.max(0, v.top.position.y + v.vy * dt * 0.5);
        v.top.rotation.z = Math.min(1.1, v.burstT * 2.4);
        v.top.position.x = Math.min(0.5 * v.H, v.burstT * 0.6);
        v.bottom.rotation.z = -Math.min(0.35, v.burstT * 0.8);
        const fade = clamp(1 - (v.burstT - 4) / 2, 0, 1); // the shell stays for 4 s, then shrinks away
        v.body.scale.setScalar(fade);
        if (v.burstT > 6) {
          scene.remove(v.root);
          eggs.delete(id);
          bursting.splice(i, 1);
        }
      }
    },
    // the egg close to the player, for the HUD ("egg · hatches in mm:ss")
    nearInfo(px, pz, now) {
      let best = null;
      let bd = 9;
      for (const [id, v] of eggs) {
        const sl = v.slot;
        if (sl.state !== 'egg') continue;
        const d = Math.hypot(sl.ex - px, sl.ez - pz);
        if (d < bd) { bd = d; best = { kind: sl.kind, left: Math.max(0, Math.ceil((sl.hatchAt - now) / 1000)), cracked: v.shownCracks > 0 }; }
      }
      return best;
    },
    // eggs far from the player are not drawn (they cost nothing, but there is no reason to render them)
    cull(px, pz) {
      for (const v of eggs.values()) v.root.visible = Math.hypot(v.slot.ex - px, v.slot.ez - pz) < 220 && v.burstT < 6;
    },
    count: () => eggs.size,
  };
}

// ===== client/js/game.js =====
// client/js/game.js — renderer, fixed-step simulation loop, third-person camera, war mode.
// Imported lazily by main.js so the menu works even if Three.js cannot be loaded.
//
// War mode (single-player vs AI): an opponent of the OTHER kind appears in front of you.
// The rules live in shared/combat.js + shared/ai.js; this file only feeds them input and draws the result.
// NOTE: the client decides hits here. When multiplayer arrives (Phase 5) the server takes over that job.


const QUALITY = {
  low: { pixelRatio: 1, shadows: false, shadowMap: 0, detail: 0.4 },
  medium: { pixelRatio: 1.5, shadows: true, shadowMap: 1024, detail: 0.75 },
  high: { pixelRatio: 2, shadows: true, shadowMap: 2048, detail: 1 },
  ultra: { pixelRatio: 2, shadows: true, shadowMap: 4096, detail: 1, filmic: true }, // v12: sharper shadows + anti-aliasing + filmic tone mapping
};

const CAMERA = {
  human: { dist: 5.5, lift: 1.5 },
  trex: { dist: 15, lift: 3.4 },
  tricera: { dist: 10, lift: 2.8 },
  raptor: { dist: 7, lift: 2.0 },
  ptero: { dist: 11, lift: 3.2 },
  mosa: { dist: 17, lift: 4.4 },
  plesio: { dist: 15, lift: 4.2 },
};
const SADDLE = { trex: [0, 3.4, 0.2], tricera: [0, 2.9, 0.15], raptor: [0, 1.5, 0.1], ptero: [0, 2.0, 0.25], mosa: [0, 2.9, 0.45], plesio: [0, 2.6, 0.15] }; // seat on the back (x, y, z in the dinosaur's own frame)

const ENEMY_COLORS = { human: '#5b2c6f', trex: '#7a3b2e' };
const STEP = 1 / 60;
const LOOK_SENS = 0.003;
const ROUND_END_DELAY = 1.4; // seconds between the last blow and the result screen
const IDLE = Object.freeze({ fwd: 0, strafe: 0, yaw: 0, run: false, jump: false, dive: false, attack: false, aim: false, aimYaw: 0 });

// tiny synthesized sound effects (no audio files); silently does nothing if audio is unavailable
let audioCtx = null;
function actx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, slide) {
  try {
    const ctx = actx();
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(now);
    o.stop(now + dur);
  } catch { /* audio unavailable */ }
}
// filtered noise burst: footsteps on different ground, splashes, landings
function noise(dur, vol, cutoff) {
  try {
    const ctx = actx();
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource();
    const f = ctx.createBiquadFilter();
    const g = ctx.createGain();
    src.buffer = buf;
    f.type = 'lowpass';
    f.frequency.value = cutoff;
    g.gain.value = vol;
    src.connect(f);
    f.connect(g);
    g.connect(ctx.destination);
    src.start();
  } catch { /* audio unavailable */ }
}
const SFX = {
  swing: () => tone(420, 0.12, 'sawtooth', 0.04, -250),
  hit: () => tone(140, 0.15, 'square', 0.06, -80),
  fire: () => tone(90, 0.3, 'sawtooth', 0.04, 40),
  death: () => tone(200, 0.6, 'triangle', 0.07, -150),
};
// movement sounds driven by the animation system; vol = 0..1 distance falloff
function animSound(e, kind, vol) {
  if (vol < 0.03) return;
  if (e.soft) vol *= 0.55; // stepping round on the spot is quieter
  const big = kind === 'trex' || kind === 'tricera' || kind === 'mosa' || kind === 'plesio';
  if (e.type === 'step') {
    if (big) {
      tone(80, 0.28, 'sine', 0.22 * vol, -50);
      noise(0.2, 0.1 * vol, 500);
    } else {
      noise(0.07, (0.04 + 0.04 * e.rn) * vol, e.surf === BIOME.ROCK || e.surf === BIOME.SNOW ? 3500 : e.surf === BIOME.BEACH ? 1100 : 1800);
    }
  } else if (e.type === 'jump') {
    if (big) tone(90, 0.2, 'sine', 0.15 * vol, 40);
    else noise(0.1, 0.05 * vol, 2200);
  } else if (e.type === 'land') {
    if (big) tone(60, 0.4, 'sine', 0.3 * vol * e.amt, -30);
    else noise(0.14, 0.1 * vol * e.amt, 900);
  } else if (e.type === 'splash') {
    noise(e.big ? 0.4 : 0.2, (e.big ? 0.12 : 0.05) * vol * (big ? 1.6 : 1), 2600);
  } else if (e.type === 'hurt') {
    if (big) tone(120, 0.45, 'sawtooth', 0.1 * vol, -70);
    else tone(280, 0.2, 'square', 0.06 * vol, -130);
  } else if (e.type === 'roar') {
    tone(75, 0.9, 'sawtooth', 0.12 * vol, 35);
    noise(0.7, 0.07 * vol, 700);
  } else if (e.type === 'sip') {
    noise(big ? 0.18 : 0.1, (big ? 0.08 : 0.04) * vol, 1500);
  } else if (e.type === 'chomp') {
    noise(big ? 0.09 : 0.05, (big ? 0.12 : 0.07) * vol, big ? 2200 : 3200);
  } else if (e.type === 'thud') {
    if (big) tone(50, 0.6, 'sine', 0.35 * vol, -20);
    else noise(0.2, 0.1 * vol, 700);
  }
}

function startGame({ container, kind, color, quality, war, touchRoot, onStats, onCombat, onRoundEnd, perks = {}, round = 1 }) {
  let q = QUALITY[quality] || QUALITY.medium;
  if (q.shadowMap > 2048 && window.matchMedia('(pointer: coarse)').matches) q = Object.assign({}, q, { shadowMap: 2048 }); // Ultra on a phone / tablet: same shadow size as High
  setCharDetail(q.detail);
  const ch = CHARACTERS[kind] || CHARACTERS.human;
